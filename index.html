<title>Тренажёр iOS-интервью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #FAF8F5;
    --surface: #FFFFFF;
    --ink: #23201B;
    --muted: #6E6961;
    --line: #E6E1D8;
    --accent: #C74E22;
    --accent-soft: #F7E8E0;
    --good: #2E7D4F;
    --good-soft: #E3F0E8;
    --warn: #A87B15;
    --warn-soft: #F5EDD8;
    --bad: #B0402A;
    --bad-soft: #F6E4DF;

    --shadow: 0 1px 2px rgba(35,32,27,.05), 0 4px 16px rgba(35,32,27,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #191713;
      --surface: #221F1A;
      --ink: #ECE7DF;
      --muted: #9C958A;
      --line: #38332B;
      --accent: #E4703F;
      --accent-soft: #3A2A21;
      --good: #6BBE8E;
      --good-soft: #24352B;
      --warn: #D5AE52;
      --warn-soft: #383019;
      --bad: #DE7A5C;
      --bad-soft: #3B2822;
      --code-bg: #2A2620;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --ground: #191713;
    --surface: #221F1A;
    --ink: #ECE7DF;
    --muted: #9C958A;
    --line: #38332B;
    --accent: #E4703F;
    --accent-soft: #3A2A21;
    --good: #6BBE8E;
    --good-soft: #24352B;
    --warn: #D5AE52;
    --warn-soft: #383019;
    --bad: #DE7A5C;
    --bad-soft: #3B2822;
    --code-bg: #2A2620;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Golos Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 90px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .progress-note { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }

  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 14px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .25s ease; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip {
    font-family: "Golos Text", sans-serif;
    font-size: 13.5px; font-weight: 500;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; opacity: .75; margin-left: 4px; }
  .chip.weak.on { background: var(--bad); border-color: var(--bad); }
  .chip.base.on { background: var(--good); border-color: var(--good); color: #fff; }
  .base-dot { color: var(--good); font-size: 9px; vertical-align: 2px; }

  .search {
    width: 100%;
    padding: 10px 14px;
    margin-bottom: 14px;
    border-radius: 10px;

    background: var(--surface);
    color: var(--ink);
    font-family: "Golos Text", sans-serif;
    font-size: 14.5px;
  }
  .search:focus { outline: none; border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 22px 22px 18px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .topic-tag {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 9px;
    border-radius: 6px;
  }
  .mark { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; padding: 4px 9px; border-radius: 6px; display: none; }
  .mark.know { display: inline; color: var(--good); background: var(--good-soft); }
  .mark.shaky { display: inline; color: var(--warn); background: var(--warn-soft); }
  .mark.miss { display: inline; color: var(--bad); background: var(--bad-soft); }

  .q { font-size: 19.5px; font-weight: 600; line-height: 1.4; text-wrap: balance; margin-bottom: 6px; }
  .hint { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }

  .viz { margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); }
  .viz svg { width: 100%; height: auto; display: block; }

  pre {
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    line-height: 1.5;
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-radius: 10px;

    overflow-x: auto;
    margin: 12px 0;

  .reveal-btn {
    display: block; width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px dashed var(--line);
    background: none;
    color: var(--accent);
    font-family: "Golos Text", sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .reveal-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  .answer { display: none; }
  .answer.open { display: block; }
  .ans-section { margin-top: 14px; }
  .ans-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .ans-frame { font-size: 15.5px; }
  .ans-frame p { margin-bottom: 7px; }
  .ans-frame p:last-child { margin-bottom: 0; }
  .ans-frame ol { margin: 2px 0 8px 22px; }
  .ans-frame ol li { margin-bottom: 5px; padding-left: 2px; }
  .ans-list { list-style: none; }
  .ans-list li { position: relative; padding-left: 18px; margin-bottom: 7px; font-size: 14.5px; }
  .ans-list li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); opacity: .55; }
  .ans-list li.exp { padding-left: 0; }
  .ans-list li.exp::before { display: none; }
  .d-item summary {
    cursor: pointer;
    padding-left: 18px;
    position: relative;
    list-style: none;
    font-size: 14.5px;
  }
  .d-item summary::-webkit-details-marker { display: none; }
  .d-item summary::before {
    content: "";
    position: absolute; left: 3px; top: .42em;
    border: solid var(--accent);
    border-width: 0 2px 2px 0;
    padding: 2.6px;
    transform: rotate(-45deg);
    opacity: .7;
    transition: transform .15s ease;
  }
  .d-item[open] summary::before { transform: rotate(45deg); }
  .d-item summary:hover { color: var(--accent); }
  .d-x {
    margin: 6px 0 4px 18px;
    padding: 8px 12px;
    border-left: 2px solid var(--line);
    color: var(--ink);
    font-size: 14px;
    background: var(--code-bg);
    border-radius: 0 8px 8px 0;
  }
  @media (prefers-reduced-motion: reduce) { .d-item summary::before { transition: none; } }
  .trap { border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; margin-top: 8px; font-size: 14.5px; }

  .rate { display: flex; gap: 8px; margin-top: 18px; }
  .rate button {
    flex: 1;
    padding: 12px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-family: "Golos Text", sans-serif;
    font-size: 14px; font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .rate .r-know:hover, .rate .r-know.sel { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .rate .r-shaky:hover, .rate .r-shaky.sel { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .rate .r-miss:hover, .rate .r-miss.sel { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .rate .key { font-family: "IBM Plex Mono", monospace; font-size: 11px; opacity: .55; display: block; margin-top: 2px; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; }
  .nav button {
    padding: 11px 18px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-family: "Golos Text", sans-serif;
    font-size: 14.5px; font-weight: 500;
    cursor: pointer;
  }
  .nav button:hover { border-color: var(--accent); }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav button:disabled:hover { border-color: var(--line); }
  .pos { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; flex-wrap: wrap; }
  .toolbar .small {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Golos Text", sans-serif;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .toolbar .small:hover { color: var(--accent); }
  .kbd-note { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
  @media (max-width: 600px) { .kbd-note { display: none; } }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 15px;
  }

  .stats { display: flex; gap: 14px; margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .stats span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.g { background: var(--good); } .dot.w { background: var(--warn); } .dot.b { background: var(--bad); }

  button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<script>
const TOPICS = [
  { id: "swift", name: "Swift" },
  { id: "conc", name: "Многопоточность" },
  { id: "arch", name: "Архитектура" },
  { id: "ui", name: "UIKit / SwiftUI" },
  { id: "net", name: "Networking" },
  { id: "db", name: "Базы данных" },
  { id: "test", name: "Тестирование" },
  { id: "algo", name: "Алгоритмы" },
  { id: "prof", name: "Profiling" },
  { id: "live", name: "Live coding" },
  { id: "kmp", name: "KMP" },
];

const CARDS = [
// ---------- SWIFT ----------
{ id:"s1", topic:"swift",
  q:"struct vs class - главное отличие и когда осознанно выбрать класс?",
  frame:"Ответ в четыре фразы.\n1. Разные семантики: структура при присваивании копируется, класс передаётся по ссылке - все владельцы видят один объект.\n2. Класс беру, когда нужна identity, наследование, общее изменяемое состояние на нескольких владельцев или deinit для освобождения внешнего ресурса.\n3. За этим стоит диспетчеризация: класс платит динамикой (таблица методов) за возможность наследования.\n4. Структура получает статическую диспетчеризацию - отсюда её скорость.\nПравило одной фразой: данные - структура, поведение и общее состояние - класс.",
  details:[
    { t:"Живой пример на каждый повод за класс",
      x:"Identity: координатор в массиве childCoordinators - удалить именно ЕГО можно только через ===, копию структуры не отличишь. Общее изменяемое состояние: сервис авторизации с токеном - разлогинился в одном месте, все видят сразу. deinit: отписка от нотификаций и KVO - внешний ресурс, о котором ARC не знает." },
    { t:"Что в проекте структуры: DTO, модели, ViewState, конфиги",
      x:"Это просто данные, снимок; идентичность им не нужна - два DTO с одинаковыми полями и есть одно и то же. Плюс копия по значению защищает от неожиданных мутаций из другого слоя." },
    { t:"let у структуры и у класса работает по-разному",
      x:"let у структуры замораживает её целиком - ни одно поле не изменить, и mutating-метод не вызвать (ошибка компиляции). let у класса замораживает только ссылку - поля объекта остаются мутабельными." },
    { t:"Наследование структуре невозможно в принципе",
      x:"Оно противоречит копированию: наследник больше по размеру, а value-тип копируется по фиксированному размеру. Полиморфизм структурам даётся протоколами - и это осознанная ставка Swift: дефолт структуры плюс протоколы, класс по необходимости. Не \"перешли на POP\", а сместили дефолт - классы и UIKit никуда не делись." },
    { t:"Про стек и кучу сам не начинай",
      x:"Размещение - деталь реализации: структура в поле класса или захваченная escaping-замыканием окажется в куче. Если прямо спросят \"где лежат\" - ровно эта фраза и есть сильный ответ." }
  ],
  trap:"Сказать \"структуры неизменяемые\" - ошибка: иммутабельность даёт let, а не тип. И не начинай ответ со стека и кучи - это второй по популярности повод для дожима." },

{ id:"s2", topic:"swift",
  q:"Array - структура. Почему передача массива на миллион элементов - O(1), и что произойдёт при append внутри функции?",
  code:"// Кастомный CoW: структура-обёртка + класс-буфер\nfinal class Buffer {\n    var items: [Int]\n    init(_ items: [Int]) { self.items = items }\n}\n\nstruct CoWArray {\n    private var buffer: Buffer\n    init(_ items: [Int] = []) { buffer = Buffer(items) }\n\n    var count: Int { buffer.items.count }   // чтение: без проверок и копий\n\n    mutating func append(_ x: Int) {\n        makeUniqueIfNeeded()\n        buffer.items.append(x)\n    }\n\n    private mutating func makeUniqueIfNeeded() {\n        // &buffer - inout: смотрим на саму переменную,\n        // без временного retain (иначе счётчик всегда >= 2)\n        if !isKnownUniquelyReferenced(&buffer) {\n            buffer = Buffer(buffer.items)   // O(n) - только когда буфер общий\n        }\n    }\n}\n\nvar a = CoWArray([1, 2, 3])\nvar b = a       // O(1): скопировалась только ссылка на буфер\nb.append(4)     // буфер общий -> сначала копия, потом запись\nb.append(5)     // буфер уже свой -> мутация на месте, копии нет",
  frame:"Ответ в правильном порядке.\n1. Array - структура, внутри неё ссылка на буфер, а буфер - класс в куче; присваивание копирует только ссылку - O(1) на любом размере.\n2. Value-семантику надо соблюсти, поэтому при первой мутации срабатывает copy-on-write: isKnownUniquelyReferenced - владелец один, пишем на месте; буфер общий - сначала полная копия O(n), потом запись.\n3. Копия не \"позже\", а только если буфер реально в совместном использовании (shared) - единственный владелец не заплатит никогда.\nВажно не путать: O(1) даёт устройство типа, а CoW отвечает за сохранение value-семантики.",
  details:[
    { t:"Коронная фраза: CoW - это value-семантика, оплаченная в кредит",
      x:"Контракт \"моя копия только моя\" соблюдён, а расплата отложена до момента, когда кто-то реально пишет. Развёртка: у типа два лица - снаружи значение, внутри ссылка на буфер; честность копий обеспечивает проверка уникальности при каждой мутации." },
    { t:"Второй ход: CoW - не фича языка, а оптимизация стандартной библиотеки",
      x:"Написана руками для Array, Dictionary, Set, String и Data. Твоя собственная структура копируется по полям; нужен CoW - реализуешь сам: класс-буфер внутри плюс isKnownUniquelyReferenced перед мутацией (код выше в этой карточке)." },
    { t:"Как работает isKnownUniquelyReferenced",
      x:"Читает счётчик сильных ссылок из заголовка объекта-буфера и сравнивает с единицей. Принимает inout - смотрит на саму переменную без временного retain, иначе счётчик был бы всегда не меньше двух. Для классов из Obj-C всегда возвращает false - CoW вырождается в копирование при каждой мутации." },
    { t:"Доказательство руками, если спросят \"откуда знаешь\"",
      x:"Печатаешь адрес буфера через withUnsafeBufferPointer до и после присваивания - один и тот же; после мутации одной из копий адреса разъезжаются. Плюс стандартная библиотека открыта: класс-буфер виден в исходниках." }
  ],
  trap:"Сказать \"O(1) благодаря CoW\" - перевёрнутая причинность, её ловят follow-up-ом. И CoW не даёт потокобезопасности: два потока с общим буфером - гонка, несмотря на value-семантику снаружи." },

{ id:"s3", topic:"swift",
  q:"ARC: как работает, откуда берётся retain cycle, и когда weak, а когда unowned?",
  frame:"ARC - automatic reference counting, автоматический подсчёт ссылок.\n1. Компилятор на этапе сборки расставляет в код вызовы retain/release - не рантайм и не сборщик мусора. Считаются только сильные ссылки; счётчик стал нулём - вызывается deinit, немедленно и детерминированно.\n2. Retain cycle - цикл сильных ссылок: объекты держат друг друга, счётчики не дойдут до нуля, память утекла. Три классических места: родитель и ребёнок держат друг друга, делегат объявлен strong, замыкание захватывает self.\n3. Разрыв цикла - невладеющие ссылки, обе не увеличивают счётчик. weak идёт через side table - может вернуть nil - обязан быть Optional - безопасен. unowned - обращение напрямую по адресу - возвращать nil ему нечем - не Optional - крашит на мёртвом объекте.\n4. Правило выбора: по умолчанию weak; unowned - только когда время жизни объекта доказуемо дольше ссылки. Делегаты - weak: ребёнок не должен держать родителя.\nФормула фикса в замыкании: в списке захвата пишу [weak self], потом guard let self else return.",
  details:[
    { t:"Escaping vs non-escaping: где именно рождается цикл",
      x:"Escaping-замыкание сохраняется (свойство, подписка, очередь) и живёт дольше вызова - и пока живо, держит self. Non-escaping (дефолт) умирает до возврата функции: map и filter захватывают self на мгновение, цикл не успевает возникнуть. Критерий на глаз: компилятор требует явный self - значит escaping." },
    { t:"Side table: где на самом деле живут счётчики",
      x:"Strong и unowned считаются инлайн в 64 битах заголовка объекта - retain/release это атомарная операция над одним полем. Side table создаётся лениво при первой weak-ссылке (включая [weak self] в списке захвата): счётчики переезжают туда, в заголовке остаётся указатель. Таблица переживает объект - поэтому weak умеет ответить nil после его смерти." },
    { t:"Цена weak и цена unowned",
      x:"Каждое чтение weak - три действия: заход в таблицу, проверка флага жизни, retain объекта на время выражения. Unowned - прямое обращение по адресу без проверок; но память объекта не переиспользуется, пока живы unowned-ссылки, поэтому обращение к мёртвому даёт осмысленный trap, а не мусор. unowned(unsafe) - голый указатель и undefined behavior." },
    { t:"Не всякая утечка - retain cycle",
      x:"Разрастающийся кэш или забытая подписка - тоже утечка, хотя цикла нет. Диагностика начинается с инструментов: Memory Graph Debugger (кто держит объект - видно стрелками) или Instruments Allocations. Быстрый ритуал: открыл-закрыл экран десять раз - память вернулась на место?" },
    { t:"ARC против сборщика мусора - монета с двумя сторонами",
      x:"ARC детерминирован: deinit в предсказуемой точке, без пауз - но циклы не собирает, разруливаешь weak/unowned. Сборщик мусора (Java/Kotlin) собирает циклы - недостижимый остров умирает целиком, - но там свои утечки: достижимые от живого корня забытые ссылки: неотменённая корутина, неотписанный слушатель, статика." },
    { t:"Терминология, на которой ловят",
      x:"Говори \"цикл сильных ссылок\", не \"циклическая зависимость\" - та про модули и импорты. Произноси ан-оунд, по-русски \"невладеющая\". Weak обязан быть Optional и var. И слово deinit обязано прозвучать - его спросят следом." }
  ],
  trap:"\"Деаллокация происходит когда-нибудь потом\" - неверно: deinit детерминирован, и само слово deinit обязано прозвучать. \"unowned - это без проверки\" - тоже неточно: safe unowned трапается осмысленно, без проверок только unowned(unsafe)." },

{ id:"s5", topic:"swift",
  q:"Optional под капотом. Что делает \"??\" и почему работает \"if let\"?",
  frame:"enum Optional<Wrapped> с кейсами .none и .some(Wrapped). T?, nil, if let - синтаксический сахар: nil это .none, binding - паттерн-матчинг по .some. Вся оптиональность - обычный generic из stdlib плюс сахар компилятора.",
  details:[
    { t:"Все способы распаковки - это pattern matching",
      x:"if let - сахар для switch по кейсу some с привязкой значения; guard let - то же с ранним выходом, значение остаётся видимым дальше; force unwrap - тот же switch, где ветка none заменена на fatalError; chaining пробрасывает none дальше по цепочке; map и flatMap применяют функцию только внутри some. По-русски pattern matching - сопоставление с образцом." },
    { t:"?? и его ленивая правая часть",
      x:"Nil-coalescing возвращает значение или дефолт. Правый операнд помечен @autoclosure и вычисляется только когда слева nil - дорогой вызов справа не выполнится зря. Операторы цепляются: a ?? b ?? c." },
    { t:"\"Есть ли разница между nil и .none?\" - частый уточняющий",
      x:"Нет: nil - литерал для Optional.none, одно значение в двух написаниях (print(nil == .none) печатает true). И не путай associated value - данные кейса some - с associated type, заглушкой типа в протоколе." },
    { t:"Сколько весит Optional",
      x:"Optional<AnyObject> - ни байта сверху: .none кодируется нулевым указателем (свободные битовые комбинации, extra inhabitants). Int? - 9 байт: 8 на значение плюс байт тега." }
  ],
  trap:"\"?? разворачивает опционал\" - неточно: возвращает значение или дефолт. И помни про ленивость правой части - дорогой вызов справа не выполнится зря." },

{ id:"s6", topic:"swift",
  q:"@autoclosure - что делает и где используется в stdlib?",
  frame:"Атрибут параметра: компилятор автоматически оборачивает переданное выражение в замыкание () -> T. Вызывающий пишет голое выражение, вычислится оно только когда функция вызовет замыкание внутри. Чисто про эргономику call-site: поведение как у обычного параметра-замыкания, но без фигурных скобок при вызове.",
  details:[
    { t:"Так устроены &&, || и assert",
      x:"Короткое замыкание булевых операторов - буквально autoclosure правого операнда: при false && f() функция f не вызовется. Assert бесплатен в release по той же причине - его условие и сообщение просто не вычисляются. Готовый ответ на \"реализуйте && сами\": func &&(lhs: Bool, rhs: @autoclosure () -> Bool) -> Bool." },
    { t:"По умолчанию non-escaping",
      x:"Как и обычные параметры-замыкания. Хочешь сохранить выражение на потом - комбинируй @autoclosure @escaping." },
    { t:"Почему им не стоит увлекаться",
      x:"Call-site выглядит как передача обычного значения - читатель не видит, что вычисление отложено. Apple советует применять только там, где отложенность очевидна из семантики: операторы, assert-подобные API, дефолты." }
  ],
  trap:"Внутри функции разницы с обычным () -> T нет вообще - вся разница на стороне вызова." },

{ id:"s7", topic:"swift",
  q:"any Protocol vs some Protocol - в чём разница и что дороже?",
  frame:"1. some (opaque type) - конкретный тип, известный компилятору на компиляции, скрыто только имя: статическая диспетчеризация, ноль накладных.\n2. any (existential) - тип неизвестен до рантайма, значение живёт в existential container, вызовы косвенные.\nМнемоника: some - конкретный тип в маске, any - коробка с сюрпризом.",
  details:[
    { t:"Устройство existential container",
      x:"Пять машинных слов: буфер на три слова под само значение (большое не влезает - уезжает в кучу, в буфере остаётся указатель), ссылка на метаданные типа и на protocol witness table для вызовов. Отсюда цена any: возможная heap-аллокация, косвенные вызовы, нет инлайна и специализации." },
    { t:"Зачем any сделали обязательным словом (Swift 5.6)",
      x:"Раньше existential писался голым именем протокола - var x: MyProtocol - и выглядел бесплатным типом, хотя ты платил за коробку. Слово any делает стоимость видимой в коде и явно противопоставляет some." },
    { t:"Правило выбора",
      x:"Дефолт - дженерик или some: тип известен компилятору, накладных нет. any - когда нужна настоящая гетерогенность: массив разных реализаций под одним протоколом или тип, неизвестный до рантайма." },
    { t:"Follow-up: some в позиции параметра",
      x:"func f(_ x: some Proto) - сахар для дженерика с одним параметром (Swift 5.7): читается легче, работает так же быстро, без коробки." }
  ],
  trap:"\"some откладывает узнавание типа на потом\" - ровно наоборот: откладывает any, а some фиксирует тип на компиляции. Классическая путаница." },

{ id:"s8", topic:"swift",
  q:"Зачем нужны были AnyPublisher / AnySequence и почему нужда в них упала?",
  frame:"Type erasure: раньше протокол с associatedtype нельзя было использовать как тип (\"protocol can only be used as a generic constraint\") - заворачивали в ручные боксы AnyPublisher, AnySequence, AnyView. Swift 5.7 принёс primary associated types (some Publisher<Int, Never>) и implicit opening экзистенциалов - большинство самописных боксов стало не нужно.",
  details:[
    { t:"Когда AnyPublisher всё ещё нужен",
      x:"Как стабильная граница API: скрыть чудовищный тип цепочки операторов из сигнатуры. eraseToAnyPublisher - тот же бокс-паттерн, что раньше писали руками. Продавай через пример: AnyPublisher<Data, Error> вместо типа на пятьсот символов." },
    { t:"Что изменил Swift 5.7",
      x:"Primary associated types (some Publisher<Int, Never>) и implicit opening экзистенциалов - большинство самописных боксов стало не нужно. Упомянуть - показать, что следишь за языком." },
    { t:"Не путать с opaque types",
      x:"Бокс (AnyX, any) прячет тип в рантайме - плата: динамика и возможная аллокация. some прячет тип только в сигнатуре - компилятор его знает, плата нулевая. Смежная проблема, противоположные стороны." }
  ],
  trap:"Не путать type erasure (бокс) и opaque types (some) - они решают смежную проблему с разных сторон: бокс прячет тип в рантайме, some - в сигнатуре при компиляции." },

{ id:"s9", topic:"swift",
  q:"Четыре вида диспетчеризации методов в Swift. Что когда используется?",
  frame:"Четыре вида.\n1. Static/direct - структуры, enum, final-методы, extension-методы, глобальные функции: адрес известен, возможен инлайн.\n2. Vtable - обычные методы классов: таблица методов, индекс известен на компиляции.\n3. Witness table - требования протокола через generic или existential.\n4. Message (objc_msgSend) - @objc dynamic и вызовы из Obj-C рантайма; нужен для KVO и swizzling.",
  details:[
    { t:"final, private и WMO дают девиртуализацию",
      x:"Компилятор превращает vtable-вызов в статический, когда уверен, что переопределений нет: final запрещает их явно, private позволяет увидеть все использования, Whole Module Optimization расширяет обзор до целого модуля." },
    { t:"msgSend не так медленен, как пугают",
      x:"objc_msgSend кэширует адреса методов (IMP caching) - повторные вызовы быстрые. Но инлайн и цепочка оптимизаций потеряны навсегда, поэтому \"после прогрева не уступает vtable\" - неправда." },
    { t:"Почему KVO требует dynamic",
      x:"KVO работает через isa-swizzling: рантайм подменяет класс объекта на сгенерированный подкласс с перехватом сеттеров. Такое возможно только при message dispatch - отсюда @objc dynamic на наблюдаемом свойстве." },
    { t:"Вопрос с подвохом: как переопределить метод, объявленный в extension класса",
      x:"Обычно никак: у extension-метода нет слота в vtable, и наследник получит либо ошибку invalid redeclaration, либо статическую привязку по типу переменной. Лазейка: пометить метод @objc dynamic - вызов уйдёт на message dispatch, и override заработает." }
  ],
  trap:"Метод в extension протокола, не объявленный в самом протоколе, диспетчеризуется статически по типу переменной: let p: Proto = Impl(); p.foo() вызовет extension-версию, даже если Impl определил свою. Самый частый вопрос с подвохом." },

{ id:"s10", topic:"swift",
  q:"escaping vs non-escaping замыкания. Почему escaping требует явного self?",
  code:"func fetch(completion: @escaping (Data) -> Void) {\n    queue.async { completion(data) }   // переживает вызов fetch\n}",
  frame:"1. Non-escaping (дефолт) - замыкание гарантированно выполнится до возврата функции: компилятор может держать контекст на стеке и не требует self.\n2. Escaping - переживает вызов функции (сохранено, передано в async): контекст уезжает в кучу, и захват self надо написать явно - это точка, где рождаются retain cycles.",
  details:[
    { t:"Критерий на глаз: компилятор требует self",
      x:"Требует писать self явно - замыкание сохранят, думай про weak. Не требует - non-escaping, цикл невозможен. Этот признак надёжнее любой интуиции." },
    { t:"Escaping - не про потоки",
      x:"Completion у UIView.animate - escaping, хотя всё происходит на главном потоке: замыкание переживает вызов, ждёт конца анимации. Критерий один - сохранили ли замыкание, а не куда его отправили." },
    { t:"Почему non-escaping - дефолт (и с каких пор)",
      x:"Безопасность и скорость: контекст можно держать на стеке, self не удерживается. До Swift 3 дефолт был обратным - escaping, а non-escaping помечали @noescape; перевернули ради безопасности." },
    { t:"Захват значения vs захват переменной",
      x:"[x] в списке захвата копирует значение в момент создания замыкания; захват без списка - это ссылка на саму переменную: мутации после создания видны при вызове. Классическая задача про cars/airplanes - в live coding." }
  ],
  trap:"Захват в capture list копирует значение в момент создания замыкания, а захват без списка - ссылку на переменную: [x] и просто x внутри тела ведут себя по-разному при последующей мутации x." },

{ id:"s11", topic:"swift",
  q:"Generics против any: что такое специализация и почему дженерик быстрее?",
  frame:"Generic-функция компилируется в универсальную версию, работающую через witness table, но оптимизатор делает специализацию: генерирует отдельную версию под конкретный тип со статическими вызовами и инлайном. any всегда живёт в коробке - специализировать нечего, тип неизвестен.",
  details:[
    { t:"Специализация: что делает оптимизатор",
      x:"Из универсальной версии функции генерирует отдельную под конкретный тип - со статическими вызовами и инлайном. Работает внутри модуля или с @inlinable и Whole Module Optimization. Поэтому func f<T: Proto>(_ t: T) и func f(_ t: any Proto) семантически близки, а по цене различаются радикально." },
    { t:"\"Дженерики медленные\" - устаревшая полуправда",
      x:"Медленной остаётся только неспециализированная и экзистенциальная форма. После специализации это статические вызовы с инлайном." },
    { t:"where проверяется на компиляции",
      x:"Ошибки несоответствия типов ловятся до запуска, а ограничение читается как контракт вслух: \"для любых двух контейнеров с одинаковым типом элемента\"." }
  ],
  trap:"\"Дженерики медленные из-за витнес-таблиц\" - устаревшая полуправда: после специализации это статические вызовы. Медленной остаётся именно нес специализированная/экзистенциальная форма." },

{ id:"s12", topic:"swift",
  q:"lazy var: как работает, какие подводные камни?",
  code:"final class ImageProcessor {\n    // lazy var: НЕ потокобезопасна\n    lazy var filter: Filter = {\n        print(\"создаю фильтр\")   // при гонке напечатается дважды\n        return Filter()\n    }()\n\n    // static let: потокобезопасен, инициализация строго один раз\n    static let shared = ImageProcessor()\n}\n\nlet p = ImageProcessor()\nDispatchQueue.concurrentPerform(iterations: 2) { _ in\n    _ = p.filter   // оба потока обращаются впервые, одновременно\n}\n// Возможный вывод:\n// создаю фильтр\n// создаю фильтр   <- инициализатор выполнился ДВАЖДЫ\n\n// Захват self: всё решает пара скобок\nfinal class ProfileVC {\n    var username = \"george\"\n\n    lazy var greeting: String = {\n        \"Привет, \\(self.username)\"\n    }()   // () - хранится РЕЗУЛЬТАТ: замыкание отработало\n          // и умерло, self держало мгновение, цикла нет\n\n    lazy var makeGreeting: () -> String = { [unowned self] in\n        \"Привет, \\(self.username)\"\n    }     // без () - хранится САМО замыкание: без capture list\n          // был бы цикл (VC держит замыкание, оно - VC);\n          // unowned оправдан: замыкание живёт внутри self\n}",
  frame:"Вычисляется при первом обращении, результат кэшируется. Требует var (мутирует хранилище) и недоступна в let-структурах через let-байндинг. Главные грабли: НЕ потокобезопасна - два потока при первом одновременном доступе могут вычислить инициализатор дважды.",
  details:[
    { t:"Почему в lazy можно писать self без weak",
      x:"Со скобками () в конце свойство хранит результат: замыкание выполнилось один раз при первом доступе и умерло - self держался мгновение, цикла нет (а объект к этому моменту гарантированно инициализирован). Опасно только хранить само замыкание, без скобок: тогда нужен список захвата, и unowned там оправдан - замыкание живёт внутри self." },
    { t:"static let - потокобезопасная противоположность",
      x:"Инициализируется через механику dispatch_once: рантайм гарантирует ровно одно выполнение, второй поток ждёт. Поэтому синглтон в Swift - одна строка static let shared, без обвязки." },
    { t:"Механика гонки lazy",
      x:"Под капотом - хранилище плюс проверка \"пусто? вычислить и записать\", без лока. Два потока при первом одновременном доступе оба видят пусто: побочные эффекты дважды, один из объектов молча потерян, а неатомарная запись - data race. Лечится только снаружи: лок или serial queue вокруг доступа, let в init, static let, actor." },
    { t:"lazy vs computed property",
      x:"lazy хранит результат и вычисляется один раз; computed вычисляется при каждом обращении и памяти не занимает. Выбор: дорогое и стабильное - lazy; дешёвое или зависящее от другого состояния - computed." }
  ],
  trap:"На вопрос \"lazy потокобезопасна?\" ответ - нет. Потокобезопасен static let. Пара lazy/static let - готовая ловушка." },

{ id:"s13", topic:"swift",
  q:"Property wrappers: что это, как устроены, примеры из фреймворков?",
  frame:"Синтаксический сахар: @Wrapper var x генерирует скрытое хранилище _x типа обёртки, а доступ к x идёт через её wrappedValue. Обёртка инкапсулирует поведение хранения: валидацию, дефолты, потокобезопасность, привязку к стораджу.",
  details:[
    { t:"Как устроено под капотом",
      x:"@Wrapper var x генерирует скрытое хранилище _x типа обёртки; чтение и запись x идут через её wrappedValue. projectedValue доступен через $x - так SwiftUI отдаёт Binding из @State." },
    { t:"Ловушка @Published: значение приходит ДО записи",
      x:"Publisher срабатывает на willSet: в sink уже новое значение, а в self.x ещё старое. Любимый вопрос по Combine - и частая причина багов с чтением self в подписке." },
    { t:"Свой wrapper за минуту",
      x:"Идеи из практики: @Clamped(0...100) для диапазона, @Trimmed для строк, @UserDefault(key:) для настроек. Скелет: struct с var wrappedValue { get set } и логикой в сеттере." }
  ],
  trap:"@Published шлёт значение ДО записи в свойство (willSet): прочитаешь self.x в sink - получишь старое. Любимый вопрос по Combine." },

{ id:"s14", topic:"swift",
  q:"Почему String.count - O(n) и что такое grapheme cluster?",
  frame:"String - коллекция Character, а Character - extended grapheme cluster: то, что человек видит как один символ, может состоять из нескольких Unicode scalar-ов (эмодзи с модификаторами, флаги, диакритика). Пока не пройдёшь строку, не знаешь, сколько кластеров - отсюда O(n) и отсутствие целочисленных индексов.",
  details:[
    { t:"String.Index вместо Int - не вредность",
      x:"Индекс привязан к конкретной строке и её байтовому представлению: целочисленный индекс требовал бы O(n) на каждый доступ или сломал бы юникод. На лайвкодинге легальный приём - сразу Array(s) и обычные Int-индексы, объяви его вслух." },
    { t:"Внутри UTF-8, поверх - представления",
      x:"С Swift 5 хранение UTF-8; utf8, utf16 и unicodeScalars - разные view поверх одного буфера. Для \"é\" count даст 1, а utf8.count - 2: считают разные вещи." },
    { t:"Сравнение строк - каноническая эквивалентность",
      x:"\"é\" одним скаляром и \"e + combining accent\" равны через ==, хотя байты разные. Поэтому сравнение строк в Swift не побайтовое - и не самое дешёвое." }
  ],
  trap:"\"é\" может быть одним скаляром или e + combining accent - count в обоих случаях 1, а utf8.count разный. Хороший пример на интервью." },

{ id:"s15", topic:"swift",
  q:"Обработка ошибок: throws, rethrows, Result, typed throws - когда что?",
  code:"// throws: ошибка уходит вверх, обработка do/catch\nfunc load() throws -> Data { ... }\ndo { let d = try load() } catch { print(error) }\n\n// rethrows ты видишь каждый день - он в сигнатуре map:\n// func map<T>(_ transform: (Element) throws -> T) rethrows -> [T]\n// map кидает ТОЛЬКО если кинуло твоё замыкание:\n\nlet a = [1, 2, 3].map { $0 * 2 }        // замыкание не кидает - try не нужен\n\nlet b = try [\"1\", \"x\"].map { s in       // замыкание кидает - нужен try\n    guard let n = Int(s) else { throw ParseError() }\n    return n\n}\n\n// Result: ошибка как значение - можно хранить, передавать, комбинировать\nlet result: Result<Data, NetworkError> = .failure(.timeout)\n\n// typed throws (Swift 6): тип ошибки прямо в сигнатуре\nfunc parse() throws(ParseError) -> Model { ... }",
  frame:"1. throws - синхронная передача ошибки вверх, обработка do/catch; это не исключения C++ - по сути скрытый возврат ошибки, дешёвый.\n2. Result<T, E> - ошибка как значение: можно хранить, передавать в completion, комбинировать.\n3. rethrows - функция кидает, только если кинуло переданное ей замыкание (map, forEach).\n4. Typed throws (Swift 6) - throws(MyError) фиксирует тип ошибки в сигнатуре.",
  details:[
    { t:"throws - не исключения Java или C++",
      x:"Ни раскрутки стека, ни ловли рантайм-крашей: по сути скрытый возврат ошибки, дешёвый. Force unwrap или выход за границы массива никаким catch не поймать." },
    { t:"try? и try! - оба с оговорками",
      x:"try? превращает ошибку в nil - удобно, но причина потеряна навсегда; try! трапается на ошибке. В проде try? только там, где причина правда не важна, try! - почти никогда." },
    { t:"async/await вернул throws на главную роль",
      x:"Раньше асинхронные ошибки жили в completion(Result); теперь - async throws с обычным do/catch. Result остаётся для хранения и передачи результата как значения." }
  ],
  trap:"\"throws - это исключения как в Java\" - нет: ни раскрутки стека, ни ловли рантайм-крашей; force unwrap или index out of range никаким catch не поймать." },

{ id:"s20", topic:"swift",
  q:"Как устроены Array и Dictionary под капотом? Сложность вставки в середину и в конец массива?",
  code:"var a = [1, 2, 3]\na.append(4)          // O(1) амортизированный: пишет в запас capacity\na.insert(0, at: 0)   // O(n): весь хвост сдвигается вправо\n_ = a[2]             // O(1): адрес = база + 2 * размер элемента\na.reserveCapacity(1_000)   // выделили заранее - append без переездов\n\nvar dict = [\"a\": 1]\ndict[\"b\"] = 2        // O(1) в среднем: хеш ключа указывает ячейку\n_ = dict[\"a\"]        // O(1): не перебор, а прыжок по хешу\n\nlet set: Set = [1, 2, 3]\nset.contains(2)      // O(1): та же хеш-таблица, только без значений\na.contains(2)        // а у массива - O(n), честный перебор",
  frame:"Array под капотом - один непрерывный кусок памяти, элементы лежат подряд.\n1. Доступ по индексу O(1): адрес элемента считается арифметикой - начало буфера плюс индекс на размер элемента.\n2. Append - амортизированный O(1): память выделяется с запасом (capacity); когда запас кончился, выделяется новый кусок примерно вдвое больше и элементы переезжают. Переезд дорогой, но редкий - в среднем по всем вставкам выходит константа.\n3. Вставка в середину - всегда O(n): всем элементам правее надо сдвинуться.\nDictionary под капотом - хеш-таблица: массив ячеек.\n1. По ключу считается хеш - число, которое указывает на ячейку; чтение и запись в среднем O(1), без обхода.\n2. Два ключа могут дать одну ячейку (коллизия) - тогда значение кладётся в ближайшую свободную.\n3. Когда таблица заполняется, создаётся новая побольше и всё раскладывается заново.",
  details:[
    { t:"Hashable-контракт",
      x:"Равные значения обязаны давать равный хеш. Нарушишь - словарь молча теряет элементы: ищет в одной ячейке, а лежит в другой." },
    { t:"Порядок Dictionary не гарантирован",
      x:"Хеш считается со случайным зерном на каждый запуск процесса (SipHash) - порядок элементов меняется между запусками. Заодно это защита от подобранных ключей, деградирующих таблицу до O(n)." },
    { t:"reserveCapacity перед массовым наполнением",
      x:"Убирает промежуточные переезды буфера - и для Array, и для Dictionary. Мелочь, по которой узнают практика." },
    { t:"Для блеска: как решаются коллизии",
      x:"Линейное пробирование (open addressing): ячейка занята - идём в соседнюю. Set - тот же механизм без значений; ContiguousArray - гарантированно непрерывный буфер без моста в NSArray." }
  ],
  trap:"\"Вставка в массив O(1) везде\" - нет: O(1) амортизированно только в конец; в середину всегда O(n). Ровно это спрашивают на скрининге." },

{ id:"s21", topic:"swift",
  q:"Дженерики в протоколах: associatedtype и where в методах",
  code:"protocol Container {\n    associatedtype Item\n    var items: [Item] { get }\n}\n\nextension Container where Item: Equatable {\n    func contains(_ item: Item) -> Bool {\n        items.contains(item)\n    }\n}\n\nfunc merge<A: Container, B: Container>(_ a: A, _ b: B) -> [A.Item]\n    where A.Item == B.Item {\n    a.items + b.items\n}",
  frame:"Определение в одну фразу: associatedtype - это дженерик протокола, где реализация выбирает конкретный тип, а не вызывающая сторона. Дженерик - входной параметр типа (задаёт вызывающий в точке вызова, каждый раз заново), associated type - выходной (реализация фиксирует раз и навсегда: Array объявил свой Element - ты берёшь что дали). where-клаузы дают условную функциональность: extension со where добавляет методы только подходящим реализациям; в generic-функциях where связывает associated types разных параметров.",
  details:[
    { t:"Почему такой протокол не был типом",
      x:"Это не один тип, а семейство: компилятор не может назвать тип результата first() - он у каждой реализации свой. \"Абстрактный договор без информации, чем оперируем\" - формулировка следствия на второй ход." },
    { t:"Зачем associatedtype придумали",
      x:"Иначе Collection не выражается: пришлось бы плодить CollectionOfInt и CollectionOfString или возвращать Any с ручными кастами. Associated type - это дженерик со стороны реализации." },
    { t:"Жизненный кейс: Repository",
      x:"protocol Repository с associatedtype Model - и var repo: Repository не компилируется. Выходы: дженерик-класс, либо primary associated types (Swift 5.7): protocol Repository<Model> и any Repository<User>. Самый сильный ответ по теме." },
    { t:"Conditional conformance",
      x:"extension Array: Equatable where Element: Equatable - массив сравним, когда сравнимы элементы. Вершина владения where-клаузами." }
  ],
  trap:"Писать contains через any Equatable - не скомпилируется и выдаст непонимание: условное расширение со where - единственный чистый путь." },

{ id:"s22", topic:"swift",
  q:"Зачем нужен mutating и почему его нельзя вызвать на let?",
  frame:"Self внутри метода структуры по умолчанию константа. mutating меняет это: делает self inout-параметром - метод получает саму переменную, а не копию, и при выходе результат записывается обратно. Отсюда оба следствия: на let-экземпляре mutating-метод не вызовешь - ошибка компиляции cannot use mutating member on immutable value (let замораживает структуру целиком); у классов пометки нет вообще - там self ссылка, поля мутабельны всегда.",
  details:[
    { t:"Снять ложную посылку",
      x:"Структура создана не \"чтобы не мутировать\", а для value-семантики: твоя копия только твоя, менять её нормально и безопасно. mutating ничего не стоит в рантайме - это пометка компилятору, не механизм." },
    { t:"x += 1 - это self.x += 1",
      x:"self подразумевается. Без mutating self внутри метода - константа; с mutating он становится inout: метод получает саму переменную и при выходе записывает обратно." },
    { t:"Источник, если спросят \"откуда правило\"",
      x:"The Swift Programming Language, раздел Methods -> Modifying Value Types from Within Instance Methods. И сам компилятор подсказывает: cannot assign to property, self is immutable." }
  ],
  trap:"\"mutating - редкая и опасная штука\" - неверная интуиция: он повсюду в stdlib и бесплатен. Опасно наоборот - мутировать общее состояние класса, где изменение видят все владельцы." },

{ id:"s23", topic:"swift",
  q:"Когда моделировать состояния enum-ом, а когда классом/протоколом?",
  frame:"Ключ - исчерпаемость: компилятор знает все кейсы enum, поэтому switch без default обязан покрыть каждый. Добавил кейс - все switch по проекту перестали компилироваться, и это подарок: физически не забудешь обработать состояние. Правило: закрытый набор состояний, известный целиком - enum (ViewState: loading, loaded, error); открытый набор, который расширят снаружи - протокол или класс.",
  details:[
    { t:"Сильная фраза: enum убирает невозможные состояния",
      x:"Класс с опциональными полями допускает \"loading с ошибкой внутри\"; enum с associated values исключает такие комбинации на уровне типа - конструктивно, а не дисциплиной." },
    { t:"default глушит исчерпаемость",
      x:"Со своим enum default не ставим: добавил кейс - компилятор молчит, ветка молча уехала в default. С системными enum наоборот обязателен: они non-frozen, Apple вправе пополнять их в новых версиях." },
    { t:"Конечный автомат",
      x:"Экран - автомат: состояний ровно N, enum - прямое отображение автомата в тип, переходы - функции (старое состояние, событие) -> новое. Поэтому reducer в Redux-подобных архитектурах - switch по enum." },
    { t:"Как это спрашивают в жизни",
      x:"Не \"в чём разница\", а задачей: дают код и ждут, что скажешь \"тут enum, потому что компилятор не даст забыть кейс\"." }
  ],
  trap:"Ответить \"enum - это как в C, набор значений\" - мимо: в Swift кейс носит данные (associated values), и в этом вся сила моделирования." },

{ id:"s24", topic:"swift",
  q:"Extension: что можно добавить, что нельзя и почему?",
  frame:"Можно - любому типу, даже чужому:\n1. Методы и вычисляемые свойства.\n2. Вложенные типы и сабскрипты.\n3. Соответствие протоколам.\nНельзя два, и у каждого запрета своя причина:\n1. Хранимые свойства - extension не может менять размер типа, он зафиксирован при компиляции.\n2. Переопределение существующих методов - extension не наследование, у его методов нет слота в таблице методов. Объявишь метод, который уже есть в типе - не override, а ошибка компиляции invalid redeclaration.",
  details:[
    { t:"Главная ценность extension",
      x:"Расширять тип извне, когда исходник недоступен: Int, UIView, чужие типы из библиотек. Плюс организация: нарезка своего типа по протоколам и логическим блокам - принятый стиль." },
    { t:"Сеньорское следствие: методы extension - статика",
      x:"У наследника \"переопределение\" не работает: вызов идёт по статическому типу переменной. Оговорка: если extension добавляет соответствие протоколу, вызовы через протокол идут динамически - через witness table." },
    { t:"Хак с associated objects - не ответ",
      x:"\"Добавлю хранимое свойство через associated objects\" - это рантайм-хак из Obj-C, а не фича Swift. На вопрос о причине запрета отвечай про фиксированный на компиляции размер типа." }
  ],
  trap:"\"Добавлю хранимое свойство через extension с associated objects\" - это Obj-C-рантайм-хак, а не фича Swift; на вопрос о причинах запрета отвечай про фиксированный размер типа." },

{ id:"s25", topic:"swift",
  q:"Protocol witness table: что это и какова цена вызова через протокол?",
  frame:"1. Protocol witness table - таблица адресов реализаций. Компилятор создаёт её на этапе сборки на пару \"тип + протокол\": три протокола у типа - три таблицы. В рантайме она только читается.\n2. Когда переменная объявлена типом протокола, конкретный тип потерян - а место под переменную выделить надо, и размеры у разных типов разные. Поэтому значение упаковывается в existential container - коробку фиксированного размера: небольшой буфер под данные плюс указатели на witness table и на метаданные типа. Не влезло в буфер - данные уезжают в кучу.\n3. Цена вызова - не сам прыжок по адресу из таблицы, а потеря инлайна (компилятор не может встроить вызов по месту) и всей цепочки оптимизаций за ним.\n4. Как не платить: дженерик с ограничением протоколом или some - тип известен компилятору, коробка не нужна. Вывод: платишь за коробку, когда нужна разнородность; не нужна - не платишь.",
  details:[
    { t:"Existential по смыслу",
      x:"\"Существует некий конкретный тип, соответствующий протоколу, но какой - не знаю\". Some - противоположность: тип известен компилятору, скрыто только имя." },
    { t:"Три машинных слова - знай, но не вываливай",
      x:"Говори \"упаковывается в existential container, при превышении inline-буфера уезжает в кучу\". Спросят про размер - ответишь: буфер три слова, плюс метаданные типа и witness table, итого пять. Знать и вываливать - разные вещи." },
    { t:"Не путать с side table",
      x:"Side table - счётчики ссылок сбоку от объекта, мир ARC. Witness table - адреса реализаций протокола у типа, мир диспетчеризации. Похожие названия, разные механизмы." },
    { t:"Причинность прямая",
      x:"Выбрал дженерик - компилятор специализирует и встраивает. Выбрал any - вызовы косвенные всегда. Это следствие твоего выбора типа, а не везение оптимизатора." }
  ],
  trap:"\"Таблица создаётся на каждый объект\" - нет: одна на пару тип+протокол, создана на компиляции, рантайм только читает." },

{ id:"s17", topic:"swift",
  q:"inout - это передача по ссылке?",
  frame:"Нет. Семантика copy-in copy-out: на входе создаётся копия аргумента, функция работает с ней, при выходе результат записывается обратно в исходную переменную. Компилятор может оптимизировать до настоящей ссылки, но рассчитывать на это нельзя - наблюдаемое поведение именно копирования туда-обратно.",
  details:[
    { t:"Отсюда все запреты inout",
      x:"Нельзя передать let; нельзя алиасить одну переменную в два inout-параметра - exclusivity, ошибка одновременного доступа; & на call-site - маркер семантики, а не взятие адреса." },
    { t:"Escaping-замыкание не может захватить inout",
      x:"К моменту отложенного вызова copy-out уже произошёл бы, и связь копии с оригиналом потеряна. Компилятор запрещает такой захват." },
    { t:"didSet сработает при copy-out",
      x:"Даже если функция ничего не меняла: запись обратно происходит всегда. Это наблюдаемое доказательство модели copy-in copy-out - не ссылки." }
  ],
  trap:"Сказать \"это как указатель в C\" - минус: механика другая, и exclusivity enforcement (ошибка одновременного доступа) объясняется именно copy-in copy-out моделью." },

{ id:"s18", topic:"swift",
  q:"map, compactMap, flatMap, reduce - разница одной фразой каждая?",
  code:"[1, 2, 3].map { $0 * 2 }                    // [2, 4, 6]\n[\"1\", \"x\", \"3\"].compactMap { Int($0) }      // [1, 3] - nil выброшены\n[[1, 2], [3]].flatMap { $0 }                // [1, 2, 3] - разгладил\n\n// reduce: копилка едет из итерации в итерацию\nlet sum = [1, 2, 3, 4].reduce(0) { acc, x in acc + x }\n// шаги: 0+1=1 -> 1+2=3 -> 3+3=6 -> 6+4=10\n// короче: [1, 2, 3, 4].reduce(0, +)\n\n// копилка может быть чем угодно - хоть словарём частот:\nlet freq = [\"a\", \"b\", \"a\"].reduce(into: [:]) { acc, ch in\n    acc[ch, default: 0] += 1\n}   // [\"a\": 2, \"b\": 1]; into: даёт копилку как inout - без копий",
  frame:"1. map - преобразует каждый элемент, структура сохраняется.\n2. compactMap - преобразует и выбрасывает nil.\n3. flatMap - преобразует и разглаживает вложенные коллекции на один уровень.\n4. reduce - сворачивает коллекцию в одно значение через аккумулятор-копилку: стартуешь с начального значения, на каждом элементе функция получает накопленное плюс элемент и возвращает новое накопленное; что осталось в копилке в конце - и есть результат ([1,2,3].reduce(0, +) даёт 6).",
  details:[
    { t:"Мнемоника flatMap vs compactMap",
      x:"flatMap управляет структурой - разглаживает вложенность; compactMap управляет содержимым - выбрасывает nil. Исторически nil-фильтрацией занимался flatMap: переименовали в compactMap в Swift 4.1 - деталь для стажа." },
    { t:"flatMap на Optional",
      x:"map над Optional с функцией, возвращающей Optional, дал бы U?? - flatMap схлопывает в U?. Тот же принцип управления структурой, что у коллекций." },
    { t:"reduce(into:) для копилок-коллекций",
      x:"Обычный reduce на каждом шаге возвращает новую копилку - для словаря это копия за копией. Версия into: даёт копилку как inout и мутирует на месте. Идиома частот: reduce(into: [:]) { $0[$1, default: 0] += 1 }." }
  ],
  trap:"Просят написать map или reduce руками (см. live coding) - реализация map: пустой массив с reserveCapacity, цикл, append(transform(el))." },

{ id:"s19", topic:"swift",
  q:"Stack vs Heap. Сколько стеков в приложении?",
  frame:"1. Стек - по одному на каждый поток: у main 1 МБ, у фоновых по умолчанию 512 КБ. Аллокация - сдвиг указателя, освобождение автоматом при выходе из скоупа.\n2. Куча - одна на процесс (процесс - запущенный экземпляр приложения с собственным адресным пространством; все его потоки делят одну память): динамические аллокации, время жизни управляется ARC, дороже из-за поиска места и синхронизации аллокатора.",
  details:[
    { t:"\"Сколько стеков?\" - вопрос-фильтр",
      x:"По числу потоков, а не один. У main - 1 МБ, у фоновых по умолчанию 512 КБ; размер можно задать при создании Thread. Переполнение - глубокая рекурсия." },
    { t:"Что где лежит",
      x:"На стеке: локальные значения и фреймы вызовов. В куче: объекты классов, escaping-контексты замыканий, CoW-буферы, большие existential-значения. \"Структуры на стеке\" - верно только для локальных переменных." },
    { t:"Почему куча дороже",
      x:"Поиск свободного места и синхронизация аллокатора между потоками - против простого сдвига указателя у стека. Плюс у объектов кучи ARC-трафик." }
  ],
  trap:"Связка с предыдущим: \"структуры на стеке\" - верно только для локальных переменных; поле класса или захват в escaping-замыкании кладёт структуру в кучу." },

{ id:"s16", topic:"swift",
  q:"Модификаторы доступа: open vs public и зачем это различие?",
  frame:"От самого открытого к самому закрытому:\n1. open - видно, наследуется и переопределяется из другого модуля.\n2. public - видно снаружи, но наследование и override только внутри модуля.\n3. internal - дефолт: видно в пределах модуля.\n4. fileprivate - в пределах файла.\n5. private - в пределах объявления (плюс extensions в том же файле).\nРазличие open/public - инструмент авторов библиотек: закрытая по умолчанию иерархия.",
  details:[
    { t:"public class без open",
      x:"Снаружи модуля видно, но не наследуется: иерархия закрыта по умолчанию, open - осознанное разрешение переопределять чужим. Работает только для классов и их членов." },
    { t:"private мягче, чем кажется",
      x:"Виден в extensions того же файла - нарезка типа расширениями не заставляет ослаблять доступ. fileprivate - во всём файле; нужен заметно реже." },
    { t:"Explicit API mode",
      x:"Режим, в котором компилятор требует явный public/internal на каждой декларации: граница модуля становится осознанным контрактом, случайно засветить тип наружу нельзя. Включают в модульных монорепах." }
  ],
  trap:"open работает только для классов и их членов - протоколам и структурам он не нужен, наследования нет." },

// ---------- ARCHITECTURE ----------
{ id:"a1", topic:"arch",
  q:"MVC / MVVM / VIPER / Clean - сравни и скажи, когда что выбрать",
  frame:"1. MVC от Apple: быстро стартовать, но VC срастается с view и пухнет (massive view controller), логика нетестируема.\n2. MVVM: ViewModel забирает состояние экрана и презентационную логику, View пассивна, binding через Combine или замыкания - тестируется без UI.\n3. VIPER: пять ролей с жёсткими контрактами - максимум разделения, максимум бойлерплейта; оправдан в больших командах с кодогенерацией.\n4. Clean - не паттерн экрана, а правило зависимостей для всего приложения: слои смотрят внутрь, домен не знает о фреймворках.",
  details:[
    { t:"Критерии выбора",
      x:"Размер команды и фичи, требования к тестам, скорость итераций, порог входа новичков. Ответ без трейд-оффов - незачёт: религиозная война минусуется." },
    { t:"Твой честный ответ",
      x:"Продукт писал с нуля на MVVM+Combine, сейчас - MVVM поверх слоёной архитектуры Entity/UseCase/Repository/DataSource. Про VIPER честно: работал рядом, цену бойлерплейта понимаю." },
    { t:"MVVM-ловушка и MVVM-C",
      x:"ViewModel не импортирует UIKit/SwiftUI - иначе тестируемость и переносимость умерли. Follow-up \"что такое MVVM-C\": тот же MVVM плюс Coordinator, забирающий навигацию." }
  ],
  trap:"Религиозная война \"X лучше всех\" - минус; интервьюер ждёт трейд-оффы и привязку к контексту команды." },

{ id:"a2", topic:"arch",
  q:"Слои Entity / UseCase / Repository / DataSource - зачем такое деление?",
  frame:"Clean-слои данных и домена:\n1. Entity - доменная модель без зависимостей.\n2. UseCase - одна бизнес-операция, оркестрирует репозитории.\n3. Repository - абстракция над данными, интерфейс объявлен в домене.\n4. DataSource - конкретика (сеть, база, кэш) за этим интерфейсом.\nПравило зависимостей: всё смотрит внутрь, домен не знает, откуда данные.",
  details:[
    { t:"Профит на пальцах",
      x:"Подменил DataSource - мок, кэш, другой бэкенд - домен и UI не заметили. UseCase тестируется на моках репозиториев без сети и базы." },
    { t:"Repository - склейка источников",
      x:"Сеть + кэш + маппинг DTO -> Entity за одним интерфейсом. Не путать с DataSource: тот - один конкретный источник." },
    { t:"Не перебарщивать",
      x:"Экран из одного запроса не требует четырёх слоёв. Зрелость - в дозировке, и сказать это вслух ценнее, чем нарисовать все слои." }
  ],
  trap:"Путать Repository и DataSource: репозиторий - абстракция и склейка источников, дата-сорс - один конкретный источник." },

{ id:"a3", topic:"arch",
  q:"SOLID - по букве с iOS-примером",
  frame:"1. S - один повод меняться: сеть не живёт в VC, у каждого класса одна ответственность.\n2. O - открыт для расширения, закрыт для изменения: новый тип ячейки добавляется новым классом через протокол/registry, а не новым case в switch.\n3. L - подтип встаёт на место базового без сюрпризов: наследник не ужесточает предусловия и не ломает контракт.\n4. I - протоколы маленькие: не заставляй реализовывать пустые методы, дроби жирные делегаты.\n5. D - зависим от абстракций: ViewModel знает протокол репозитория, а не URLSession.",
  details:[
    { t:"Живые антипримеры сильнее определений",
      x:"S - massive view controller. O - switch по типам ячеек, разросшийся на десять экранов. I - optional-методы протокола \"на всякий случай\". L - сабкласс UIView, переставший звать super.layoutSubviews: компилируется, контракт сломан." },
    { t:"D - это не про контейнер",
      x:"Обычный init(repository: SomeProtocol) - уже Dependency Inversion. Контейнер лишь удобство сборки графа, принцип живёт в направлении зависимости." },
    { t:"Свяжи буквы в рассказ",
      x:"I и D вместе дают тестируемость: маленький протокол легко замокать. Так пять букв звучат связно, а не как заклинание." }
  ],
  trap:"Отбарабанить расшифровку без примеров - на сеньорском уровне это незачёт; по одному конкретному кейсу на букву." },

{ id:"a4", topic:"arch",
  q:"Какие паттерны проектирования используешь в работе?",
  frame:"Рабочий набор iOS-разработчика:\n1. Delegate - связь один-к-одному через weak-ссылку; на нём половина UIKit.\n2. Observer - один-ко-многим: NotificationCenter, KVO, Combine.\n3. Singleton - осознанно и редко: URLSession.shared, свои сервисы лучше через DI.\n4. Factory - создание экранов и зависимостей, скрывает конкретные типы за протоколом.\n5. Builder - пошаговая сборка сложного объекта: сетевые запросы fluent-цепочкой.\n6. Adapter - подгоняет чужой интерфейс под ожидаемый: мост аналитики к контракту дизайн-системы.\n7. Facade - один удобный вход в сложную подсистему.\n8. Coordinator - навигация отдельно от экранов.",
  details:[
    { t:"Минусы Singleton - обязаны прозвучать тесты",
      x:"Скрытая зависимость (в сигнатурах не видна), глобальное мутабельное состояние, и главное - в тестах не подменишь и не изолируешь. Лечение: тот же инстанс, но приходит через init как протокол." },
    { t:"Facade vs Adapter одной фразой",
      x:"Фасад делает удобно: один вход в свою сложную подсистему. Адаптер делает совместимо: чужой интерфейс под ожидаемый. Твой пример адаптера - мост аналитики к контракту дизайн-системы." },
    { t:"У Apple из коробки",
      x:"Delegate, target-action, observer (KVO, NotificationCenter), singleton (URLSession.shared) и chain of responsibility - responder chain. Последний всегда радует интервьюеров." }
  ],
  trap:"На \"минусы Singleton\" обязаны прозвучать тесты - в реальных вопросниках это прописано как ожидание." },

{ id:"a5", topic:"arch",
  q:"System Design: аналог TikTok, мобильная архитектура без бэкенда",
  frame:"Канва на 20 минут.\n1. Уточнить требования: бесконечная вертикальная лента видео, свайпы, лайки, комменты, офлайн не критичен.\n2. Слои: presentation MVVM + Coordinators (обосновать: тестируемость + управляемая навигация), domain с use cases, data - API + кэши.\n3. Ключевые решения, где живёт сложность: пагинация курсором, префетч следующих N видео, пул переиспользуемых плееров (3-5 AVPlayer, скользящее окно), дисковый LRU-кэш, отмена загрузок при быстром свайпе.\n4. DI через composition root по фичам, дизайн-система как отдельный модуль токенов и компонентов.",
  details:[
    { t:"Твой козырь - реальная видеолента",
      x:"Шаринг плееров, рывки карусели, трекинг просмотров - рассказывай из опыта, не из теории. Перформанс-акценты: окно из трёх экранов в памяти, прогрев следующего плеера, деградация качества по сети." },
    { t:"Аналитика видимости",
      x:"Событие показа при 50% площади, дебаунс на свайпах - мостик к карточке про сервис аналитики." },
    { t:"Оценивают ход мысли, не диаграмму",
      x:"Рисуй слои и поток данных, проговаривай трейд-оффы вслух. Начать с выбора библиотек - провал: сначала требования и ограничения." }
  ],
  trap:"Начать с выбора библиотек - провал: сначала требования и ограничения, технологии в конце." },

{ id:"a6", topic:"arch",
  q:"Спроектируй слой аналитики в приложении",
  frame:"Контур: тонкий фасад track(event) -> персистентная очередь -> батч-отправка -> подтверждение -> удаление.\n1. События сначала пишутся в хранилище: SQLite или файловая очередь - переживает kill; UserDefaults не для потока событий.\n2. Отправка батчами по N штук или таймеру; at-least-once: удаляем только после ack сервера.\n3. Retry: таймауты и 5xx - с экспоненциальным backoff; 400 не ретраим - событие неисправимо, в карантин.\n4. Плюс отправка на переходе в background (beginBackgroundTask) и догон при старте.",
  details:[
    { t:"Очередь с приоритетами",
      x:"Конверсионные события можно слать сразу, минуя батч; рядовые копятся. Внутри приоритета - FIFO." },
    { t:"Видимость баннера 50%",
      x:"Geometry в didScroll или onAppear с порогом площади; событие один раз на показ, сброс при уходе из viewport - иначе дубли на каждом пикселе скролла." },
    { t:"Паттерны, которые здесь ждут",
      x:"Repository (хранилище), Facade (API для продукта), Strategy (стратегии отправки), Builder (сборка события), Observer. Вплетай реальный опыт: мост аналитики, дедуп событий - твоя территория." }
  ],
  trap:"Забыть про персистентность до отправки - главный минус: \"копим в памяти и шлём\" теряет события при kill, а вопрос \"как добиться 100% доставки\" в задании прописан." },

{ id:"a7", topic:"arch",
  q:"Способы DI в Swift. Как сделать DI без библиотек?",
  frame:"Способы:\n1. Initializer injection - дефолт: зависимость видна в сигнатуре, объект не существует без неё.\n2. Property injection - для legacy и storyboard, где init недоступен.\n3. Environment - SwiftUI-путь.\n4. Контейнеры (Swinject, Factory; в KMP - Koin) - когда граф большой.\nБез библиотек: composition root - одно место, где собирается весь граф, плюс фабрики экранов; протоколы на границах для подмены в тестах.",
  details:[
    { t:"Смысл DI - в направлении",
      x:"Класс объявляет, что ему нужно, а не добывает сам. Обычный init с протоколом - уже DI; контейнер лишь инструмент для большого графа." },
    { t:"Зачем всё-таки берут контейнер",
      x:"Скоупы (singleton, на-экран), ленивая инициализация тяжёлых зависимостей, автосборка графа. Твой пример: двухфазная инициализация - shared-модули регистрируются отдельно от нативных зависимостей, которые инжектят приложения." },
    { t:"Антипаттерн: service locator",
      x:"Размазанное по коду \"дай мне из контейнера\" - те же минусы синглтона: зависимость спрятана из сигнатур, тестировать больно." }
  ],
  trap:"\"DI - это Swinject\" - подмена понятий: контейнер лишь инструмент, принцип живёт в обычном init." },

{ id:"a8", topic:"arch",
  q:"Coordinator: какую проблему решает и как устроен?",
  frame:"Выносит навигацию из VC: экран не знает, куда идти дальше - сообщает о событии (замыкание/делегат), координатор решает и строит переход. Профит: экраны переиспользуются в разных флоу, флоу тестируется без UI, deep links собираются в одном месте. Иерархия: app coordinator -> child coordinators по флоу, родитель держит детей сильно и отпускает по завершении.",
  details:[
    { t:"Классические грабли",
      x:"Утечка child coordinator: забыли удалить из родительского массива по завершении флоу - координаторы копятся. И обратная: координатор умер раньше экрана - колбэки уходят в никуда." },
    { t:"Deep link - вход в середину флоу",
      x:"Координатор умеет собрать стек с любого места: вся логика переходов в одном месте, экраны о навигации не знают." },
    { t:"Твой пример и SwiftUI",
      x:"Трёхслойная навигация: нативный роутер за протоколом, прокси, адаптеры экранов - тот же принцип развязки, доведённый до кроссплатформы. В SwiftUI роль мигрирует в роутер с NavigationStack path." }
  ],
  trap:"\"Координатор - это класс с UINavigationController внутри\" - форма без сути; суть: экран не знает о навигации." },

{ id:"a9", topic:"arch",
  q:"Модульность: зачем пилить приложение на модули и где проводить границы?",
  frame:"Цели:\n1. Время сборки - пересобирается только затронутое.\n2. Владение кодом командами.\n3. Контроль зависимостей - модуль не дотянется до чужих внутренностей.\n4. Переиспользование между приложениями.\nГраницы - по фичам и по слоям: фича-модули не знают друг о друге и общаются через интерфейсные модули и DI; общий фундамент (дизайн-система, сеть, аналитика) - отдельные core-модули.",
  details:[
    { t:"Explicit API mode как контракт",
      x:"public/internal обязательны на каждой декларации: граница модуля осознанная, случайно засветить тип наружу нельзя. Так живут большие монорепы." },
    { t:"Твой козырь-масштаб",
      x:"Монорепа с четырьмя бренд-приложениями на общих модулях: ветвление рантаймом (enum приложения плюс фича-тогглы), а не build flavors. Навигация между не знающими друг о друге фичами - через реестр экранов." },
    { t:"Цена модульности",
      x:"Бойлерплейт границ и дисциплина API - для мелкого приложения оверкилл. И помни: модульность - это границы видимости и зависимостей, а не структура папок." }
  ],
  trap:"\"Разбили по папкам - значит модульно\" - нет: модульность это границы видимости и зависимостей, а не структура каталогов." },

// ---------- UIKIT / SWIFTUI ----------
{ id:"u0", topic:"ui",
  q:"Что такое SwiftUI и чем он отличается от UIKit?",
  frame:"SwiftUI - декларативный UI-фреймворк: описываешь, как экран выглядит для данного состояния, а не командуешь, как его перестроить.\n1. View - протокол с единственным требованием body; твоя вьюха - лёгкая структура-описание, значение.\n2. Структуры пересоздаются постоянно, и это дёшево. Долго живёт не вьюха, а состояние: @State и @StateObject лежат в хранилище SwiftUI, привязанном к позиции вьюхи в дереве.\n3. Изменилось состояние - SwiftUI заново вызывает body, сравнивает новое описание со старым и обновляет только изменившееся.\n4. Рисует под капотом по-прежнему UIKit и Core Animation; в UIKit-мир SwiftUI встраивается через UIHostingController.\nUIKit - императивный: долгоживущие объекты UIView и UIViewController, состояние хранится в них самих, обновления делаешь руками.",
  details:[
    { t:"@ViewBuilder - result builder, не property wrapper",
      x:"Одинаковый @-синтаксис, разные механизмы: result builder собирает дерево из блока кода (buildBlock), wrapper оборачивает хранение свойства (wrappedValue). Частая путаница." },
    { t:"some View и статический диффинг",
      x:"Прячет монструозный вложенный дженерик-тип всего дерева, но компилятор знает его целиком - отсюда быстрое сравнение описаний и обновление только изменившегося." },
    { t:"Дно рекурсии: body типа Never",
      x:"Примитивы Text и Image собственного body не имеют - на них описание заканчивается и начинается настоящий рендер." },
    { t:"Аналог viewDidLoad? Его нет",
      x:"onAppear может сработать многократно. Жизненный цикл имеет то, что живёт долго: состояние и появление в render-дереве, а не структура, которая пересоздаётся постоянно." }
  ],
  trap:"\"У SwiftUI нет жизненного цикла, потому что нет объектов\" - кривая посылка: объекты есть (хранилище состояния, hosting), просто вьюха - значение. ЖЦ есть у состояния и у onAppear/onDisappear." },

{ id:"u1", topic:"ui",
  q:"UIView vs CALayer",
  frame:"1. CALayer - модель того, что рисуется: контент, геометрия, анимируемые свойства; живёт в мире Core Animation, рендерится на GPU.\n2. UIView - обёртка над слоем, добавляющая то, чего у слоя нет: обработку событий (touches, responder chain), Auto Layout, доступность.\nКаждый view владеет корневым слоем, но слои могут жить и без view - они легче.",
  details:[
    { t:"Анимации на самом деле анимируют слой",
      x:"UIView.animate - фасад над транзакциями Core Animation; анимируемые свойства живут на CALayer. У standalone-слоёв есть имплицитные анимации свойств (четверть секунды), у backing-слоя вью они выключены - известный нюанс." },
    { t:"Когда брать чистый CALayer",
      x:"Тысячи лёгких элементов без событий, кастомные шейпы и градиенты: CAShapeLayer, CAGradientLayer, CAEmitterLayer, CATiledLayer. Вопрос \"назовите три сабкласса CALayer\" встречается дословно - выбери один и умей раскрыть глубже." },
    { t:"Кто рисует на самом деле",
      x:"Вью рисует в бэкинг-стор своего слоя (drawRect - мост в этот механизм), контент слоя - это его contents. Рисует слой, вью добавляет события и layout." }
  ],
  trap:"\"View рисует, layer помогает\" - наоборот: рисует слой, view добавляет события и layout." },

{ id:"u2", topic:"ui",
  q:"frame vs bounds. Что будет, если менять origin у каждого? Могут ли size отличаться?",
  viz:"<svg viewBox='0 0 700 240' xmlns='http://www.w3.org/2000/svg' font-family='IBM Plex Mono, monospace' font-size='11'><rect x='15' y='35' width='180' height='170' fill='none' stroke='var(--muted)' stroke-width='1.5'/><text x='15' y='25' fill='var(--muted)'>superview</text><path d='M15,105 H75' stroke='var(--ink)' stroke-dasharray='3 3' fill='none'/><path d='M75,35 V105' stroke='var(--ink)' stroke-dasharray='3 3' fill='none'/><text x='20' y='99' fill='var(--ink)'>x</text><text x='80' y='75' fill='var(--ink)'>y</text><rect x='75' y='105' width='90' height='60' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5'/><text x='83' y='140' fill='var(--accent)'>frame</text><text x='15' y='226' fill='var(--muted)'>frame.origin - позиция</text><text x='15' y='238' fill='var(--muted)'>в координатах родителя</text><rect x='255' y='35' width='180' height='170' fill='none' stroke='var(--muted)' stroke-width='1.5'/><text x='255' y='25' fill='var(--muted)'>bounds.origin.y = 50</text><rect x='275' y='35' width='120' height='28' fill='none' stroke='var(--accent)' stroke-dasharray='3 3'/><rect x='275' y='73' width='120' height='40' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5'/><rect x='275' y='123' width='120' height='40' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5'/><path d='M415,150 V95' stroke='var(--bad)' stroke-width='1.5' fill='none'/><path d='M410,103 L415,93 L420,103' stroke='var(--bad)' stroke-width='1.5' fill='none'/><text x='255' y='226' fill='var(--muted)'>bounds.origin - контент уехал,</text><text x='255' y='238' fill='var(--muted)'>рамка на месте (это скролл)</text><rect x='515' y='55' width='120' height='120' fill='none' stroke='var(--bad)' stroke-dasharray='4 3' stroke-width='1.5'/><rect x='533' y='73' width='85' height='85' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5' transform='rotate(45 575.5 115.5)'/><text x='511' y='45' fill='var(--bad)'>frame 141x141</text><text x='548' y='120' fill='var(--accent)'>bounds</text><text x='543' y='133' fill='var(--accent)'>100x100</text><text x='500' y='226' fill='var(--muted)'>transform: frame растёт,</text><text x='500' y='238' fill='var(--muted)'>bounds.size прежний</text></svg>",
  code:"let container = UIView(frame: CGRect(x: 0, y: 0, width: 300, height: 300))\nlet box = UIView(frame: CGRect(x: 50, y: 50, width: 100, height: 100))\ncontainer.addSubview(box)\n\n// 1. frame.origin - box едет ПО РОДИТЕЛЮ\nbox.frame.origin.x = 100        // сместился вправо внутри container\n\n// 2. bounds.origin - едет СОДЕРЖИМОЕ самого container\ncontainer.bounds.origin.y = 50  // все сабвью визуально уехали вверх на 50:\n                                // сдвинулась его система координат.\n                                // UIScrollView так и работает:\n                                // contentOffset == bounds.origin\n\n// 3. transform - и size расходятся\nbox.transform = CGAffineTransform(rotationAngle: .pi / 4)\nprint(box.bounds.size)  // (100.0, 100.0) - как был\nprint(box.frame.size)   // (141.4, 141.4) - описанный прямоугольник,\n                        // 100 * sqrt(2)",
  frame:"1. frame - прямоугольник вью в координатах супервью; bounds - собственная система координат вью, origin обычно (0,0).\n2. Меняешь frame.origin - вью едет по родителю. Меняешь bounds.origin - едет содержимое внутри: сабвью визуально сдвигаются в противоположную сторону; ровно так работает UIScrollView - contentOffset это bounds.origin.\n3. Size расходятся при transform: frame становится описанным прямоугольником повёрнутой вью и растёт, bounds.size не меняется.",
  details:[
    { t:"Когда bounds.origin не (0,0) - готовый ответ",
      x:"UIScrollView: contentOffset - это и есть bounds.origin его собственной системы координат. Плюс зум и кастомные вьюпорты. Скажешь \"bounds.origin всегда ноль\" - дожмут именно скролл-вью." },
    { t:"После transform работай с bounds и center",
      x:"Документация прямо говорит: frame становится undefined. Истинная позиция - center, истинный размер - bounds.size." },
    { t:"Формула связи",
      x:"frame - это bounds.size, преобразованный transform-ом и позиционированный через center. Проверка на пальцах: поворот на 45 градусов - frame.size вырастает в корень из двух раз." }
  ],
  trap:"Сказать \"bounds.origin всегда ноль\" - сразу дожмут скролл-вью." },

{ id:"u3", topic:"ui",
  q:"Жизненный цикл приложения iOS",
  frame:"Пять состояний по порядку:\n1. Not running - приложение не запущено.\n2. Inactive - запущено, но события не получает: момент старта, входящий звонок, открытая шторка.\n3. Active - на экране, получает события; сюда приходит из inactive и уходит через него.\n4. Background - ушло с экрана: ограниченное время на завершение работы (beginBackgroundTask) плюс спец-режимы - аудио, локация, BGTaskScheduler.\n5. Suspended - заморожено в памяти, CPU не получает; при нехватке памяти система выгружает его без уведомления, следующий запуск - холодный.\nКолбэки: SceneDelegate - жизнь сцены (sceneDidBecomeActive/willResignActive, didEnterBackground/willEnterForeground), AppDelegate - процесс (didFinishLaunching, пуш-токен).",
  details:[
    { t:"AppDelegate vs SceneDelegate",
      x:"Делегат приложения - процесс и системные события: запуск, пуш-токен. Делегат сцены - жизнь UI-окон и мультиоконность; после iOS 13 UI-колбэки живут в сцене." },
    { t:"Suspended - настоящая заморозка",
      x:"CPU не выделяется: таймеры и сокеты мертвы. Возврат - через willEnterForeground; выгрузка из памяти происходит без уведомления, следующий запуск - холодный." },
    { t:"Практический вывод",
      x:"didEnterBackground - последняя точка, где гарантированно можно сохранить или дослать (черновики, буфер аналитики); долгую работу оборачивай в beginBackgroundTask, иначе процесс заморозят раньше." }
  ],
  trap:"Рассчитывать на \"последний колбэк перед смертью\" нельзя: при убийстве приложения из suspended applicationWillTerminate НЕ вызывается, а о выгрузке из памяти система не предупреждает вовсе. Всё важное сохраняй уже в didEnterBackground." },

{ id:"u4", topic:"ui",
  q:"Жизненный цикл UIViewController",
  frame:"По порядку:\n1. loadView - создаётся view.\n2. viewDidLoad - один раз за жизнь контроллера: view в памяти, но размеров ещё нет.\n3. viewWillAppear - перед каждым показом.\n4. viewWillLayoutSubviews / viewDidLayoutSubviews - размеры посчитаны; могут вызываться многократно (поворот, сплит, present).\n5. viewDidAppear - экран виден.\n6. viewWillDisappear / viewDidDisappear - при каждом уходе.\n7. deinit - контроллер умер.\nПравила: размерозависимая настройка - в viewDidLayoutSubviews; подписки экрана - парой appear/disappear.",
  details:[
    { t:"viewDidLoad не знает размеров",
      x:"View создана, но layout ещё не прошёл: расчёты фреймов там - классический баг. Размерозависимое - в viewDidLayoutSubviews, и код там обязан быть идемпотентным: метод зовётся многократно." },
    { t:"Подписки - парой appear/disappear",
      x:"Вешай в willAppear/didAppear, снимай в disappear-паре - иначе невидимый экран продолжает обновляться в фоне." },
    { t:"SwiftUI-мостик",
      x:"UIHostingController встраивает SwiftUI-мир в этот же цикл - готовый ответ на \"как они уживаются\". Аналогично живут любые встроенные декларативные хосты в нативных экранах." }
  ],
  trap:"Анимации и старт видео в viewDidLoad вместо viewDidAppear - вью ещё не на экране." },

{ id:"u5", topic:"ui",
  q:"@State, @Binding, @StateObject, @ObservedObject, @EnvironmentObject - разложи по ролям",
  frame:"Деление по владению.\n1. @State - view владеет значением, источник истины, переживает пересоздание структуры.\n2. @Binding - ссылка на чужой источник истины ($state), чтение и запись без владения.\n3. @StateObject - view владеет ObservableObject: создаётся один раз на identity, переживает рекомпозиции родителя.\n4. @ObservedObject - объект пришёл извне, view только наблюдает; создавать его на месте нельзя.\n5. @EnvironmentObject - тот же наблюдаемый объект, но доставленный через environment вниз по дереву.",
  details:[
    { t:"Главное правило: владение",
      x:"Создаёшь объект в этой view - @StateObject: создаётся один раз на identity и переживает рекомпозиции родителя. Получаешь извне - @ObservedObject. Ошибка \"= ViewModel() прямо в @ObservedObject\" - state теряется при каждом обновлении родителя; пример в код-ревью live coding." },
    { t:"Тихий баг @StateObject",
      x:"Он игнорирует новый объект, пришедший от родителя, - подменить модель извне не получится. Формулировка выбора для интервью: \"здесь @StateObject, потому что модель на экран одна и живёт весь срок экрана\"." },
    { t:"@Binding - это пара замыканий",
      x:"Значение не хранит: внутри get, set и transaction (контекст анимации). $user.name через dynamicMemberLookup собирает новую пару на вложенное поле; Binding(get:set:) - руками, .constant() - для превью." },
