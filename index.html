  trap:"Начать с выбора библиотек - провал: сначала требования и ограничения, технологии в конце." },

{ id:"a6", topic:"arch",
  q:"Спроектируй слой аналитики в приложении",
  frame:"Контур: тонкий фасад track(event) -> персистентная очередь -> батч-отправка -> подтверждение -> удаление.\n1. События сначала пишутся в хранилище: SQLite или файловая очередь - переживает kill; UserDefaults не для потока событий.\n2. Отправка батчами по N штук или таймеру; at-least-once: удаляем только после ack сервера.\n3. Retry: таймауты и 5xx - с экспоненциальным backoff; 400 не ретраим - событие неисправимо, в карантин.\n4. Плюс отправка на переходе в background (beginBackgroundTask) и догон при старте.",
  details:[
    "Очередь: FIFO с приоритетами - конверсионные события можно слать вне батча, рядовые копятся.",
    "Видимость баннера 50%: geometry в didScroll/onAppear с порогом площади, событие один раз на показ, сброс при уходе из viewport.",
    "Паттерны, которые здесь ждут: Repository (хранилище), Facade (API), Strategy (стратегии отправки), Builder (сборка события), Observer.",
    "Твой опыт: мост аналитики в дизайн-систему, referrer-атрибуция, дедуп событий видеоленты - вплетай, это твоя территория."
  ],
  trap:"Забыть про персистентность до отправки - главный минус: \"копим в памяти и шлём\" теряет события при kill, а вопрос \"как добиться 100% доставки\" в задании прописан." },

{ id:"a7", topic:"arch",
  q:"Способы DI в Swift. Как сделать DI без библиотек?",
  frame:"Способы:\n1. Initializer injection - дефолт: зависимость видна в сигнатуре, объект не существует без неё.\n2. Property injection - для legacy и storyboard, где init недоступен.\n3. Environment - SwiftUI-путь.\n4. Контейнеры (Swinject, Factory; в KMP - Koin) - когда граф большой.\nБез библиотек: composition root - одно место, где собирается весь граф, плюс фабрики экранов; протоколы на границах для подмены в тестах.",
  details:[
    "Смысл DI не в контейнере, а в направлении: класс объявляет, что ему нужно, а не добывает сам.",
    "Твой пример двухфазной инициализации: shared-модули регистрируются отдельно от нативных зависимостей, которые каждое приложение инжектит со своей стороны - решение проблемы порядка.",
    "Ленивая инициализация тяжёлых зависимостей и скоупы (singleton/на-экран) - то, ради чего берут контейнер.",
    "Анти-паттерн: service locator, размазанный по коду - те же минусы синглтона, зависимость спрятана."
  ],
  trap:"\"DI - это Swinject\" - подмена понятий: контейнер лишь инструмент, принцип живёт в обычном init." },

{ id:"a8", topic:"arch",
  q:"Coordinator: какую проблему решает и как устроен?",
  frame:"Выносит навигацию из VC: экран не знает, куда идти дальше - сообщает о событии (замыкание/делегат), координатор решает и строит переход. Профит: экраны переиспользуются в разных флоу, флоу тестируется без UI, deep links собираются в одном месте. Иерархия: app coordinator -> child coordinators по флоу, родитель держит детей сильно и отпускает по завершении.",
  details:[
    "Классические грабли: утечка child coordinator - забыли удалить из массива по завершении флоу; и обратная - координатор умер, а экран остался с нерабочими колбэками.",
    "В SwiftUI роль мигрирует в роутер с NavigationStack path - тот же принцип, состояние навигации отдельно от экранов.",
    "Твой пример: трёхслойная навигация в текущем проекте - нативный роутер за протоколом, прокси, Compose-адаптеры экранов; тот же принцип развязки, доведённый до кроссплатформы.",
    "Deep link = вход в середину флоу: координатор умеет собрать стек с любого места."
  ],
  trap:"\"Координатор - это класс с UINavigationController внутри\" - форма без сути; суть: экран не знает о навигации." },

{ id:"a9", topic:"arch",
  q:"Модульность: зачем пилить приложение на модули и где проводить границы?",
  frame:"Цели:\n1. Время сборки - пересобирается только затронутое.\n2. Владение кодом командами.\n3. Контроль зависимостей - модуль не дотянется до чужих внутренностей.\n4. Переиспользование между приложениями.\nГраницы - по фичам и по слоям: фича-модули не знают друг о друге и общаются через интерфейсные модули и DI; общий фундамент (дизайн-система, сеть, аналитика) - отдельные core-модули.",
  details:[
    "Explicit API mode (public/internal обязательны) превращает границу модуля в осознанный контракт - так живут большие монорепы.",
    "Твой козырь-масштаб: монорепа с 4 бренд-приложениями на общих модулях, ветвление рантаймом (enum + фича-тогглы), а не build flavors.",
    "Навигация между фича-модулями, не знающими друг друга - через реестр экранов/роутер: то, что у вас решает слой адаптеров.",
    "Цена модульности: бойлерплейт границ и дисциплина API - для мелкого приложения оверкилл."
  ],
  trap:"\"Разбили по папкам - значит модульно\" - нет: модульность это границы видимости и зависимостей, а не структура каталогов." },

// ---------- UIKIT / SWIFTUI ----------
{ id:"u0", topic:"ui",
  q:"Что такое SwiftUI и чем он отличается от UIKit?",
  frame:"SwiftUI - декларативный UI-фреймворк: описываешь, как экран выглядит для данного состояния, а не командуешь, как его перестроить.\n1. View - протокол с единственным требованием body; твоя вьюха - лёгкая структура-описание, значение.\n2. Структуры пересоздаются постоянно, и это дёшево. Долго живёт не вьюха, а состояние: @State и @StateObject лежат в хранилище SwiftUI, привязанном к позиции вьюхи в дереве.\n3. Изменилось состояние - SwiftUI заново вызывает body, сравнивает новое описание со старым и обновляет только изменившееся.\n4. Рисует под капотом по-прежнему UIKit и Core Animation; в UIKit-мир SwiftUI встраивается через UIHostingController.\nUIKit - императивный: долгоживущие объекты UIView и UIViewController, состояние хранится в них самих, обновления делаешь руками.",
  details:[
    "body собирает @ViewBuilder - это result builder, НЕ property wrapper: синтаксис с @ одинаковый, механизмы разные (buildBlock против wrappedValue).",
    "some View прячет монструозный вложенный дженерик-тип всего дерева; тип известен компилятору - отсюда статический диффинг и скорость.",
    "Примитивы Text и Image имеют body типа Never - дно рекурсии: на них описание заканчивается и начинается настоящий рендер.",
    "Прямого аналога viewDidLoad нет: onAppear может сработать многократно. Жизненный цикл имеет то, что живёт долго, - то есть состояние и появление в render-дереве.",
    "Честная оговорка для интервью: структура не перерисовывается, а пересоздаётся; рисует UIKit под капотом."
  ],
  trap:"\"У SwiftUI нет жизненного цикла, потому что нет объектов\" - кривая посылка: объекты есть (хранилище состояния, hosting), просто вьюха - значение. ЖЦ есть у состояния и у onAppear/onDisappear." },

{ id:"u1", topic:"ui",
  q:"UIView vs CALayer",
  frame:"1. CALayer - модель того, что рисуется: контент, геометрия, анимируемые свойства; живёт в мире Core Animation, рендерится на GPU.\n2. UIView - обёртка над слоем, добавляющая то, чего у слоя нет: обработку событий (touches, responder chain), Auto Layout, доступность.\nКаждый view владеет корневым слоем, но слои могут жить и без view - они легче.",
  details:[
    "Анимации на самом деле анимируют свойства слоя; UIView.animate - фасад над CA-транзакциями.",
    "Standalone-слои имеют имплицитные анимации свойств (0.25s); у backing layer вью они выключены - известный нюанс.",
    "Слой рисует через contents/бэкинг-стор; drawRect у вью - мост в этот механизм.",
    "Когда брать чистый CALayer: тысячи лёгких элементов, кастомные шейпы/градиенты (CAShapeLayer, CAGradientLayer)."
  ],
  trap:"\"View рисует, layer помогает\" - наоборот: рисует слой, view добавляет события и layout." },

{ id:"u2", topic:"ui",
  q:"frame vs bounds. Что будет, если менять origin у каждого? Могут ли size отличаться?",
  viz:"<svg viewBox='0 0 700 240' xmlns='http://www.w3.org/2000/svg' font-family='IBM Plex Mono, monospace' font-size='11'><rect x='15' y='35' width='180' height='170' fill='none' stroke='var(--muted)' stroke-width='1.5'/><text x='15' y='25' fill='var(--muted)'>superview</text><path d='M15,105 H75' stroke='var(--ink)' stroke-dasharray='3 3' fill='none'/><path d='M75,35 V105' stroke='var(--ink)' stroke-dasharray='3 3' fill='none'/><text x='20' y='99' fill='var(--ink)'>x</text><text x='80' y='75' fill='var(--ink)'>y</text><rect x='75' y='105' width='90' height='60' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5'/><text x='83' y='140' fill='var(--accent)'>frame</text><text x='15' y='226' fill='var(--muted)'>frame.origin - позиция</text><text x='15' y='238' fill='var(--muted)'>в координатах родителя</text><rect x='255' y='35' width='180' height='170' fill='none' stroke='var(--muted)' stroke-width='1.5'/><text x='255' y='25' fill='var(--muted)'>bounds.origin.y = 50</text><rect x='275' y='35' width='120' height='28' fill='none' stroke='var(--accent)' stroke-dasharray='3 3'/><rect x='275' y='73' width='120' height='40' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5'/><rect x='275' y='123' width='120' height='40' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5'/><path d='M415,150 V95' stroke='var(--bad)' stroke-width='1.5' fill='none'/><path d='M410,103 L415,93 L420,103' stroke='var(--bad)' stroke-width='1.5' fill='none'/><text x='255' y='226' fill='var(--muted)'>bounds.origin - контент уехал,</text><text x='255' y='238' fill='var(--muted)'>рамка на месте (это скролл)</text><rect x='515' y='55' width='120' height='120' fill='none' stroke='var(--bad)' stroke-dasharray='4 3' stroke-width='1.5'/><rect x='533' y='73' width='85' height='85' fill='var(--accent-soft)' stroke='var(--accent)' stroke-width='1.5' transform='rotate(45 575.5 115.5)'/><text x='511' y='45' fill='var(--bad)'>frame 141x141</text><text x='548' y='120' fill='var(--accent)'>bounds</text><text x='543' y='133' fill='var(--accent)'>100x100</text><text x='500' y='226' fill='var(--muted)'>transform: frame растёт,</text><text x='500' y='238' fill='var(--muted)'>bounds.size прежний</text></svg>",
  code:"let container = UIView(frame: CGRect(x: 0, y: 0, width: 300, height: 300))\nlet box = UIView(frame: CGRect(x: 50, y: 50, width: 100, height: 100))\ncontainer.addSubview(box)\n\n// 1. frame.origin - box едет ПО РОДИТЕЛЮ\nbox.frame.origin.x = 100        // сместился вправо внутри container\n\n// 2. bounds.origin - едет СОДЕРЖИМОЕ самого container\ncontainer.bounds.origin.y = 50  // все сабвью визуально уехали вверх на 50:\n                                // сдвинулась его система координат.\n                                // UIScrollView так и работает:\n                                // contentOffset == bounds.origin\n\n// 3. transform - и size расходятся\nbox.transform = CGAffineTransform(rotationAngle: .pi / 4)\nprint(box.bounds.size)  // (100.0, 100.0) - как был\nprint(box.frame.size)   // (141.4, 141.4) - описанный прямоугольник,\n                        // 100 * sqrt(2)",
  frame:"1. frame - прямоугольник вью в координатах супервью; bounds - собственная система координат вью, origin обычно (0,0).\n2. Меняешь frame.origin - вью едет по родителю. Меняешь bounds.origin - едет содержимое внутри: сабвью визуально сдвигаются в противоположную сторону; ровно так работает UIScrollView - contentOffset это bounds.origin.\n3. Size расходятся при transform: frame становится описанным прямоугольником повёрнутой вью и растёт, bounds.size не меняется.",
  details:[
    "После transform документация прямо говорит: frame undefined, работай с bounds и center.",
    "bounds.origin ненулевой - не экзотика: скролл, зум (CATiledLayer), кастомные вьюпорты.",
    "Формула связи: frame.size = bounds.size, преобразованный transform-ом; center + bounds - истинная позиция.",
    "Ответ на \"могут ли size отличаться\" - да, при любом transform кроме identity: это и есть третья часть вопроса."
  ],
  trap:"Сказать \"bounds.origin всегда ноль\" - сразу дожмут скролл-вью." },

{ id:"u3", topic:"ui",
  q:"Жизненный цикл приложения iOS",
  frame:"Пять состояний по порядку:\n1. Not running - приложение не запущено.\n2. Inactive - запущено, но события не получает: момент старта, входящий звонок, открытая шторка.\n3. Active - на экране, получает события; сюда приходит из inactive и уходит через него.\n4. Background - ушло с экрана: ограниченное время на завершение работы (beginBackgroundTask) плюс спец-режимы - аудио, локация, BGTaskScheduler.\n5. Suspended - заморожено в памяти, CPU не получает; при нехватке памяти система выгружает его без уведомления, следующий запуск - холодный.\nКолбэки: SceneDelegate - жизнь сцены (sceneDidBecomeActive/willResignActive, didEnterBackground/willEnterForeground), AppDelegate - процесс (didFinishLaunching, пуш-токен).",
  details:[
    "AppDelegate vs SceneDelegate: делегат приложения - процесс и системные события (пуш-токен, launch), делегат сцены - жизнь UI-окон и мультиоконность.",
    "Suspended не получает CPU: таймеры и сокеты мертвы; возврат из suspended - willEnterForeground, а после выгрузки - холодный старт.",
    "Сохранение состояния - на didEnterBackground: дальше гарантий нет.",
    "Практический вывод: didEnterBackground - последняя точка, где гарантированно можно что-то сохранить или дослать (черновики, буфер аналитики); долгую работу там оборачивай в beginBackgroundTask, иначе система заморозит процесс раньше."
  ],
  trap:"Рассчитывать на \"последний колбэк перед смертью\" нельзя: при убийстве приложения из suspended applicationWillTerminate НЕ вызывается, а о выгрузке из памяти система не предупреждает вовсе. Всё важное сохраняй уже в didEnterBackground." },

{ id:"u4", topic:"ui",
  q:"Жизненный цикл UIViewController",
  frame:"По порядку:\n1. loadView - создаётся view.\n2. viewDidLoad - один раз за жизнь контроллера: view в памяти, но размеров ещё нет.\n3. viewWillAppear - перед каждым показом.\n4. viewWillLayoutSubviews / viewDidLayoutSubviews - размеры посчитаны; могут вызываться многократно (поворот, сплит, present).\n5. viewDidAppear - экран виден.\n6. viewWillDisappear / viewDidDisappear - при каждом уходе.\n7. deinit - контроллер умер.\nПравила: размерозависимая настройка - в viewDidLayoutSubviews; подписки экрана - парой appear/disappear.",
  details:[
    "viewDidLoad не знает финальных размеров - классика бага с расчётом фреймов там.",
    "didReceiveMemoryWarning и разгрузка кэшей - старый, но живой вопрос.",
    "Появление через present/поворот/сплит - layoutSubviews зовётся снова: код там обязан быть идемпотентным.",
    "SwiftUI-мостик: UIHostingController встраивает SwiftUI-мир в этот же цикл - у вас так живёт Compose-хост в нативных экранах, аналогия хорошо звучит."
  ],
  trap:"Анимации и старт видео в viewDidLoad вместо viewDidAppear - вью ещё не на экране." },

{ id:"u5", topic:"ui",
  q:"@State, @Binding, @StateObject, @ObservedObject, @EnvironmentObject - разложи по ролям",
  frame:"Деление по владению.\n1. @State - view владеет значением, источник истины, переживает пересоздание структуры.\n2. @Binding - ссылка на чужой источник истины ($state), чтение и запись без владения.\n3. @StateObject - view владеет ObservableObject: создаётся один раз на identity, переживает рекомпозиции родителя.\n4. @ObservedObject - объект пришёл извне, view только наблюдает; создавать его на месте нельзя.\n5. @EnvironmentObject - тот же наблюдаемый объект, но доставленный через environment вниз по дереву.",
  details:[
    "Главное правило собеседования: создаёшь объект в этой view - @StateObject; получаешь снаружи - @ObservedObject. Ошибка с = BannerListViewModel() в @ObservedObject - из код-ревью задания в live coding: state теряется при каждом обновлении родителя.",
    "@State приватен по конвенции: private var + $проекция для детей. Механика: значение лежит не в структуре, а в ячейке хранилища SwiftUI, привязанной к позиции вьюхи в дереве - потому и пишется без mutating.",
    "@Binding не хранит значение: внутри пара замыканий get/set плюс transaction (контекст анимации). $user.name через dynamicMemberLookup собирает новую пару на вложенное поле; Binding(get:set:) - руками, .constant() - для превью.",
    "Тихий баг @StateObject: он игнорирует новый объект, пришедший от родителя, - подменить модель извне не получится. Формулировка выбора для интервью: \"здесь @StateObject, потому что модель на экран одна и живёт весь срок экрана\".",
    "iOS 17+: макрос @Observable и var vm - гранулярное отслеживание по свойствам, семейство обёрток упрощается; упомянуть - плюс за актуальность.",
    "@EnvironmentObject падает в рантайме, если объект не положили в environment - трейд-офф удобства."
  ],
  trap:"Не путай пересоздание структуры View (дёшево, постоянно) и потерю state: state живёт в identity, а не в структуре." },

{ id:"u6", topic:"ui",
  q:"Жизненный цикл SwiftUI View и identity. Зачем нужен .id()?",
  frame:"1. View - лёгкое значение-описание: init и body выполняются часто, это не события жизни экрана.\n2. Дольше живёт identity: structural (позиция в дереве) либо explicit (.id(value)).\n3. State (@State/@StateObject) привязан к identity: пока она стабильна, state живёт сквозь пересоздания структур. Смена .id() для SwiftUI - новый экран: state сброшен, transition переигран.\n4. onAppear/onDisappear - события появления в render-дереве.",
  details:[
    "Ответ на \"зачем ID\": принудительное пересоздание и сброс состояния поддерева - например, обнулить локальный state формы при смене пользователя.",
    "if/else в body - две разные structural identity: state ветки теряется при переключении; AnyView и нестабильные ветки ломают анимации.",
    "В ForEach id обязан быть стабильным и уникальным: индексы массива при вставках перемешивают state строк - источник классических багов.",
    "Дорогая работа в init/body - антипаттерн: они зовутся на каждый чих; сайд-эффекты - в .task/.onAppear."
  ],
  trap:"\"init вызвался - экран пересоздался\" - неверно: структуры пересоздаются постоянно, экран живёт в identity. Это ядро всего вопроса." },

{ id:"u7", topic:"ui",
  q:"Как SwiftUI считает layout? Порядок .frame/.padding/.offset",
  frame:"Трёхшаговый танец:\n1. Родитель предлагает ребёнку размер.\n2. Ребёнок сам выбирает свой размер.\n3. Родитель размещает ребёнка.\nКаждый модификатор - обёртка-view, поэтому порядок это композиция: .frame(width: 100).padding() - паддинг вокруг рамки 100, а .padding().frame(width: 100) - рамка 100 включает паддинг. .offset двигает только отрисовку, layout-позиция не меняется - соседи не подвинутся.",
  details:[
    "GeometryReader занимает всё предложенное и даёт размеры детям - инструмент, но и источник поехавшей вёрстки, если ставить бездумно.",
    "PreferenceKey - канал снизу вверх: ребёнок публикует значение (offset, размер), родитель реагирует - так строится sticky header - частый практический вопрос.",
    "fixedSize - ребёнок игнорирует предложение и берёт идеальный размер; layoutPriority - кто уступает место.",
    "Кастомные лейауты - протокол Layout (iOS 16): честный ответ на \"как сделать сложное без GeometryReader-каши\"."
  ],
  trap:"Вопрос \"что изменится, если поменять местами frame и padding\" - обязан ответить мгновенно; правило: читай модификаторы снизу вверх как обёртки." },

{ id:"u8", topic:"ui",
  q:"LazyVStack vs VStack vs List",
  frame:"1. VStack создаёт все children сразу: подходит для небольших наборов; на длинном списке это сотни лишних вью и просадка на первом лейауте.\n2. LazyVStack (внутри ScrollView) создаёт view по мере приближения к viewport, но созданные не освобождает: это отложенное создание, а не переиспользование.\n3. List - системный контейнер с переиспользованием ячеек в духе UITableView, плюс готовые selection, swipe actions, separators.",
  details:[
    "Выбор: кастомный дизайн и умеренные списки - LazyVStack; длинные списки со стандартным поведением - List.",
    "Ленивым стекам нужна стабильная высота ячеек для честного скролла - прыгающая высота даёт дёрганый скролл-индикатор.",
    "В связке с пагинацией: onAppear последнего элемента как триггер подгрузки - рабочая идиома.",
    "Для сеток - LazyVGrid с теми же свойствами лени."
  ],
  trap:"\"LazyVStack переиспользует ячейки\" - не переиспользует: создаёт отложенно и удерживает созданные; переиспользование - у List и UICollectionView." },

{ id:"u9", topic:"ui",
  q:"@ViewBuilder - что это и как написать свой контейнер?",
  frame:"Result builder, который собирает блок из нескольких view в одно значение-дерево (TupleView, ConditionalContent) на этапе компиляции. Благодаря ему body и контейнеры принимают декларативный блок с if/else, switch, ForEach. Свой контейнер: generic-структура с полем content и init(@ViewBuilder content: () -> Content).",
  code:"struct Card<Content: View>: View {\n    private let content: Content\n    init(@ViewBuilder content: () -> Content) {\n        self.content = content()\n    }\n    var body: some View {\n        content\n            .padding()\n            .background(.thinMaterial, in: .rect(cornerRadius: 16))\n    }\n}",
  details:[
    "if без else строит Optional<Content>, if/else - ConditionalContent двух веток: отсюда и повороты анимаций при переключении веток.",
    "Исторический лимит 10 детей - арность TupleView; с новыми версиями снят (variadic generics), знать обе стороны - плюс.",
    "@ViewBuilder можно вешать на свои функции и computed properties - способ разбить большой body.",
    "Это тот же механизм result builders, что у @resultBuilder вообще - можно упомянуть кастомные DSL."
  ],
  trap:"\"Это просто синтаксис для нескольких вьюх\" - недожато: это компиляторная сборка типа-дерева, отсюда статическая типизация всего body." },

{ id:"u10", topic:"ui",
  q:"SwiftUI лагает при скролле. Как искать лишние перерисовки и чинить?",
  frame:"Диагностика: Self._printChanges() в body покажет, что дёрнуло перерисовку; Instruments -> SwiftUI template - body evaluation count и время. Классические причины:\n1. Нестабильные id в ForEach.\n2. @State/@Published слишком высоко в дереве - инвалидируется огромное поддерево.\n3. Тяжёлые вычисления прямо в body.\n4. Объект-монолит ObservableObject, где любое свойство будит все экраны.",
  details:[
    "Лечение: дробить view и state по месту использования, выносить вычисления из body, стабильные identity, Equatable-вью для отсечения диффа.",
    "iOS 17 @Observable сильно чинит гранулярность: view подписывается только на реально прочитанные свойства.",
    "Изображения: ресайз до размера показа, не грузить оригиналы в ячейки - вечная классика вне SwiftUI.",
    "Твой рабочий пример: расследование фризов перехода на экран - тяжёлая композиция блоков, а не сеть; расскажи как кейс профилирования."
  ],
  trap:"\"Поставлю drawingGroup и полетит\" - карго-культ: сначала измерение, потом точечное лечение причины." },

{ id:"u12", topic:"ui",
  q:"intrinsicContentSize, content hugging и compression resistance",
  frame:"intrinsicContentSize - собственный размер контента вью (лейбл знает размер текста, кнопка - тайтла с инсетами): Auto Layout превращает его в пару неявных constraint-ов на ось. Их приоритеты и есть ручки: content hugging - сопротивление растягиванию больше контента, compression resistance - сопротивление сжатию меньше контента.",
  details:[
    "Классика собеса: два лейбла в ряд, места мало - сожмётся тот, у кого ниже compression resistance; места много - растянется тот, у кого ниже hugging.",
    "Свой intrinsicContentSize возвращают кастомные вью; после изменения контента - invalidateIntrinsicContentSize(), не setNeedsLayout.",
    "UIView.noIntrinsicMetric - оси без собственного размера.",
    "SwiftUI-параллель: fixedSize - примерно \"задери hugging и resistance до required\", layoutPriority - кто уступает."
  ],
  trap:"Путать направления: hugging - про \"не растягивай\", resistance - про \"не сжимай\". Скажешь наоборот - решишь задачу про два лейбла зеркально неверно." },

{ id:"u11", topic:"ui",
  q:"Responder chain и hit-testing: как тап находит свою view?",
  frame:"Два механизма в разные стороны:\n1. Hit-testing - поиск цели, сверху вниз: от window вглубь, hitTest(_:with:) спрашивает point(inside:) и обходит сабвью; невидимые, с alpha < 0.01 или userInteractionEnabled = false пропускаются.\n2. Responder chain - обработка события, снизу вверх: view -> superview -> VC -> window -> application; так работают firstResponder и меню - chain of responsibility в чистом виде.",
  details:[
    "Расширить зону тапа маленькой кнопки - переопределить point(inside:) с inset-ом: любимый практический вопрос.",
    "Вью вне bounds родителя не ловит тапы (hit-test не заходит) - classic: ячейка с вылезающей кнопкой; лечится переопределением hitTest у родителя.",
    "Gesture recognizers живут поверх этой машинерии и умеют глотать touches - отсюда конфликты со скроллом.",
    "SwiftUI: contentShape задаёт зону тапа - аналог point(inside:)."
  ],
  trap:"Смешать направления: hit-testing идёт сверху вниз (поиск цели), responder chain - снизу вверх (обработка). Разведи явно." },

// ---------- CONCURRENCY ----------
{ id:"c1", topic:"conc",
  q:"Serial vs concurrent очереди; sync vs async. Что с чем сочетается?",
  frame:"Две независимые оси:\n1. Вид очереди: serial выполняет задачи строго по одной, concurrent - параллельно. Очередь - абстракция над потоками, не поток.\n2. Способ постановки: sync блокирует вызывающего до завершения задачи, async - нет.\nОси комбинируются как угодно: можно sync на concurrent и async на serial.",
  details:[
    "Очередь != поток: GCD сам решает, на каких потоках выполнять; у main-очереди поток один и особенный. Разница main и global - не \"главный или фоновый\", а последовательная против конкурентной: main - serial на главном потоке, global - concurrent с уровнями QoS.",
    "Почему UI только с main: UIKit не потокобезопасен - иерархия вью и цикл отрисовки рассчитаны на один поток без блокировок. И не говори \"иначе будет падение\": краш не гарантирован - чаще тихая порча состояния, артефакты отрисовки, зависание, а падает позже и в другом месте. Поэтому и существует Main Thread Checker.",
    "async на serial-очередь - главный паттерн защиты состояния: синхронизация без блокировок.",
    "QoS задаёт приоритет: userInteractive, userInitiated, utility, background.",
    "targetQueue - иерархии очередей: несколько serial-очередей поверх одной цели."
  ],
  trap:"\"sync значит на текущем потоке\" - не обязательно, но GCD часто оптимизирует sync выполнением на потоке вызывающего. Формулируй через блокировку вызывающего, а не потоки." },

{ id:"c2", topic:"conc",
  q:"Классический deadlock с GCD - воспроизведи по памяти.",
  code:"let serial = DispatchQueue(label: \"q\")\nserial.async {\n    serial.sync {      // deadlock\n        ...\n    }\n}\n// и знаменитое: DispatchQueue.main.sync { } с main",
  frame:"sync на ту же serial-очередь, внутри которой уже выполняешься: текущая задача ждёт завершения новой, а новая не начнётся, пока не завершится текущая - очередь-то последовательная. Формула: sync блокирует поток, который сам должен выполнить эту работу, - поток ждёт сам себя. Частный случай - main.sync с главного потока.",
  details:[
    "На concurrent-очереди такой sync не даст deadlock - задачи параллельны.",
    "Защита: не звать sync на собственную очередь; проверка dispatchPrecondition(condition: .onQueue(...)).",
    "Второй классический deadlock - два лока в разном порядке из двух потоков."
  ],
  trap:"Просят написать код deadlock на листочке почти на каждом интервью - отрепетируй эти пять строк." },

{ id:"c3", topic:"conc",
  q:"Data race vs race condition - это одно и то же?",
  frame:"Нет, это разные уровни.\n1. Data race - одновременный неатомарный доступ к памяти, хотя бы один пишущий: undefined behavior (UB), ловится Thread Sanitizer.\n2. Race condition - логическая гонка: итог зависит от порядка событий, даже если каждый доступ синхронизирован (классика - check-then-act).\nУстранить data race не значит устранить race condition.",
  details:[
    "Пример race condition без data race: if !exists { create() } из двух потоков под отдельными локами на каждом вызове.",
    "TSan - на data race; race condition ловится только головой и дизайном.",
    "Swift 6 strict concurrency закрывает data race на уровне компиляции (Sendable, изоляция акторов)."
  ],
  trap:"На интервью терминами часто жонглируют как синонимами - показать разницу это плюс балл." },

{ id:"c4", topic:"conc",
  q:"Чем синхронизировать состояние: serial queue, barrier, NSLock, os_unfair_lock, semaphore?",
  frame:"По нарастанию специфичности.\n1. Serial queue + async - дефолт GCD-мира: без блокировок, нет deadlock-класса проблем.\n2. Barrier на concurrent-очереди - читатели параллельно, писатель эксклюзивно.\n3. NSLock / os_unfair_lock - короткие критические секции, unfair_lock самый дешёвый.\n4. Semaphore - ограничение параллелизма N и мосты sync/async.\n5. Сегодня поверх всего - actor.",
  details:[
    "DispatchSemaphore не наследует QoS - источник priority inversion, Xcode об этом warning-ует.",
    "NSRecursiveLock - когда критическая секция может реентерить сама себя.",
    "@Atomic-обёртки на свойствах дают атомарность одного доступа, но не check-then-act.",
    "Читатель-писатель через barrier: .async(flags: .barrier) для записи, sync для чтения."
  ],
  trap:"Свойства в Swift неатомарны by design (в Obj-C atomic был дефолт) - и atomic-геттер всё равно не спасает от логических гонок инкремента." },

{ id:"c5", topic:"conc",
  q:"Что такое thread explosion и причём тут кооперативный пул Swift Concurrency?",
  frame:"1. Thread explosion - болезнь GCD: когда потоки блокируются (sync, semaphore под нагрузкой), система создаёт новые - сотни потоков, память и контекст-свитчи.\n2. Swift Concurrency отвечает кооперативным пулом шириной в число ядер: задачи не блокируют поток, а снимаются с него в точках await - потоков мало, прогресс всегда есть.",
  details:[
    "Отсюда главное правило: не блокировать потоки кооперативного пула (semaphore.wait, sleep, sync) - это ломает контракт forward progress.",
    "await - потенциальная точка приостановки: после неё можешь проснуться на другом потоке.",
    "Continuation-ы (withCheckedContinuation) - мост из callback-мира в async/await."
  ],
  trap:"\"async/await - это сахар над GCD\" - нет: другая модель исполнения с кооперативным пулом и приостановкой вместо блокировки." },

{ id:"c6", topic:"conc",
  q:"Structured concurrency: Task, TaskGroup, async let. Что даёт структурность?",
  frame:"Структурность: дочерние задачи привязаны к скоупу родителя - родитель не завершится, пока живы дети, отмена распространяется вниз, ошибки поднимаются вверх. Инструменты:\n1. async let - параллельный запуск фиксированной пары-тройки задач.\n2. TaskGroup - динамическое число параллельных задач.\n3. Task { } - неструктурированная задача, но наследует контекст: актор, приоритет, task-local.\n4. Task.detached - без структуры и без контекста; нужен редко и осознанно.",
  details:[
    "Отмена кооперативная: никто никого не убивает, задача сама проверяет Task.isCancelled / try Task.checkCancellation.",
    "Task { } наследует актор-контекст места создания - из @MainActor кода получишь main-actor задачу.",
    "Ловушка интуиции: \"Task выполняется на потоке вызова\" - нет. Task наследует actor и приоритет, а не поток; внутри он может менять поток на каждом await. Поток - деталь реализации кооперативного пула.",
    "Task.detached - почти всегда запах; нужен редко и осознанно.",
    "Приоритеты наследуются и эскалируются - в отличие от голого GCD с semaphore."
  ],
  trap:"\"Отмена останавливает задачу\" - нет: только выставляет флаг. Забытая проверка isCancelled - и работа продолжается впустую." },

{ id:"c7", topic:"conc",
  q:"Actor: какую проблему решает и что такое reentrancy?",
  frame:"Actor - тип с изоляцией состояния: все обращения к его данным сериализуются, извне доступ только через await. Компилятор запрещает синхронный доступ снаружи - data race по состоянию актора исключён на уровне типов. Но актор реентерабелен: на await внутри метода изоляция отпускается, и другой вызов может вклиниться. Формула: actor защищает от гонки данных, но не от гонки логики.",
  details:[
    "Reentrancy - главный сюрприз: инварианты, проверенные до await, после await могут быть уже нарушены. Перечитывай состояние после каждого await.",
    "MainActor - глобальный актор главного потока: @MainActor на классе/методе/свойстве заменяет DispatchQueue.main.",
    "nonisolated - метод без доступа к изолированному состоянию, можно звать синхронно.",
    "Actor hopping: лишние прыжки между акторами - цена; группируй работу."
  ],
  trap:"\"Актор - это как serial queue\" - близко, но упусти reentrancy - и на дожиме поплывёшь: очередь задач актора может перемежаться на await." },

{ id:"c8", topic:"conc",
  q:"Sendable: что проверяет и когда нужен @unchecked?",
  frame:"Sendable - маркер \"значение безопасно пересекает границы изоляции\" (между задачами и акторами). Структуры из Sendable-полей - автоматически; классы - только final с let-полями, иначе никак. Компилятор Swift 6 в strict-режиме не даст передать не-Sendable через границу - так data race ловится на компиляции.",
  details:[
    "@unchecked Sendable - \"я гарантирую сам\": класс с внутренним локом. Ответственность на тебе.",
    "@Sendable у замыканий - запрет захвата мутабельного состояния.",
    "Миграция на Swift 6 - по сути расстановка Sendable/изоляций по кодовой базе; больная тема многих команд, хорошо звучит в разговоре про реальный опыт."
  ],
  trap:"Класс с var-полем не станет Sendable, даже если \"мы аккуратно\": либо актор, либо final+let, либо @unchecked с локом и совестью." },

{ id:"c9", topic:"conc",
  q:"GCD vs OperationQueue - когда очередь операций всё ещё оправдана?",
  frame:"OperationQueue - надстройка над GCD: зависимости между задачами, отмена, KVO-наблюдение состояния, maxConcurrentOperationCount. Оправдана для отменяемых цепочек с зависимостями - классика: загрузка и декодинг изображений с отменой при переиспользовании ячейки. Для всего остального сегодня - GCD или Swift Concurrency.",
  details:[
    "Operation - объект: состояние pending/executing/finished, можно сабклассить (async operation - известная боль с KVO isFinished).",
    "Отмена в Operation тоже кооперативная: isCancelled проверяешь сам.",
    "Structured concurrency закрывает те же потребности элегантнее: TaskGroup + отмена по скоупу."
  ],
  trap:"cancel() у Operation не останавливает выполняющуюся операцию - только флаг, как и Task.cancel()." },

{ id:"c10", topic:"conc",
  q:"Priority inversion: что это и как система с ней борется?",
  frame:"Низкоприоритетная задача держит ресурс, нужный высокоприоритетной - высокая ждёт низкую, а среднеприоритетные вытесняют низкую: инверсия. GCD эскалирует приоритет: sync на очередь с более низким QoS поднимает её QoS до вызывающего; локи наследуют приоритет держателя.",
  details:[
    "DispatchSemaphore и DispatchGroup.wait НЕ эскалируют - системе неизвестно, кто \"держит\" семафор. Отсюда Xcode-предупреждения про semaphore в async-коде.",
    "Swift Concurrency наследует и эскалирует приоритеты задач по дереву структурной конкуренции.",
    "Практика: не смешивать QoS хаотично, не строить свои примитивы на семафорах без нужды."
  ],
  trap:"Вопрос \"чем плох semaphore\" - это почти всегда про отсутствие эскалации QoS: назови это - и дожима не будет." },

{ id:"c11", topic:"conc",
  q:"@MainActor против DispatchQueue.main.async - в чём выигрыш?",
  frame:"1. @MainActor - декларативная изоляция: компилятор знает, что метод или свойство трогается только с главного потока, сам вставляет прыжок где нужно, а нарушение - ошибка компиляции.\n2. DispatchQueue.main.async - ручная дисциплина: забыл обернуть - узнаешь в рантайме от Main Thread Checker или пользователей.",
  details:[
    "await MainActor.run { } - точечный прыжок из фонового контекста.",
    "Task { } внутри @MainActor-класса уже на главном акторе - main.async не нужен.",
    "assumeIsolated - когда точно знаешь, что уже на MainActor, а компилятор нет.",
    "UIKit/SwiftUI типы помечены @MainActor в SDK."
  ],
  trap:"Двойной main.async \"для надёжности\" и лесенки DispatchQueue.main.async в async-коде - признак несмешанной миграции; интервьюеры любят спросить, как это чистить." },

{ id:"c12", topic:"conc",
  q:"Как обернуть callback-API в async/await?",
  code:"func fetch() async throws -> Data {\n    try await withCheckedThrowingContinuation { cont in\n        legacyFetch { data, error in\n            if let error { cont.resume(throwing: error) }\n            else { cont.resume(returning: data!) }\n        }\n    }\n}",
  frame:"withCheckedContinuation / withCheckedThrowingContinuation: получаешь continuation, вызываешь legacy-API, в его колбэке резюмишь ровно один раз - returning или throwing. Checked-варианты ловят двойной resume и забытый resume в рантайме.",
  details:[
    "Резюмить ровно один раз - главный контракт: ноль раз - вечно висящий await, два - краш (в checked) или undefined behavior (в unsafe).",
    "withUnsafeContinuation - без проверок, чуть быстрее, для горячих мест.",
    "Для многозначных колбэков (прогресс, поток событий) - не continuation, а AsyncStream."
  ],
  trap:"Колбэк, который может не вызваться (например, отписка) - утёкший await навсегда: думай о пути отмены, Continuation + Task cancellation handler." },

{ id:"c13", topic:"conc",
  q:"Параллельность vs асинхронность - в чём разница?",
  frame:"1. Асинхронность - про модель вызова: не блокируем вызывающего в ожидании результата, продолжение придёт потом; возможна даже на одном ядре.\n2. Параллельность - про физику исполнения: несколько задач реально работают одновременно на разных ядрах.\nСвязи нет: асинхронный код не обязан быть параллельным, параллельный - асинхронным.",
  details:[
    "Пример асинхронности без параллельности: main run loop и колбэки таймеров на одном потоке.",
    "Пример параллельности: concurrentPerform раскидывает итерации по ядрам и блокирует вызывающего до конца - параллельно, но синхронно.",
    "async/await - синтаксис асинхронности; параллельность в нём появляется явно: async let, TaskGroup.",
    "Хороший мостик в ответе: GCD-очередь - инструмент асинхронности, а её concurrent-вариант добавляет параллельность."
  ],
  trap:"Смешать понятия в одну кучу - вопрос-фильтр ровно на это. Держи по одной короткой формуле на каждое слово." },

{ id:"c14", topic:"conc",
  q:"Запрос вернул 10 URL картинок. Загрузить параллельно, но сохранить порядок. Как?",
  code:"let images = try await withThrowingTaskGroup(\n    of: (Int, UIImage).self\n) { group in\n    for (index, url) in urls.enumerated() {\n        group.addTask { (index, try await load(url)) }\n    }\n    var result = [UIImage?](repeating: nil, count: urls.count)\n    for try await (index, image) in group {\n        result[index] = image\n    }\n    return result.compactMap { $0 }\n}",
  frame:"TaskGroup (или async let для фиксированного малого числа): задачи стартуют параллельно, завершаются в произвольном порядке, поэтому каждая возвращает свой индекс, а результаты раскладываются в преаллоцированный массив по индексу - не по порядку завершения.",
  details:[
    "Ключевая фраза для интервьюера: собираю по индексу, потому что порядок завершения не гарантирован.",
    "Обработка частичных ошибок - решение по требованиям: ThrowingTaskGroup падает целиком (и отменяет остальных), либо ловить ошибку в самой задаче и возвращать nil/placeholder.",
    "Ограничить степень параллелизма - добавлять в группу порциями (по мере for try await), классика для сотен URL.",
    "Старый мир: DispatchGroup + concurrent queue + массив под локом - назвать как альтернативу, но вести к TaskGroup."
  ],
  trap:"Ответ \"соберу в порядке прихода и отсортирую\" - обходной костыль; ждут именно индексацию. Этот вопрос встречается в вопросниках дословно." },

{ id:"c15", topic:"conc",
  q:"Как переводить существующий проект с GCD на async/await?",
  frame:"Стратегия: по слоям, снизу вверх, начиная с сетевого.\n1. Сначала листья: обернуть callback-API в async-функции (withCheckedThrowingContinuation) или перейти на async data(for:).\n2. Дальше сервисы и репозитории: методы становятся async throws, completion-параметры уходят.\n3. ViewModel: Task { } на месте вызовов, @MainActor для состояния UI - лесенки DispatchQueue.main.async исчезают сами.\n4. Смешанный период нормален: мосты continuation в одну сторону и Task { } в другую. Главное - не блокировать кооперативный пул: никаких semaphore.wait поверх async.\n5. Финал: включить strict concurrency предупреждениями, расставить Sendable и изоляции - data race начинает ловить компилятор.",
  details:[
    "Правило порядка: конвертируй вызываемое раньше вызывающего - иначе на каждом шаге городишь временные мосты в обе стороны.",
    "Потоки событий (делегаты, многоразовые колбэки) - не continuation, а AsyncStream: continuation резюмится ровно один раз.",
    "Атомарность рефакторинга: одна подсистема на MR, поведение не меняется - только форма асинхронности.",
    "Это готовая история для интервью: вопрос \"как мигрировать проект на structured concurrency\" любят задавать сеньорам именно про стратегию, а не про синтаксис."
  ],
  trap:"Начать с UI - обернуть всё в Task, оставив внутри старые семафоры - худший путь: блокировки кооперативного пула и инверсии приоритетов. Async-обёртка поверх блокирующего кода хуже честного GCD." },

// ---------- NETWORKING ----------
{ id:"n1", topic:"net",
  q:"Свойства REST. Чем REST отличается от WebSocket и когда что брать?",
  frame:"1. REST - стиль с ограничениями: клиент-сервер, stateless (каждый запрос самодостаточен), кэшируемость, единый интерфейс (ресурсы, HTTP-глаголы, коды), слоистость.\n2. WebSocket - постоянное полнодуплексное соединение: обе стороны шлют кадры в любой момент.\n3. Выбор: CRUD и ресурсы - REST; реальное время с пушем от сервера (чат, котировки, live-статусы) - WebSocket; серединные варианты - SSE или long polling.",
  details:[
    "Stateless - главный пункт для интервьюера: сервер не хранит состояние сессии, токен едет в каждом запросе; отсюда горизонтальная масштабируемость.",
    "Цена WebSocket на мобиле: жизнь соединения в background, reconnect с backoff, heartbeat - честно назови эксплуатационную сложность.",
    "Кэшируемость REST - это ETag/Cache-Control и URLCache бесплатно; у WebSocket кэша нет по природе.",
    "gRPC/GraphQL упомянуть как альтернативы - одним предложением, без глубины."
  ],
  trap:"\"REST - это когда JSON по HTTP\" - определение через формат вместо ограничений; JSON вообще не часть REST." },

{ id:"n2", topic:"net",
  q:"Чем REST отличается от RESTful?",
  frame:"REST - архитектурный стиль: набор ограничений из диссертации Филдинга. RESTful - характеристика конкретного API: оно RESTful, если реально следует этим ограничениям, а не просто гоняет JSON по HTTP. Вопрос терминологический, и суть ответа: большинство \"REST API\" в проде - HTTP-RPC с ресурсоподобными путями.",
  details:[
    "Модель зрелости Ричардсона - готовый каркас ответа: уровень 0 - один эндпоинт-RPC, уровень 1 - ресурсы, уровень 2 - глаголы и коды HTTP (здесь живёт практически весь продакшен), уровень 3 - HATEOAS (гипермедиа-ссылки в ответах).",
    "HATEOAS почти никто не делает - сказать это вслух и почему (клиентам нужна статическая типизация контрактов) - зрелая позиция.",
    "Примеры нарушений RESTful в жизни: глаголы в путях (/getUser), состояние на сервере, POST на всё подряд.",
    "Три балла дают за структуру: стиль vs соответствие стилю + уровни зрелости."
  ],
  trap:"Ответ \"это одно и то же\" стоит ноль; вопрос и создан отделять тех, кто видел теорию, от тех, кто только писал URLSession-вызовы." },

{ id:"n3", topic:"net",
  q:"Как устроить retry запросов и обработку 401?",
  frame:"Retry:\n1. Только на транзиентных ошибках - таймауты, обрывы, 5xx, 429 (с уважением к Retry-After); остальные 4xx не ретраим - запрос неисправим.\n2. Экспоненциальный backoff с джиттером и лимит попыток.\n3. Безопасно ретраить только идемпотентное: GET/PUT/DELETE; POST - лишь с idempotency key.\nОбработка 401:\n1. Интерцептор ловит ответ.\n2. Single-flight рефреш токена: один на все параллельные запросы, остальные ждут.\n3. Повтор оригинального запроса с новым токеном; провалился рефреш - разлогин.",
  details:[
    "Single-flight - слово, которое отличает практика: без него шторм из N параллельных 401 устраивает N рефрешей и гонку токенов.",
    "Реализация: middleware/interceptor слоем над клиентом - в Ktor это плагин (Auth), в URLSession - обёртка или delegate; называй архитектурно, не привязываясь к либе.",
    "Бесконечный цикл 401 -> refresh -> 401 - обязательный guard: не ретраить сам рефреш и запрос после одного повтора.",
    "Джиттер в backoff - защита от thundering herd после падения бэка."
  ],
  trap:"Ретраить всё подряд включая 400 - в исходном задании про аналитику это прямо прописано как ошибка; 400 не лечится повтором." },

{ id:"n4", topic:"net",
  q:"URLSession: конфигурации, кэш, async API",
  frame:"Три конфигурации:\n1. default - диск-кэш, куки.\n2. ephemeral - всё в памяти, приватность.\n3. background - загрузки отдельным системным процессом, переживают kill приложения; результат приходит через handleEventsForBackgroundURLSession.\nСовременный API - async data(for:), устаревающий - dataTask с колбэком. Кэш - URLCache по HTTP-правилам (Cache-Control, ETag), настраивается cachePolicy на запросе.",
  details:[
    "Background session - вопрос из реального вопросника: система сама качает, приложение будят по завершении; ограничения - только download/upload tasks, никаких data tasks.",
    "waitsForConnectivity - вместо ручного retry на \"нет сети\": сессия сама подождёт появления соединения.",
    "Таймауты два: timeoutIntervalForRequest (между порциями данных) и ForResource (на весь ресурс) - их путают.",
    "async data(for:) участвует в структурной конкуренции: отмена Task отменяет запрос - бесплатная отмена, которой не было у голых колбэков."
  ],
  trap:"\"Background session - это queue.async с запросом\" - нет: это системный демон и отдельный процесс, работающий после смерти приложения." },

// ---------- БАЗЫ ДАННЫХ (компактно: тонкий клиент) ----------
{ id:"db1", topic:"db",
  q:"Какое хранилище выбрать под задачу на клиенте?",
  frame:"Рамка ответа: клиент тонкий, храним минимум - настройки, токены, кэш.\n1. UserDefaults - маленькие настройки, не секреты и не блобы.\n2. Keychain - токены и секреты: шифруется системой.\n3. Файлы/Caches + URLCache - блобы и HTTP-кэш, система может чистить Caches сама.\n4. Core Data - когда нужен объектный граф со связями и ленивой подгрузкой.\n5. SQLite/GRDB - реляционные данные с полным контролем над запросами.\nВыбор - от формы данных и требований, а не от привычки.",
  details:[
    "Прозвучать должно: токены НЕ в UserDefaults - это plist без шифрования, доступный на джейлбрейке.",
    "Честная сеньорская позиция для тонкого клиента: сложная офлайн-база нужна редко, и тащить Core Data ради трёх настроек - оверинжиниринг.",
    "Про миграции спрашивают следом: у UserDefaults их нет, у Core Data - lightweight migration, у SQLite - руками (user_version).",
    "Данные для виджетов/расширений - App Group контейнер: практическая деталь."
  ],
  trap:"Начать с \"возьму Core Data\" без вопроса о форме данных - интервьюер услышит выбор инструмента раньше задачи." },

{ id:"db2", topic:"db",
  q:"Core Data: стек и многопоточность контекстов - главное, что докручивают",
  frame:"1. Стек: NSPersistentContainer = модель + coordinator + store + контексты.\n2. Правило номер один: контекст и его объекты живут в своей очереди - viewContext на main, фоновые через newBackgroundContext/performBackgroundTask, весь доступ строго внутри perform/performAndWait.\n3. Объекты между контекстами не переносимы: передаётся NSManagedObjectID, объект перечитывается в своём контексте.\n4. Синхронизация: automaticallyMergesChangesFromParent у viewContext подтягивает фоновые сохранения.",
  details:[
    "Классический краш всех Core Data-проектов - объект из фонового контекста тронули на main; ловится флагом -com.apple.CoreData.ConcurrencyDebug 1.",
    "NSFetchedResultsController - реактивные выборки для списков: делегат о вставках/удалениях, дифф бесплатно.",
    "faulting - объекты грузятся лениво (fault до первого доступа): и фича памяти, и источник N+1-подобных сюрпризов.",
    "Если спросят \"почему не Core Data у вас\": тонкий клиент, сложного графа нет - осознанный выбор, не незнание."
  ],
  trap:"\"Сделаю контекст и буду писать из любого потока\" - главная ошибка темы; каждое обращение через perform, включая чтение свойств объекта." },

{ id:"db3", topic:"db",
  q:"SQLite-минимум: индексы, транзакции, WAL",
  frame:"1. Индекс - B-tree поверх колонки: SELECT по ней перестаёт быть полным перебором, но каждая запись дополнительно обновляет дерево - индексируют то, по чему ищут, а не всё.\n2. Транзакции - ACID; атомарный батч записей ещё и быстрее россыпи одиночных INSERT: один fsync вместо N.\n3. WAL-режим - журнал с опережающей записью: читатели не блокируются писателем, стандарт для мобильных.",
  details:[
    "Уровень достаточный: что индекс ускоряет и что замедляет, зачем транзакция вокруг батча, буквы ACID по слову каждая.",
    "EXPLAIN QUERY PLAN - как проверить, что запрос пошёл по индексу: одна команда, звучит опытно.",
    "Миграции - PRAGMA user_version и последовательные шаги; GRDB даёт DatabaseMigrator.",
    "Связка с s20: индекс - это те же деревья и хеши, что в вопросе про устройство коллекций."

  trap:"\"Понавешаю индексов на все колонки\" - каждая запись платит за каждый индекс; сеньорский ответ всегда про трейд-офф." },

// ---------- ТЕСТИРОВАНИЕ ----------
{ id:"t1", topic:"test",
  q:"Unit vs snapshot vs UI-тесты. Что где применять?",
  frame:"Три уровня.\n1. Unit - логика без UI: быстрые, дешёвые, их большинство - ViewModel, UseCase, маппинги.\n2. Snapshot - рендер компонента сравнивается с эталонной картинкой: ловит визуальные регрессии вёрстки, дешевле UI-тестов на порядки.\n3. UI/E2E - прогон реального приложения: дорогие и хрупкие, только критичные сценарии.\nПирамида: много unit, слой snapshot на компоненты дизайн-системы, единицы E2E.",
  details:[
    "Твоя фактура: скриншот-тесты Paparazzi в KMP-монорепе - рендер Compose без эмулятора, эталоны в git через LFS; на чистом iOS аналог - swift-snapshot-testing.",
    "Боль snapshot-тестов, которую стоит назвать: флак на версиях ОС/шрифтах/девайсах - эталоны привязывают к фиксированной конфигурации.",
    "Snapshot не проверяет поведение: кнопка может выглядеть идеально и не работать - поэтому пирамида, а не замена одних другими.",
    "E2E-фреймворк поверх диплинков в большой монорепе - можешь упомянуть как масштаб."
  ],
  trap:"\"Snapshot-тесты - это UI-тесты\" - смешение уровней: snapshot рендерит компонент в памяти, UI-тест гоняет приложение целиком." },

{ id:"t2", topic:"test",
  q:"Как писать тестируемый код? Моки, стабы, фейки",
  frame:"Тестируемость = управляемые зависимости: протокол на границе + инъекция через init - в тесте вместо сети и базы встают дублёры. Терминология дублёров:\n1. stub - отдаёт заготовленные ответы.\n2. mock - записывает вызовы, тест проверяет взаимодействие.\n3. fake - настоящая упрощённая реализация (in-memory хранилище).\nСтрой тест как given-when-then и проверяй поведение через публичный контракт, а не приватные потроха.",
  details:[
    "Всё, что делает код нетестируемым, уже собрано в этой базе: синглтоны (скрытая зависимость), Date()/UUID() внутри логики (инжектируй генераторы), DispatchQueue.main в ViewModel (инжектируй scheduler/executor).",
    "Не мокай чужое: мокается свой протокол-граница, а не URLSession целиком - иначе тест проверяет мок.",
    "Один тест - одна причина упасть: сто assert-ов в одном тесте это лог, а не тест.",
    "Твой пример из практики: ViewModel с инжектированным scope/фабрикой скоупов в KMP - ровно та же дисциплина."
  ],
  trap:"На просьбу \"продай тесты\" отвечать \"находят баги\" - слабо; сильный ответ: тесты фиксируют контракт и дают смелость рефакторить." },

{ id:"t3", topic:"test",
  q:"Как тестировать асинхронный код?",
  frame:"1. Современный путь: тестовая функция сама async - await вызова, assert результата, никакой магии.\n2. Колбэки legacy - XCTestExpectation: создал, fulfill в колбэке, wait с таймаутом.\n3. Combine - собрать значения publisher-а с expectation или прогнать через синхронный scheduler.\nГлавный принцип: убрать реальное время - никаких sleep, инжектируемые часы/шедулеры вместо ожидания стены.",
  details:[
    "Флак от времени - причина номер один красных CI: тест с sleep(1) это лотерея; clock injection (ContinuousClock в протокол) решает.",
    "MainActor-изоляция ViewModel - помечай тест @MainActor, иначе гонки чтения состояния.",
    "Порядок и ожидание нескольких событий: expectation.expectedFulfillmentCount, inverted expectations для \"не должно случиться\".",
    "Swift Concurrency в тестах поощряет дизайн: если для теста нужно ловить моменты между await - подумай, не течёт ли абстракция."
  ],
  trap:"sleep в тесте - автоматический минус: либо CI медленный, либо флак; всегда есть способ дождаться события, а не времени." },

{ id:"t4", topic:"test",
  q:"Swift Testing vs XCTest - что нового?",
  frame:"Swift Testing (Xcode 16+):\n1. @Test-функции вместо наследников XCTestCase.\n2. Один макрос #expect вместо зоопарка XCTAssert*; #require - для прерывающих проверок.\n3. Параметризованные тесты через @Test(arguments:).\n4. Теги и параллельный запуск по умолчанию.\nЖивёт рядом с XCTest в одном таргете - мигрировать можно постепенно.",
  details:[
    "#expect показывает развёрнутое выражение при падении - читаемость ошибок радикально лучше XCTAssertEqual.",
    "Параметризация из коробки убивает копипасту табличных тестов - главный практический выигрыш.",
    "UI-тесты и performance-тесты остаются на XCTest - Swift Testing про unit.",
    "Знание этой темы - маркер актуальности: вопрос \"что нового в iOS-разработке за последний год\" есть в скрининговых списках."
  ],
  trap:"Паника \"всё переписывать\" - нет: сосуществуют; ответ про стратегию - новые тесты на Swift Testing, старые живут." },

// ---------- АЛГОРИТМЫ ----------
{ id:"al1", topic:"algo",
  q:"Как отвечать на алгоритмическую задачу: процесс дороже ответа",
  frame:"Протокол из пяти шагов.\n1. Уточнить условия и границы: размер входа, дубликаты, отрицательные, пустота.\n2. Проговорить наивное решение и его сложность - это уже зачётный бейзлайн.\n3. Улучшить структурой данных или паттерном: hash map, два указателя, сортировка.\n4. Назвать сложность финала по времени и памяти.\n5. Прогнать вслух edge cases: пусто, один элемент, все одинаковые.",
  details:[
    "Молчаливое кодирование - главный провал формата: интервьюер оценивает ход мысли, говори постоянно.",
    "Застрял - скажи, где именно и какие варианты взвешиваешь: подсказку дают тем, кто рассуждает.",
    "Сложности коллекций Swift ты уже знаешь из карточки s20 - связывай: \"словарь здесь даёт O(1) амортизированный\".",
    "Просить пример входа-выхода - не слабость, а проверка понимания условия."
  ],
  trap:"Сразу писать код оптимального решения без слов - даже верное решение при немом процессе оценивается ниже говорящего наивного." },

{ id:"al2", topic:"algo",
  q:"Hash map паттерны: two sum, частоты, анаграммы",
  code:"// Two Sum за O(n)\nfunc twoSum(_ nums: [Int], _ target: Int) -> (Int, Int)? {\n    var seen: [Int: Int] = [:]   // значение -> индекс\n    for (i, n) in nums.enumerated() {\n        if let j = seen[target - n] { return (j, i) }\n        seen[n] = i\n    }\n    return nil\n}",
  frame:"Словарь превращает поиск пары/дубликата/частоты из O(n^2) в O(n): один проход, на каждом шаге спрашиваем \"видел ли я дополнение\". Родственники: частотный словарь (анаграммы - равенство частот, first unique character), группировка по ключу (Dictionary(grouping:by:)).",
  details:[
    "Анаграммы элегантно: Dictionary(grouping: words, by: { String($0.sorted()) }) - и ты сгруппировал за строчку.",
    "reduce(into: [:]) { $0[$1, default: 0] += 1 } - идиома частот, выучи пальцами.",
    "Set для \"есть ли дубликаты\": Set(array).count != array.count - одной строкой.",
    "Проговаривай цену: память O(n) в обмен на время - это и есть трейд-офф ответа."
  ],
  trap:"two sum перебором пар со словами \"ну можно и так\" - именно этот вопрос существует, чтобы услышать hash map." },

{ id:"al3", topic:"algo",
  q:"Два указателя и скользящее окно",
  code:"// Самая длинная подстрока без повторов - O(n)\nfunc lengthOfLongestSubstring(_ s: String) -> Int {\n    var lastSeen: [Character: Int] = [:]\n    var start = 0, best = 0\n    for (i, ch) in Array(s).enumerated() {\n        if let prev = lastSeen[ch], prev >= start {\n            start = prev + 1\n        }\n        lastSeen[ch] = i\n        best = max(best, i - start + 1)\n    }\n    return best\n}",
  frame:"1. Два указателя - по отсортированному массиву или с двух концов: палиндром, пара с суммой, слияние.\n2. Скользящее окно - подмассив или подстрока с условием: правая граница ползёт всегда, левая подтягивается при нарушении инварианта.\nОба паттерна дают O(n) там, где лоб в лоб даёт O(n^2).",
  details:[
    "Ключ окна - сформулировать инвариант вслух: \"в окне нет повторов\"; код пишется от инварианта.",
    "Для строк в Swift удобно сразу Array(s) - прямая индексация вместо String.Index-гимнастики на интервью.",
    "Палиндром двумя указателями - разминка, которую просят написать быстро: left/right к центру.",
    "Маркер выбора паттерна: слова \"подряд идущие\", \"подстрока\", \"окно\" в условии."
  ],
  trap:"Дёргать s[s.index(...)] на интервью - утонешь в синтаксисе; Array(s) и обычные Int-индексы - легальный приём, объяви его." },

{ id:"al4", topic:"algo",
  q:"Бинарный поиск: инварианты и границы",
  code:"func lowerBound(_ a: [Int], _ target: Int) -> Int {\n    var lo = 0, hi = a.count   // [lo, hi)\n    while lo < hi {\n        let mid = lo + (hi - lo) / 2\n        if a[mid] < target { lo = mid + 1 }\n        else { hi = mid }\n    }\n    return lo   // первый индекс, где a[i] >= target\n}",
  frame:"Работает на всём монотонном, не только на массивах: \"первая версия с багом\", \"минимальная вместимость\" - бинарный поиск по ответу. Пиши через полуинтервал [lo, hi) и инвариант \"ответ в диапазоне\": уходят вечные ошибки на единицу и бесконечные циклы.",
  details:[
    "lower bound (первый >= target) - универсальная форма: из неё выводится и точный поиск, и upper bound, и вставка.",
    "mid = lo + (hi - lo) / 2 - привычка против переполнения; в Swift Int переполнится крашем, скажи это - плюс.",
    "Сложность O(log n) - и умей объяснить почему: диапазон делится пополам.",
    "Признак задачи \"на ответ\": \"минимальное X, при котором условие выполняется\" и монотонность условия."
  ],
  trap:"while lo <= hi с hi = count - 1 и правки на глазок - вечный источник off-by-one; одна выученная форма с [lo, hi) закрывает все варианты." },

{ id:"al5", topic:"algo",
  q:"Деревья и рекурсия: DFS/BFS без леткодного фанатизма",
  frame:"1. DFS - рекурсия или явный стек: обходы pre/in/post, глубина, поиск пути.\n2. BFS - очередь: уровни, кратчайший путь в невзвешенном графе.\nНа iOS-собесах деревья приходят в родном виде: обойти view hierarchy, найти сабвью по условию, посчитать глубину JSON - структура та же, что у бинарного дерева из учебника.",
  details:[
    "Рекурсия и стек: глубокая иерархия - StackOverflow; итеративный вариант с явным стеком - готовый ответ на \"а если дерево огромное\".",
    "BFS по уровням - паттерн \"размер уровня зафиксировал, обработал, следующий\": пиши его не думая.",
    "Higher-order на деревьях: рекурсивный flatMap по subviews - Swift-идиоматичный обход.",
    "Сложности: обе стратегии O(узлов); разница - память: DFS - глубина, BFS - ширина."
  ],
  trap:"Начать BFS рекурсией - структурная путаница; рекурсия натурально даёт DFS, BFS живёт на очереди." },

{ id:"al6", topic:"algo",
  q:"Сортировки и встроенный sort: что реально спрашивают",
  frame:"Наизусть писать quicksort почти не просят - спрашивают понимание: сравнительные сортировки не быстрее O(n log n); Swift sort - introsort (quicksort + heapsort + insertion) без гарантии стабильности... формально стабильность не документирована - для стабильности сортируй по составному ключу. sorted(by:) с кастомным компаратором и сортировка по нескольким ключам - практика, которую просят написать.",
  details:[
    "Компаратор по двум ключам: сначала по дате, при равенстве по имени - tuple-приём (a.date, a.name) < (b.date, b.name).",
    "Когда сортировка лишняя: top-1 это max за O(n), не sort; частичный топ-K - куча или prefix после sort с оговоркой.",
    "Bucket/counting sort O(n) - когда ключи из маленького диапазона: оценки 1-5, статусы.",
    "Устойчивость: знай определение (равные сохраняют порядок) - вопрос-фильтр теории."
  ],
  trap:"\"Отсортирую и возьму первый\" для поиска максимума - O(n log n) вместо O(n): мелочь, по которой судят чутьё сложности." },

// ---------- PROFILING ----------
{ id:"p1", topic:"prof",
  q:"Приложение тормозит. Методика поиска узкого места",
  frame:"1. Сначала воспроизводимый сценарий и метрика (время, fps, память) - потом инструменты.\n2. Time Profiler: heaviest stack trace, смотреть main thread - всё тяжёлое на нём и есть фризы UI.\n3. Точечные замеры - os_signpost вокруг подозрительных участков, видны в Instruments.\n4. В проде - MetricKit и мониторинг hangs/hitches.\n5. Починил одно место - перемерь: без цифр до и после это не оптимизация, а надежда.",
  details:[
    "Твой готовый кейс-история: фризы перехода на экран рецепта - профилирование показало тяжёлую композицию блоков, а не сеть; гипотеза \"это сеть\" не подтвердилась цифрами. Рассказывай именно так.",
    "Debug-сборка врёт о производительности (без оптимизаций, с проверками) - профилировать release/profile-конфигурацию.",
    "Hitches - пропуски кадров при скролле: Instruments Animation Hitches, бюджет кадра 8-16 мс.",
    "Классика находок: синхронный JSON-декодинг на main, картинки полного размера в ячейках, лишние layout-проходы."
  ],
  trap:"Оптимизировать по интуиции без профайла - антипаттерн, который вопрос и выявляет; первое слово ответа - \"измерю\"." },

{ id:"p2", topic:"prof",
  q:"Как искать утечки памяти - с Instruments и без?",
  frame:"1. Instruments Leaks - потерянные объекты; утечку по циклу может не увидеть - объект-то достижим.\n2. Instruments Allocations с growth-анализом - что копится от итерации к итерации.\n3. Memory Graph Debugger в Xcode - снимок графа ссылок: выбираешь объект, видишь, кто его держит; циклы видны стрелками.\n4. Без Instruments: логи или брейкпоинты в deinit (не вызвался после закрытия экрана - утечка), счётчики живых инстансов в debug-сборке.",
  details:[
    "Быстрый ритуал на каждый экран: открыл-закрыл-открыл, Memory Graph - экземпляр VC один или копится?",
    "Malloc Stack Logging включает запись стеков аллокаций - в Memory Graph видно, где создался висящий объект.",
    "Частые виновники за пределами замыканий: Timer с target, NotificationCenter-блоки, Combine-подписки, DispatchWorkItem в свойстве.",
    "KMP-граница добавляет свой класс утечек (Swift-Kotlin циклы) - у тебя есть карточка k5, свяжи их в ответе."
  ],
  trap:"\"Запущу Leaks и всё увижу\" - retain cycle делает объект достижимым, Leaks может молчать; growth в Allocations и Memory Graph - обязательная пара." },

  details:[
    "Ключ к задаче: тип выражения (value ?? default) для Int?? - это Int?, поэтому второй ?? легален.",
    "Int?? = .some(nil) и Int?? = nil - разные значения: коробка с пустотой против отсутствия коробки.",
    "Вложенные опционалы рождаются в жизни из map над Optional и словарей опционалов: dict[key] у [K: V?] даёт V??."

  trap:"Ответить \"оба print дадут одно и то же\" - главный подвох: .some(nil) не схлопывается в nil сам по себе." },

{ id:"l2", topic:"live",
  q:"Что выведется? Мутация строки внутри for-in",
  code:"var a = \"Hello\"\nfor i in a {\n    a = \"World\"\n    print(i)\n}",
  frame:"H e l l o, по букве на строку. String - value type: for-in итерирует по копии, зафиксированной на входе в цикл. Присваивание a = \"World\" заменяет значение переменной, но итератор держит старое.",
  details:[
    "То же верно для массивов и любых value-коллекций: итерация всегда по снапшоту.",
    "Поэтому в Swift нет краша \"collection was mutated while being enumerated\" из мира NSMutableArray - мутировать оригинал в цикле безопасно.",
    "a после цикла - \"World\": пять присваиваний, победило последнее."
  ],
  trap:"Ответ \"W o r l d\" или \"краш\" - оба мимо: не reference semantics и не Obj-C." },

{ id:"l3", topic:"live",
  q:"Что выведется? remove(at: 0) внутри for-in по этому же массиву",
  code:"var a = [1, 2, 3]\nfor _ in a {\n    a.remove(at: 0)\n    print(a)\n}",
  frame:"[2, 3], [3], []. Итерация идёт по снапшоту из трёх элементов - тело выполнится ровно три раза, а mutable a худеет: CoW отвязывает оригинал от итерируемой копии при первой мутации.",
  details:[
    "Краша нет по той же причине, что в задаче со строкой: итератор владеет своей копией.",
    "Четвёртой итерации не будет, хотя a уже пуст после третьей - счётчик задан снапшотом.",
    "Если бы удаляли по индексам из исходного массива вручную - словили бы index out of range; со снапшотом безопасно."
  ],
  trap:"Интервьюер ждёт, что скажешь слово снапшот/копия и свяжешь с CoW - просто угаданный вывод без объяснения даёт полбалла." },

{ id:"l4", topic:"live",

{ id:"l12", topic:"live",

  frame:"Гарантии: B раньше C (sync блокирует вызывающего), E раньше F, C раньше D и E (они позже поставлены). Не гарантировано: A относительно B - очередь конкурентная, оба могут идти параллельно. D спит секунду, а E на конкурентной очереди его не ждёт: почти наверняка E и F напечатаются раньше D. Типичный вывод: A B C E F D (или B A C E F D).",
  details:[
    "Метод разбора вслух: для каждой строки два вопроса - когда задача попала в очередь и блокирует ли она вызывающего.",
    "Замени очередь на serial - порядок станет полностью детерминированным: A B C D E F, и sync-вызовы будут ждать все предыдущие задачи.",
    "Вложенный q.sync внутри задачи на той же serial-очереди - deadlock (отдельная карточка); на конкурентной - легально.",

  details:[
    "Алгоритм поиска на ревью: ищи замыкания, которые СОХРАНЯЮТСЯ (свойство, подписка, таймер) и внутри трогают self - замыкание, которое вызвали и забыли (UIView.animate), цикла не делает.",

    "Вариации той же задачи: Timer.scheduledTimer с target: self (RunLoop держит таймер - нужен invalidate или timer с [weak self]-блоком), NotificationCenter-блок с self, Combine-подписка в Set без weak.",
    "Проверь фикс словами: \"теперь замыкание держит self слабо, VC умрёт, deinit вызовется, downloader освободится\" - интервьюер ждёт цепочку освобождения."

{ id:"l14", topic:"live",
  q:"Что выведется? Requirement vs extension-only метод: двухходовка",
  code:"protocol Playable {\n    func play()\n}\nextension Playable {\n    func play() { print(\"play in protocol\") }\n    func stop() { print(\"stop in protocol\") }\n}\nstruct Player: Playable {\n    func play() { print(\"play in struct\") }\n}\nextension Player {\n    func stop() { print(\"stop in struct\") }\n}\n\nlet player = Player()\nplayer.play()\nplayer.stop()\n// Шаг 2: как вызвать версии из Playable,\n// меняя только последние три строки?",
  frame:"Шаг 1: play in struct, stop in struct - тип переменной Player, берутся его методы. Шаг 2 - соль задачи: let player: Playable = Player(). Тогда play() ОСТАНЕТСЯ \"play in struct\" - он requirement протокола, диспетчеризация через witness table находит реализацию структуры. А stop() станет \"stop in protocol\" - он не объявлен в протоколе, extension-only метод статически привязан к типу Playable.",
  details:[
    "Это уточнённая версия классической задачи: здесь один метод - requirement, второй - нет, и они ведут себя противоположно.",
    "Правило одной фразой: попал в протокол - динамика по реализации, остался только в extension - статика по типу переменной.",
    "Синоним в терминах Swift: customization point. Дефолтная реализация requirement-а в extension - легально и переопределяемо; extension-only метод - непереопределяем через протокольный тип.",
    "Follow-up \"как заставить stop() тоже диспетчеризоваться\" - добавить его в объявление протокола. Правило гигиены: даёшь дефолтную реализацию - объяви требование в протоколе; тогда и API не ломается, и попадаешь в witness table.",
    "Диагностический признак бага в жизни: работает при прямом вызове, не работает через протокольную переменную - сразу проверяй, объявлен ли метод в самом протоколе. Такое встречается в библиотеках как рудимент обратной совместимости."
  ],
  trap:"Ответить \"через as! Playable оба метода станут протокольными\" - play() не станет: witness table всё равно ведёт в Player." },

{ id:"l15", topic:"live",
  q:"Банкомат: что выведется и где гонка?",
  code:"var balance = 1200\nstruct ATM {\n    let tag: String\n    func withdraw(value: Int) {\n        if balance > value {\n            Thread.sleep(forTimeInterval: .random(in: 0...2))\n            balance -= value\n            print(\"\\(tag): withdrew \\(value), balance \\(balance)\")\n        } else {\n            print(\"\\(tag): insufficient\")\n        }\n    }\n}\nlet queue = DispatchQueue(label: \"WithdrawalQueue\")\nqueue.async { ATM(tag: \"first\").withdraw(value: 1000) }\nqueue.async { ATM(tag: \"second\").withdraw(value: 800) }",

  details:[
    "Инструменты: NSLock вокруг всей операции, serial queue (как в исходнике - и это ответ \"почему тут всё ок\"), barrier на конкурентной, семафор; Swift Atomics починит data race, но не эту логику.",
    "Идеальная иллюстрация к паре data race vs race condition - тут можно убрать data race и оставить гонку логики.",
    "Бонус из того же файла: concurrentPerform с array.append(i) - уже настоящий data race с реаллокацией буфера: не потерянные элементы, а краши EXC_BAD_ACCESS.",
    "Проговори время жизни: sleep внутри критической секции - в проде так нельзя, лок держат коротко."
  ],
  trap:"Сказать \"поставлю atomic на balance и готово\" - главный неправильный ответ: атомарность одного доступа не делает атомарной последовательность проверка-снятие." },

// ---------- engine ----------
// must-have фундамент: "1 балл - не знать стыдно" по шкале скрининга
const BASE_IDS = new Set([
  "s1","s2","s3","s5","s10","s12","s14","s15","s16","s17","s18","s19","s20","s22","s23","s24","s25",
  "c1","c2","c3","c13",
  "u0","u1","u2","u3","u4","u5","u8",
  "n1","n4","db1",
  "a1","a3","a4",
  "l2","l3","l4","l7","l8","l18",
  "al2",
]);
const LS_KEY = "ios-quiz-marks-v1";
function loadMarks() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } }
function saveMarks(m) { try { localStorage.setItem(LS_KEY, JSON.stringify(m)); } catch (e) {} }

let searchQ = "";
let marks = loadMarks();
let filterTopic = "all";
let weakOnly = false;
let baseOnly = false;
let order = CARDS.map(c => c.id);
let idx = 0;
let revealed = false;

function pool() {
  let list = order.map(id => CARDS.find(c => c.id === id));
  if (filterTopic !== "all") list = list.filter(c => c.topic === filterTopic);
  if (weakOnly) list = list.filter(c => marks[c.id] === "shaky" || marks[c.id] === "miss");
  if (baseOnly) list = list.filter(c => BASE_IDS.has(c.id));
  if (searchQ) list = list.filter(c =>
    (c.q + " " + c.frame + " " + (c.details || []).join(" ") + " " + (c.trap || "") + " " + (c.code || ""))
      .toLowerCase().includes(searchQ));
  return list;
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function fmtFrame(s) {
  const lines = s.split("\n");
  let h = "", listOpen = false;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^\d+\.\s+(.*)$/);
    if (m) {
      if (!listOpen) { h += "<ol>"; listOpen = true; }
      h += "<li>" + esc(m[1]) + "</li>";
    } else {
      if (listOpen) { h += "</ol>"; listOpen = false; }
      h += "<p>" + esc(line) + "</p>";
    }
  }
  if (listOpen) h += "</ol>";
  return h;
}

function render() {
  const list = pool();
  const host = document.getElementById("cardHost");
  const total = CARDS.length;
  const rated = Object.keys(marks).filter(id => CARDS.some(c => c.id === id)).length;
  document.getElementById("progressNote").textContent = rated + "/" + total + " пройдено";
  document.getElementById("barFill").style.width = (total ? (rated / total * 100) : 0) + "%";

  const g = Object.values(marks).filter(v => v === "know").length;
  const w = Object.values(marks).filter(v => v === "shaky").length;
  const b = Object.values(marks).filter(v => v === "miss").length;
  document.getElementById("stats").innerHTML =
    '<span><i class="dot g"></i>' + g + '</span><span><i class="dot w"></i>' + w + '</span><span><i class="dot b"></i>' + b + '</span>';

  renderChips();

  if (!list.length) {
    host.innerHTML = '<div class="card"><div class="empty">' +
      (searchQ ? "Ничего не нашлось по запросу." : weakOnly ? "Слабых вопросов в этой выборке нет. Либо ты хорош, либо ещё не оценивал." : "Нет вопросов в выборке.") +
      "</div></div>";
    document.getElementById("posNote").textContent = "";
    document.getElementById("prevBtn").disabled = true;
    document.getElementById("nextBtn").disabled = true;
    return;
  }
  if (idx >= list.length) idx = list.length - 1;
  const c = list[idx];
  const topicName = TOPICS.find(t => t.id === c.topic).name;
  const mark = marks[c.id];

  let h = '<div class="card">';
  h += '<div class="card-top"><span class="topic-tag">' + topicName +
    (BASE_IDS.has(c.id) ? ' <span class="base-dot" title="база">&#9679;</span>' : "") + '</span>';
  h += '<span class="mark ' + (mark || "") + '">' + (mark === "know" ? "знал" : mark === "shaky" ? "плавал" : mark === "miss" ? "не знал" : "") + "</span></div>";
  h += '<div class="q">' + esc(c.q) + "</div>";
  if (c.viz && revealed) h += '<div class="viz">' + c.viz + "</div>";
  if (c.code && revealed) h += "<pre><code>" + esc(c.code) + "</code></pre>";
  if (!revealed) {
    h += '<div class="hint">Ответь вслух, как интервьюеру. Потом сверься.</div>';
    h += '<button class="reveal-btn" onclick="reveal()">Показать ответ</button>';
  } else {
    h += '<div class="answer open">';
    h += '<div class="ans-section"><div class="ans-label">Каркас на 30 секунд</div><div class="ans-frame">' + fmtFrame(c.frame) + "</div></div>";
    if (c.details && c.details.length) {
      h += '<div class="ans-section"><div class="ans-label">Сеньорские детали</div><ul class="ans-list">' +
        c.details.map(d => "<li>" + esc(d) + "</li>").join("") + "</ul></div>";
    }
    if (c.trap) h += '<div class="ans-section"><div class="ans-label">Ловушка</div><div class="trap">' + esc(c.trap) + "</div></div>";
    h += '<div class="rate">' +
      '<button class="r-know' + (mark === "know" ? " sel" : "") + '" onclick="rate(\'know\')">Знал<span class="key">1</span></button>' +
      '<button class="r-shaky' + (mark === "shaky" ? " sel" : "") + '" onclick="rate(\'shaky\')">Плавал<span class="key">2</span></button>' +
      '<button class="r-miss' + (mark === "miss" ? " sel" : "") + '" onclick="rate(\'miss\')">Не знал<span class="key">3</span></button>' +
      "</div>";
    h += "</div>";
  }
  h += "</div>";
  host.innerHTML = h;

  document.getElementById("posNote").textContent = (idx + 1) + " / " + list.length;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === list.length - 1;
}

function renderChips() {
  const el = document.getElementById("chips");
  let h = "";
  const allN = CARDS.length;
  h += '<button class="chip' + (filterTopic === "all" && !weakOnly ? " on" : "") + '" onclick="setTopic(\'all\')">Все<span class="n">' + allN + "</span></button>";
  for (const t of TOPICS) {
    const n = CARDS.filter(c => c.topic === t.id).length;
    h += '<button class="chip' + (filterTopic === t.id && !weakOnly ? " on" : "") + '" onclick="setTopic(\'' + t.id + '\')">' + t.name + '<span class="n">' + n + "</span></button>";
  }
  const baseDone = [...BASE_IDS].filter(id => marks[id]).length;
  h += '<button class="chip base' + (baseOnly ? " on" : "") + '" onclick="toggleBase()">База<span class="n">' + baseDone + "/" + BASE_IDS.size + "</span></button>";
  const weakN = CARDS.filter(c => marks[c.id] === "shaky" || marks[c.id] === "miss").length;
  h += '<button class="chip weak' + (weakOnly ? " on" : "") + '" onclick="toggleWeak()">Слабые<span class="n">' + weakN + "</span></button>";
  el.innerHTML = h;
}

function setTopic(t) { filterTopic = t; weakOnly = false; idx = 0; revealed = false; render(); }
function toggleWeak() { weakOnly = !weakOnly; if (weakOnly) filterTopic = "all"; idx = 0; revealed = false; render(); }
function toggleBase() { baseOnly = !baseOnly; idx = 0; revealed = false; render(); }
function reveal() { revealed = true; render(); }
function rate(v) {
  const list = pool(); if (!list.length) return;
  marks[list[idx].id] = v; saveMarks(marks);
  if (idx < list.length - 1) { idx++; revealed = false; }
  render();
}
function nav(d) {
  const list = pool();
  const ni = idx + d;
  if (ni < 0 || ni >= list.length) return;
  idx = ni; revealed = false; render();
}
document.getElementById("searchBox").oninput = (e) => {
  searchQ = e.target.value.trim().toLowerCase();
  idx = 0; revealed = false; render();
};
document.getElementById("prevBtn").onclick = () => nav(-1);
document.getElementById("nextBtn").onclick = () => nav(1);
document.getElementById("shuffleBtn").onclick = () => {
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  idx = 0; revealed = false; render();
};
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("Стереть все оценки?")) return;
  marks = {}; saveMarks(marks); idx = 0; revealed = false; render();
};
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === " " || e.key === "Enter") { if (!revealed) { e.preventDefault(); reveal(); } }
  else if (e.key === "ArrowRight") nav(1);
  else if (e.key === "ArrowLeft") nav(-1);
  else if (revealed && (e.key === "1" || e.key === "2" || e.key === "3")) rate(e.key === "1" ? "know" : e.key === "2" ? "shaky" : "miss");
});
render();
</script>
