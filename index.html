<title>Тренажёр iOS-интервью</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

      --accent-soft: #3A2A21;

    --good: #6BBE8E;
    --good-soft: #24352B;
    --warn: #D5AE52;
    --warn-soft: #383019;
    --bad: #DE7A5C;
    --bad-soft: #3B2822;

    background: var(--ground);

  .progress-note { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }

  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .25s ease; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }

    font-family: "Golos Text", sans-serif;
    font-size: 13.5px; font-weight: 500;
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; opacity: .75; margin-left: 4px; }

  .chip.base.on { background: var(--good); border-color: var(--good); color: #fff; }

  .search {
    width: 100%;
    padding: 10px 14px;
    margin-bottom: 14px;
    border-radius: 10px;

  .search:focus { outline: none; border-color: var(--accent); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 22px 22px 18px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .topic-tag {
    font-family: "IBM Plex Mono", monospace;

    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--accent);
    background: var(--accent-soft);

  .mark { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; padding: 4px 9px; border-radius: 6px; display: none; }
  .mark.know { display: inline; color: var(--good); background: var(--good-soft); }
  .mark.shaky { display: inline; color: var(--warn); background: var(--warn-soft); }
  .mark.miss { display: inline; color: var(--bad); background: var(--bad-soft); }

  .q { font-size: 19.5px; font-weight: 600; line-height: 1.4; text-wrap: balance; margin-bottom: 6px; }

  .reveal-btn {

    padding: 13px;
    border-radius: 10px;
    border: 1px dashed var(--line);
    background: none;
    color: var(--accent);
    font-family: "Golos Text", sans-serif;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .reveal-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

  .answer { display: none; }
  .answer.open { display: block; }
  .ans-section { margin-top: 14px; }
  .ans-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    text-transform: uppercase;

    color: var(--muted);
    margin-bottom: 6px;

  .ans-frame { font-size: 15.5px; }
  .ans-frame p { margin-bottom: 7px; }
  .ans-frame p:last-child { margin-bottom: 0; }
  .ans-frame ol { margin: 2px 0 8px 22px; }
  .ans-frame ol li { margin-bottom: 5px; padding-left: 2px; }
  .ans-list { list-style: none; }
  .ans-list li { position: relative; padding-left: 18px; margin-bottom: 7px; font-size: 14.5px; }
  .ans-list li::before { content: ""; position: absolute; left: 2px; top: .55em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); opacity: .55; }
  .trap { border-left: 3px solid var(--bad); background: var(--bad-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; margin-top: 8px; font-size: 14.5px; }

  .rate { display: flex; gap: 8px; margin-top: 18px; }
  .rate button {
    flex: 1;
    padding: 12px 6px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-family: "Golos Text", sans-serif;
    font-size: 14px; font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .rate .r-know:hover, .rate .r-know.sel { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .rate .r-shaky:hover, .rate .r-shaky.sel { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .rate .r-miss:hover, .rate .r-miss.sel { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .rate .key { font-family: "IBM Plex Mono", monospace; font-size: 11px; opacity: .55; display: block; margin-top: 2px; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; }
  .nav button {

  .nav button:hover { border-color: var(--accent); }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav button:disabled:hover { border-color: var(--line); }
  .pos { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; flex-wrap: wrap; }
  .toolbar .small {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Golos Text", sans-serif;

  }
  .toolbar .small:hover { color: var(--accent); }
  .kbd-note { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted); }
  @media (max-width: 600px) { .kbd-note { display: none; } }

  .empty {
    text-align: center;

  .stats { display: flex; gap: 14px; margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .stats span { display: inline-flex; align-items: center; gap: 5px; }

  .dot.g { background: var(--good); } .dot.w { background: var(--warn); } .dot.b { background: var(--bad); }

  button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

<script>
const TOPICS = [
  { id: "swift", name: "Swift" },
  { id: "conc", name: "Многопоточность" },
  { id: "arch", name: "Архитектура" },
  { id: "ui", name: "UIKit / SwiftUI" },
  { id: "net", name: "Networking" },
  { id: "db", name: "Базы данных" },
  { id: "test", name: "Тестирование" },
  { id: "algo", name: "Алгоритмы" },
  { id: "prof", name: "Profiling" },
  { id: "live", name: "Live coding" },
  { id: "kmp", name: "KMP" },
];

const CARDS = [
// ---------- SWIFT ----------
{ id:"s1", topic:"swift",
  q:"struct vs class - главное отличие и когда осознанно выбрать класс?",
  frame:"Ответ в четыре фразы.\n1. Разные семантики: структура при присваивании копируется, класс передаётся по ссылке - все владельцы видят один объект.\n2. Класс беру, когда нужна identity, наследование, общее изменяемое состояние на нескольких владельцев или deinit для освобождения внешнего ресурса.\n3. За этим стоит диспетчеризация: класс платит динамикой (таблица методов) за возможность наследования.\n4. Структура получает статическую диспетчеризацию - отсюда её скорость.\nПравило одной фразой: данные - структура, поведение и общее состояние - класс.",
  details:[
    "Примеры к каждому поводу за класс: identity - координатор в массиве childCoordinators, удалить именно ЕГО можно только через ===, копию структуры не отличишь; общее изменяемое состояние - сервис авторизации с токеном: разлогинился в одном месте, все видят сразу; deinit - отписка от нотификаций и KVO, внешний ресурс, о котором ARC не знает.",
    "Структуры в проекте: DTO, модели, ViewState, конфиги - просто данные, снимок; идентичность им не нужна, два DTO с одинаковыми полями и есть одно и то же.",
    "let у структуры замораживает её целиком, let у класса - только ссылку, поля мутабельны.",
    "Наследование структуре невозможно в принципе, не по прихоти: оно противоречит копированию - наследник больше по размеру, а value-тип копируется по фиксированному размеру. Полиморфизм структурам даётся иначе - протоколами.",
    "Про стек и кучу сам НЕ начинай - это деталь реализации, и лучший ответ на прямой вопрос \"где лежат\" ровно такой: размещение - деталь реализации, структура в поле класса или в escaping-замыкании окажется в куче.",
    "Дефолт по Apple guidelines - структура; и это не \"перешли с ООП на POP\", а сместили дефолт: классы и UIKit никуда не делись."
  ],
  trap:"Сказать \"структуры неизменяемые\" - ошибка: иммутабельность даёт let, а не тип. И не начинай ответ со стека и кучи - это второй по популярности повод для дожима." },

{ id:"s2", topic:"swift",
  q:"Array - структура. Почему передача массива на миллион элементов - O(1), и что произойдёт при append внутри функции?",
  code:"// Кастомный CoW: структура-обёртка + класс-буфер\nfinal class Buffer {\n    var items: [Int]\n    init(_ items: [Int]) { self.items = items }\n}\n\nstruct CoWArray {\n    private var buffer: Buffer\n    init(_ items: [Int] = []) { buffer = Buffer(items) }\n\n    var count: Int { buffer.items.count }   // чтение: без проверок и копий\n\n    mutating func append(_ x: Int) {\n        makeUniqueIfNeeded()\n        buffer.items.append(x)\n    }\n\n    private mutating func makeUniqueIfNeeded() {\n        // &buffer - inout: смотрим на саму переменную,\n        // без временного retain (иначе счётчик всегда >= 2)\n        if !isKnownUniquelyReferenced(&buffer) {\n            buffer = Buffer(buffer.items)   // O(n) - только когда буфер общий\n        }\n    }\n}\n\nvar a = CoWArray([1, 2, 3])\nvar b = a       // O(1): скопировалась только ссылка на буфер\nb.append(4)     // буфер общий -> сначала копия, потом запись\nb.append(5)     // буфер уже свой -> мутация на месте, копии нет",
  frame:"Ответ в правильном порядке.\n1. Array - структура, внутри неё ссылка на буфер, а буфер - класс в куче; присваивание копирует только ссылку - O(1) на любом размере.\n2. Value-семантику надо соблюсти, поэтому при первой мутации срабатывает copy-on-write: isKnownUniquelyReferenced - владелец один, пишем на месте; буфер общий - сначала полная копия O(n), потом запись.\n3. Копия не \"позже\", а только если буфер реально в совместном использовании (shared) - единственный владелец не заплатит никогда.\nВажно не путать: O(1) даёт устройство типа, а CoW отвечает за сохранение value-семантики.",
  details:[
    "Коронная фраза: CoW - это value-семантика, оплаченная в кредит. Контракт \"моя копия только моя\" соблюдён, расплата отложена до момента, когда кто-то реально пишет.",
    "На второй ход, когда копнут: CoW - не фича языка, а ручная оптимизация стандартной библиотеки, написана для Array, Dictionary, Set, String, Data. Своя структура копируется по полям; хочешь CoW - пишешь сам: class-буфер + проверка уникальности перед мутацией.",
    "isKnownUniquelyReferenced принимает inout - смотрит на саму переменную без временного retain, иначе счётчик был бы всегда >= 2; под капотом это swift_isUniquelyReferenced из рантайма: читает refcount из заголовка объекта. Для Obj-C классов всегда false - CoW вырождается в copy-always.",
    "Доказательство руками: печатаешь адрес буфера через withUnsafeBufferPointer до и после присваивания - один; после мутации копии - разъехались. Отличный ответ на \"а ты уверен?\"."
  ],
  trap:"Сказать \"O(1) благодаря CoW\" - перевёрнутая причинность, её ловят follow-up-ом. И CoW не даёт потокобезопасности: два потока с общим буфером - гонка, несмотря на value-семантику снаружи." },

{ id:"s3", topic:"swift",
  q:"ARC: как работает, откуда берётся retain cycle, и когда weak, а когда unowned?",
  frame:"ARC - automatic reference counting, автоматический подсчёт ссылок.\n1. Компилятор на этапе сборки расставляет в код вызовы retain/release - не рантайм и не сборщик мусора. Считаются только сильные ссылки; счётчик стал нулём - вызывается deinit, немедленно и детерминированно.\n2. Retain cycle - цикл сильных ссылок: объекты держат друг друга, счётчики не дойдут до нуля, память утекла. Три классических места: родитель и ребёнок держат друг друга, делегат объявлен strong, замыкание захватывает self.\n3. Разрыв цикла - невладеющие ссылки, обе не увеличивают счётчик. weak идёт через side table - может вернуть nil - обязан быть Optional - безопасен. unowned - обращение напрямую по адресу - возвращать nil ему нечем - не Optional - крашит на мёртвом объекте.\n4. Правило выбора: по умолчанию weak; unowned - только когда время жизни объекта доказуемо дольше ссылки. Делегаты - weak: ребёнок не должен держать родителя.\nФормула фикса в замыкании: в списке захвата пишу [weak self], потом guard let self else return.",
  details:[
    "Не всякое замыкание опасно, различай два вида. Escaping - замыкание, которое сохраняется и живёт дольше вызова функции: положили в свойство, передали в подписку или в асинхронную очередь. Пока оно живо, оно держит self - вот здесь циклы и возникают. Non-escaping (дефолт в Swift) - замыкание выполняется до возврата функции и умирает вместе с ней: map, filter, forEach захватывают self на мгновение, цикл физически не успевает образоваться. Отличить просто: где компилятор требует писать self явно, там escaping.",
    "Side table - вспомогательная таблица сбоку от объекта. Создаётся лениво - в момент первого присваивания слабой ссылки, включая [weak self] в списке захвата (capture list) при создании замыкания; нет weak - нет таблицы. Переживает объект, чтобы было кому ответить \"он умер\" - адресный стол, который переживает жильца. У VC таблица обычно уже есть - UIKit сам держит weak-ссылки.",
    "А strong и unowned считаются БЕЗ таблицы: в заголовке объекта рядом с isa лежат 64 бита счётчиков - инлайн strong count, unowned count и флаги; retain/release - атомарная операция над этим полем. При первой weak-ссылке счётчики переезжают в side table, а в заголовке остаётся указатель на неё.",
    "Цена weak при каждом чтении - три действия: заход в таблицу, проверка флага жизни, retain объекта на время выражения (чтобы не умер в руках посреди работы - то же самое ты делаешь явно через guard let self). Unowned - одно прямое обращение по адресу, без проверок. Но unowned не бесплатен по памяти: память объекта не переиспользуется, пока живы unowned-ссылки - поэтому обращение даёт осмысленный trap, а не порчу чужих данных. unowned(unsafe) - вот это уже голый указатель и undefined behavior.",
    "unowned оправдан, когда замыкание гарантированно не переживает объект: cancellables лежат в self, подписка рвётся в deinit. Но с асинхронными publisher-ами есть гонка доставки - дефолт [weak self].",
    "Детерминированность - ключевое отличие от сборщика мусора (garbage collection, GC) в Java/Kotlin: освобождение в предсказуемой точке, без пауз. Слабость обратная: ARC не собирает циклы, разруливаешь weak/unowned вручную. Важно: в GC-мире цикл ссылок - НЕ утечка (сборщик идёт от корней и забирает недостижимый остров целиком); зато там свои утечки - объект, оставшийся достижимым от живого корня: неотменённая корутина, неотписанный слушатель, ссылка в статике.",
    "Говори \"цикл сильных ссылок\", не \"циклическая зависимость\" - последняя про модули и импорты. И произноси правильно: ан-оунд, невладеющая - не \"unknown\".",
    "Оптимизатор удаляет парные retain/release - время жизни в -O может быть короче, чем кажется (withExtendedLifetime для гарантии)."
  ],
  trap:"\"Деаллокация происходит когда-нибудь потом\" - неверно: deinit детерминирован, и само слово deinit обязано прозвучать. \"unowned - это без проверки\" - тоже неточно: safe unowned трапается осмысленно, без проверок только unowned(unsafe)." },

{ id:"s5", topic:"swift",
  q:"Optional под капотом. Что делает \"??\" и почему работает \"if let\"?",
  frame:"enum Optional<Wrapped> с кейсами .none и .some(Wrapped). T?, nil, if let - синтаксический сахар: nil это .none, binding - паттерн-матчинг по .some. Вся оптиональность - обычный generic из stdlib плюс сахар компилятора.",
  details:[
    "Объединяющая мысль, которая делает ответ сеньорским: все способы распаковки - это разные виды pattern matching (сопоставления с образцом) над кейсом some. if let - сахар для switch по .some с привязкой значения; force unwrap - тот же switch, где ветка none заменена на fatalError; chaining пробрасывает none дальше.",
    "?? - nil-coalescing, правый операнд @autoclosure: дефолт вычисляется лениво, только если слева nil.",
    "Спектр разворачивания: if let / guard let, ?., ??, !, плюс map/flatMap прямо на Optional (map применяет функцию внутри some, flatMap - когда функция сама возвращает Optional, без двойной обёртки).",
    "В stdlib это буквально @frozen enum на одиннадцать строк - всё остальное расширения и сахар компилятора. Не путай associated value (данные кейса some) и associated type (заглушка типа в протоколе).",
    "Optional<AnyObject> не стоит ни байта - .none кодируется нулевым указателем (extra inhabitants); Int? занимает 9 байт: 8 значение + 1 тег.",
    "T! (IUO) - тот же Optional с автоматическим force unwrap в местах, где нужен T."
  ],
  trap:"\"?? разворачивает опционал\" - неточно: возвращает значение или дефолт. И помни про ленивость правой части - дорогой вызов справа не выполнится зря." },

{ id:"s6", topic:"swift",
  q:"@autoclosure - что делает и где используется в stdlib?",
  frame:"Атрибут параметра: компилятор автоматически оборачивает переданное выражение в замыкание () -> T. Вызывающий пишет голое выражение, вычислится оно только когда функция вызовет замыкание внутри. Чисто про эргономику call-site: поведение как у обычного параметра-замыкания, но без фигурных скобок при вызове.",
  details:[
    "Так устроены &&, ||, ??, assert, precondition: короткое замыкание булевых операторов - буквально autoclosure правого операнда.",
    "Отличный ответ на \"реализуйте оператор && сами\": func &&(lhs: Bool, rhs: @autoclosure () -> Bool) -> Bool.",
    "По умолчанию non-escaping; сохранить на потом - @autoclosure @escaping.",
    "Apple советует не увлекаться: call-site прячет отложенность вычисления от читателя."
  ],
  trap:"Внутри функции разницы с обычным () -> T нет вообще - вся разница на стороне вызова." },

{ id:"s7", topic:"swift",
  q:"any Protocol vs some Protocol - в чём разница и что дороже?",
  frame:"1. some (opaque type) - конкретный тип, известный компилятору на компиляции, скрыто только имя: статическая диспетчеризация, ноль накладных.\n2. any (existential) - тип неизвестен до рантайма, значение живёт в existential container, вызовы косвенные.\nМнемоника: some - конкретный тип в маске, any - коробка с сюрпризом.",
  details:[
    "Container - 5 машинных слов: 3 inline-буфер (большое значение уезжает в кучу), метаданные типа, protocol witness table.",
    "Цена any: возможная heap-аллокация, косвенные вызовы без инлайна, нет специализации. Цена some: ноль.",
    "any сделали обязательным словом (SE-0335, Swift 5.6), чтобы стоимость коробки была видна в коде и контрастировала с some.",
    "Правило: дефолт - дженерик или some; any - когда нужна гетерогенность (массив разных реализаций) или тип реально неизвестен до рантайма."
  ],
  trap:"\"some откладывает узнавание типа на потом\" - ровно наоборот: откладывает any, а some фиксирует тип на компиляции. Классическая путаница." },

{ id:"s8", topic:"swift",
  q:"Зачем нужны были AnyPublisher / AnySequence и почему нужда в них упала?",
  frame:"Type erasure: раньше протокол с associatedtype нельзя было использовать как тип (\"protocol can only be used as a generic constraint\") - заворачивали в ручные боксы AnyPublisher, AnySequence, AnyView. Swift 5.7 принёс primary associated types (some Publisher<Int, Never>) и implicit opening экзистенциалов - большинство самописных боксов стало не нужно.",
  details:[
    "AnyPublisher остаётся полезен как стабильная граница API: скрыть цепочку операторов из сигнатуры.",
    "eraseToAnyPublisher - это тот же бокс-паттерн, что мы писали руками.",
    "Упомянуть на интервью 5.7 - показать, что следишь за языком."
  ],
  trap:"Не путать type erasure (бокс) и opaque types (some) - они решают смежную проблему с разных сторон: бокс прячет тип в рантайме, some - в сигнатуре при компиляции." },

{ id:"s9", topic:"swift",
  q:"Четыре вида диспетчеризации методов в Swift. Что когда используется?",
  frame:"Четыре вида.\n1. Static/direct - структуры, enum, final-методы, extension-методы, глобальные функции: адрес известен, возможен инлайн.\n2. Vtable - обычные методы классов: таблица методов, индекс известен на компиляции.\n3. Witness table - требования протокола через generic или existential.\n4. Message (objc_msgSend) - @objc dynamic и вызовы из Obj-C рантайма; нужен для KVO и swizzling.",
  details:[
    "final и private дают компилятору девиртуализировать; Whole Module Optimization помогает.",
    "msgSend кэширует IMP - повторные вызовы быстрые, но инлайн и оптимизации потеряны навсегда.",
    "Протоколы - НЕ статика: вызов требования протокола идёт через witness table.",
    "KVO работает через isa-swizzling - поэтому свойство должно быть @objc dynamic."
  ],
  trap:"Метод в extension протокола, не объявленный в самом протоколе, диспетчеризуется статически по типу переменной: let p: Proto = Impl(); p.foo() вызовет extension-версию, даже если Impl определил свою. Самый частый вопрос с подвохом." },

{ id:"s10", topic:"swift",
  q:"escaping vs non-escaping замыкания. Почему escaping требует явного self?",
  code:"func fetch(completion: @escaping (Data) -> Void) {\n    queue.async { completion(data) }   // переживает вызов fetch\n}",
  frame:"1. Non-escaping (дефолт) - замыкание гарантированно выполнится до возврата функции: компилятор может держать контекст на стеке и не требует self.\n2. Escaping - переживает вызов функции (сохранено, передано в async): контекст уезжает в кучу, и захват self надо написать явно - это точка, где рождаются retain cycles.",
  details:[
    "Явный self в escaping - осознанное решение дизайна языка: место потенциального цикла видно в коде. Это и главный критерий на глаз: компилятор требует self. - замыкание сохранят, думай про weak; не требует - non-escaping, расслабься.",
    "Escaping от потока не зависит - интуиция \"это же UI/main\" подводит: completion у UIView.animate - escaping (переживает вызов, ждёт конца анимации), хотя всё на главном потоке. Критерий один: замыкание сохранили или нет.",
    "История для стажа: до Swift 3 дефолт был обратный - escaping по умолчанию, а non-escaping помечали @noescape; дефолт перевернули ради безопасности.",
    "withoutActuallyEscaping - мост, когда API требует escaping, а ты знаешь, что замыкание не сбежит.",
    "Closure - reference type: два присваивания одной переменной замыкания разделяют захваченное состояние."
  ],
  trap:"Захват в capture list копирует значение в момент создания замыкания, а захват без списка - ссылку на переменную: [x] и просто x внутри тела ведут себя по-разному при последующей мутации x." },

{ id:"s11", topic:"swift",
  q:"Generics против any: что такое специализация и почему дженерик быстрее?",
  frame:"Generic-функция компилируется в универсальную версию, работающую через witness table, но оптимизатор делает специализацию: генерирует отдельную версию под конкретный тип со статическими вызовами и инлайном. any всегда живёт в коробке - специализировать нечего, тип неизвестен.",
  details:[
    "func f<T: Proto>(_ t: T) и func f(_ t: any Proto) - семантически близки, по цене различаются радикально.",
    "Специализация работает внутри модуля или с @inlinable и Whole Module Optimization.",
    "Generic-ограничения (where) проверяются на компиляции - ошибки раньше, код безопаснее.",
    "С Swift 5.7 сигнатуру func f(_ t: some Proto) можно читать как сахар для дженерика с одним параметром."
  ],
  trap:"\"Дженерики медленные из-за витнес-таблиц\" - устаревшая полуправда: после специализации это статические вызовы. Медленной остаётся именно нес специализированная/экзистенциальная форма." },

{ id:"s12", topic:"swift",
  q:"lazy var: как работает, какие подводные камни?",
  code:"final class ImageProcessor {\n    // lazy var: НЕ потокобезопасна\n    lazy var filter: Filter = {\n        print(\"создаю фильтр\")   // при гонке напечатается дважды\n        return Filter()\n    }()\n\n    // static let: потокобезопасен, инициализация строго один раз\n    static let shared = ImageProcessor()\n}\n\nlet p = ImageProcessor()\nDispatchQueue.concurrentPerform(iterations: 2) { _ in\n    _ = p.filter   // оба потока обращаются впервые, одновременно\n}\n// Возможный вывод:\n// создаю фильтр\n// создаю фильтр   <- инициализатор выполнился ДВАЖДЫ\n\n// Захват self: всё решает пара скобок\nfinal class ProfileVC {\n    var username = \"george\"\n\n    lazy var greeting: String = {\n        \"Привет, \\(self.username)\"\n    }()   // () - хранится РЕЗУЛЬТАТ: замыкание отработало\n          // и умерло, self держало мгновение, цикла нет\n\n    lazy var makeGreeting: () -> String = { [unowned self] in\n        \"Привет, \\(self.username)\"\n    }     // без () - хранится САМО замыкание: без capture list\n          // был бы цикл (VC держит замыкание, оно - VC);\n          // unowned оправдан: замыкание живёт внутри self\n}",
  frame:"Вычисляется при первом обращении, результат кэшируется. Требует var (мутирует хранилище) и недоступна в let-структурах через let-байндинг. Главные грабли: НЕ потокобезопасна - два потока при первом одновременном доступе могут вычислить инициализатор дважды.",
  details:[
    "Захват self в lazy: со скобками () в конце свойство хранит РЕЗУЛЬТАТ - замыкание отработало и умерло, self захвачен на мгновение, цикла нет и capture list не нужен (self легален: объект к первому доступу уже инициализирован). Без скобок свойство хранит САМО замыкание - объект держит его, оно сильно держит self: цикл. Фикс - [unowned self], и он тут оправдан: замыкание живёт внутри self и не переживёт его.",
    "static let - наоборот, потокобезопасен и лениво инициализируется через dispatch_once-механику: рантайм гарантирует ровно одно выполнение, второй поток ждёт. Поэтому синглтон в Swift - одна строка static let shared, без обвязки.",
    "Механика гонки lazy: это хранилище плюс проверка \"пусто? - вычислить и записать\", без лока. Оба потока видят пусто, оба вычисляют: побочные эффекты дважды, один объект молча потерян, а неатомарная запись - формально data race. Сделать lazy безопасной нельзя - только лок/serial queue вокруг доступа, let в init, static let или actor.",
    "Отличие от computed property: lazy хранит результат, computed вычисляет каждый раз."
  ],
  trap:"На вопрос \"lazy потокобезопасна?\" ответ - нет. Потокобезопасен static let. Пара lazy/static let - готовая ловушка." },

{ id:"s13", topic:"swift",
  q:"Property wrappers: что это, как устроены, примеры из фреймворков?",
  frame:"Синтаксический сахар: @Wrapper var x генерирует скрытое хранилище _x типа обёртки, а доступ к x идёт через её wrappedValue. Обёртка инкапсулирует поведение хранения: валидацию, дефолты, потокобезопасность, привязку к стораджу.",
  details:[
    "projectedValue доступен через $x - так SwiftUI отдаёт Binding из @State.",
    "Знакомые примеры: @State, @Published, @AppStorage; самописные: @Atomic, @UserDefault.",
    "@Published за кулисами: willSet шлёт значение в publisher до записи - отсюда классика \"в sink приходит новое значение, а в self ещё старое\"."
  ],
  trap:"@Published шлёт значение ДО записи в свойство (willSet): прочитаешь self.x в sink - получишь старое. Любимый вопрос по Combine." },

{ id:"s14", topic:"swift",
  q:"Почему String.count - O(n) и что такое grapheme cluster?",
  frame:"String - коллекция Character, а Character - extended grapheme cluster: то, что человек видит как один символ, может состоять из нескольких Unicode scalar-ов (эмодзи с модификаторами, флаги, диакритика). Пока не пройдёшь строку, не знаешь, сколько кластеров - отсюда O(n) и отсутствие целочисленных индексов.",
  details:[
    "String.Index вместо Int - индекс привязан к конкретной строке и её представлению.",
    "Внутри - UTF-8 (с Swift 5); utf8/utf16/unicodeScalars - разные view поверх одного буфера.",
    "Сравнение строк - каноническая эквивалентность Unicode, не побайтовая."
  ],
  trap:"\"é\" может быть одним скаляром или e + combining accent - count в обоих случаях 1, а utf8.count разный. Хороший пример на интервью." },

{ id:"s15", topic:"swift",
  q:"Обработка ошибок: throws, rethrows, Result, typed throws - когда что?",
  code:"// throws: ошибка уходит вверх, обработка do/catch\nfunc load() throws -> Data { ... }\ndo { let d = try load() } catch { print(error) }\n\n// rethrows ты видишь каждый день - он в сигнатуре map:\n// func map<T>(_ transform: (Element) throws -> T) rethrows -> [T]\n// map кидает ТОЛЬКО если кинуло твоё замыкание:\n\nlet a = [1, 2, 3].map { $0 * 2 }        // замыкание не кидает - try не нужен\n\nlet b = try [\"1\", \"x\"].map { s in       // замыкание кидает - нужен try\n    guard let n = Int(s) else { throw ParseError() }\n    return n\n}\n\n// Result: ошибка как значение - можно хранить, передавать, комбинировать\nlet result: Result<Data, NetworkError> = .failure(.timeout)\n\n// typed throws (Swift 6): тип ошибки прямо в сигнатуре\nfunc parse() throws(ParseError) -> Model { ... }",
  frame:"1. throws - синхронная передача ошибки вверх, обработка do/catch; это не исключения C++ - по сути скрытый возврат ошибки, дешёвый.\n2. Result<T, E> - ошибка как значение: можно хранить, передавать в completion, комбинировать.\n3. rethrows - функция кидает, только если кинуло переданное ей замыкание (map, forEach).\n4. Typed throws (Swift 6) - throws(MyError) фиксирует тип ошибки в сигнатуре.",
  details:[
    "async/await вернул throws на главную роль: completion(Result) -> async throws.",
    "try? превращает ошибку в nil (теряет её), try! трапается - оба в проде осторожно.",
    "Ошибки-enum с associated values - идиоматичный способ моделировать домен ошибок."
  ],
  trap:"\"throws - это исключения как в Java\" - нет: ни раскрутки стека, ни ловли рантайм-крашей; force unwrap или index out of range никаким catch не поймать." },

{ id:"s20", topic:"swift",
  q:"Как устроены Array и Dictionary под капотом? Сложность вставки в середину и в конец массива?",
  code:"var a = [1, 2, 3]\na.append(4)          // O(1) амортизированный: пишет в запас capacity\na.insert(0, at: 0)   // O(n): весь хвост сдвигается вправо\n_ = a[2]             // O(1): адрес = база + 2 * размер элемента\na.reserveCapacity(1_000)   // выделили заранее - append без переездов\n\nvar dict = [\"a\": 1]\ndict[\"b\"] = 2        // O(1) в среднем: хеш ключа указывает ячейку\n_ = dict[\"a\"]        // O(1): не перебор, а прыжок по хешу\n\nlet set: Set = [1, 2, 3]\nset.contains(2)      // O(1): та же хеш-таблица, только без значений\na.contains(2)        // а у массива - O(n), честный перебор",
  frame:"Array под капотом - один непрерывный кусок памяти, элементы лежат подряд.\n1. Доступ по индексу O(1): адрес элемента считается арифметикой - начало буфера плюс индекс на размер элемента.\n2. Append - амортизированный O(1): память выделяется с запасом (capacity); когда запас кончился, выделяется новый кусок примерно вдвое больше и элементы переезжают. Переезд дорогой, но редкий - в среднем по всем вставкам выходит константа.\n3. Вставка в середину - всегда O(n): всем элементам правее надо сдвинуться.\nDictionary под капотом - хеш-таблица: массив ячеек.\n1. По ключу считается хеш - число, которое указывает на ячейку; чтение и запись в среднем O(1), без обхода.\n2. Два ключа могут дать одну ячейку (коллизия) - тогда значение кладётся в ближайшую свободную.\n3. Когда таблица заполняется, создаётся новая побольше и всё раскладывается заново.",
  details:[
    "Hashable-контракт: равные значения обязаны давать равный хеш; нарушишь - словарь молча теряет элементы.",
    "Порядок элементов Dictionary не гарантирован и меняется от запуска к запуску (хеш считается со случайным зерном) - полагаться на порядок нельзя.",
    "reserveCapacity перед массовым наполнением убирает переезды буфера - и для Array, и для Dictionary.",
    "Set - тот же механизм, что Dictionary, только без значений.",
    "Для блеска, если дожмут терминами: коллизии в Swift решаются линейным пробированием (open addressing), хеш - SipHash со случайным seed, что заодно защищает от подобранных ключей, деградирующих таблицу до O(n)."
  ],
  trap:"\"Вставка в массив O(1) везде\" - нет: O(1) амортизированно только в конец; в середину всегда O(n). Ровно это спрашивают на скрининге." },

{ id:"s21", topic:"swift",
  q:"Дженерики в протоколах: associatedtype и where в методах",
  code:"protocol Container {\n    associatedtype Item\n    var items: [Item] { get }\n}\n\nextension Container where Item: Equatable {\n    func contains(_ item: Item) -> Bool {\n        items.contains(item)\n    }\n}\n\nfunc merge<A: Container, B: Container>(_ a: A, _ b: B) -> [A.Item]\n    where A.Item == B.Item {\n    a.items + b.items\n}",
  frame:"Определение в одну фразу: associatedtype - это дженерик протокола, где реализация выбирает конкретный тип, а не вызывающая сторона. Дженерик - входной параметр типа (задаёт вызывающий в точке вызова, каждый раз заново), associated type - выходной (реализация фиксирует раз и навсегда: Array объявил свой Element - ты берёшь что дали). where-клаузы дают условную функциональность: extension со where добавляет методы только подходящим реализациям; в generic-функциях where связывает associated types разных параметров.",
  details:[
    "Почему протокол с associatedtype нельзя было класть в переменную: это не один тип, а семейство типов - компилятор не может назвать тип результата first(), он у каждой реализации свой. \"Абстрактный договор без информации, чем оперируем\" - формулировка следствия на второй ход.",
    "Зачем придумали: без него Collection не выражается - пришлось бы плодить CollectionOfInt/CollectionOfString или возвращать Any с ручными кастами.",
    "Conditional conformance - вершина темы: extension Array: Equatable where Element: Equatable - массив равен, когда равны элементы.",
    "Жизненный кейс: protocol Repository с associatedtype Model - var repo: Repository не компилируется; выходы: дженерик-класс или primary associated type + any Repository<User> (Swift 5.7). Эта пара строк - самый сильный ответ на тему.",
    "Primary associated types (Swift 5.7): protocol Container<Item> - можно писать some Container<Int> и any Container<Int>.",
    "На лайвкодинге просят дописать where к готовому методу - тренируй чтение сигнатур вслух: \"для любых двух контейнеров с одинаковым типом элемента\".",
    "Self-requirement (protocol Comparable) - вторая причина, почему протокол исторически не жил как тип."
  ],
  trap:"Писать contains через any Equatable - не скомпилируется и выдаст непонимание: условное расширение со where - единственный чистый путь." },

{ id:"s22", topic:"swift",
  q:"Зачем нужен mutating и почему его нельзя вызвать на let?",
  frame:"Self внутри метода структуры по умолчанию константа. mutating меняет это: делает self inout-параметром - метод получает саму переменную, а не копию, и при выходе результат записывается обратно. Отсюда оба следствия: на let-экземпляре mutating-метод не вызовешь - ошибка компиляции cannot use mutating member on immutable value (let замораживает структуру целиком); у классов пометки нет вообще - там self ссылка, поля мутабельны всегда.",
  details:[
    "Снять ложную посылку: структура создана не \"чтобы не мутировать\", а для value-семантики. Мутация структуры локальна по определению - твоя копия только твоя, менять её нормально.",
    "x += 1 внутри метода - это self.x += 1: self подразумевается, изменение идёт через него.",
    "mutating ничего не стоит в рантайме - это пометка компилятору, не механизм."
  ],
  trap:"\"mutating - редкая и опасная штука\" - неверная интуиция: он повсюду в stdlib и бесплатен. Опасно наоборот - мутировать общее состояние класса, где изменение видят все владельцы." },

{ id:"s23", topic:"swift",
  q:"Когда моделировать состояния enum-ом, а когда классом/протоколом?",
  frame:"Ключ - исчерпаемость: компилятор знает все кейсы enum, поэтому switch без default обязан покрыть каждый. Добавил кейс - все switch по проекту перестали компилироваться, и это подарок: физически не забудешь обработать состояние. Правило: закрытый набор состояний, известный целиком - enum (ViewState: loading, loaded, error); открытый набор, который расширят снаружи - протокол или класс.",
  details:[
    "Сильная фраза: enum убирает невозможные состояния конструктивно. Класс с опциональными полями допускает \"loading с ошибкой внутри\"; enum с associated values такие комбинации исключает на уровне типа.",
    "default в switch по своему enum - глушит проверку: добавил кейс, компилятор молчит, ветка молча уехала в default. В своём коде default не ставим.",
    "С системными enum наоборот: они non-frozen (library evolution), Apple оставила право пополнять - компилятор сам требует default. @frozen - тема библиотек с ABI-стабильностью, в приложении не нужен.",
    "Красивое слово для ответа: экран - конечный автомат, enum - его прямое отображение в тип; переходы - функции (старое состояние, событие) -> новое. Поэтому в Redux-подобных архитектурах reducer - это switch по enum.",
    "На реальных собесах это спрашивают не \"в чём разница\", а задачей: дают код и ждут \"тут enum, потому что не забуду обработать кейсы\"."
  ],
  trap:"Ответить \"enum - это как в C, набор значений\" - мимо: в Swift кейс носит данные (associated values), и в этом вся сила моделирования." },

{ id:"s24", topic:"swift",
  q:"Extension: что можно добавить, что нельзя и почему?",
  frame:"Можно - любому типу, даже чужому:\n1. Методы и вычисляемые свойства.\n2. Вложенные типы и сабскрипты.\n3. Соответствие протоколам.\nНельзя два, и у каждого запрета своя причина:\n1. Хранимые свойства - extension не может менять размер типа, он зафиксирован при компиляции.\n2. Переопределение существующих методов - extension не наследование, у его методов нет слота в таблице методов. Объявишь метод, который уже есть в типе - не override, а ошибка компиляции invalid redeclaration.",
  details:[
    "Главная ценность своими словами: расширять тип извне, когда исходник недоступен - Int, UIView, чужие типы из библиотек.",
    "Сеньорское следствие: методы extension класса диспетчеризуются статически - наследник объявит \"такой же\" метод, а вызов пойдёт по статическому типу переменной; полиморфизм не работает, хотя код выглядит правильно.",
    "Оговорка: если extension добавляет соответствие протоколу, вызовы через протокол идут динамически, через witness table - статика про прямые вызовы.",
    "Побочная польза: extension-ы как способ нарезать тип по протоколам и логическим блокам - принятый стиль."
  ],
  trap:"\"Добавлю хранимое свойство через extension с associated objects\" - это Obj-C-рантайм-хак, а не фича Swift; на вопрос о причинах запрета отвечай про фиксированный размер типа." },

{ id:"s25", topic:"swift",
  q:"Protocol witness table: что это и какова цена вызова через протокол?",
  frame:"1. Protocol witness table - таблица адресов реализаций. Компилятор создаёт её на этапе сборки на пару \"тип + протокол\": три протокола у типа - три таблицы. В рантайме она только читается.\n2. Когда переменная объявлена типом протокола, конкретный тип потерян - а место под переменную выделить надо, и размеры у разных типов разные. Поэтому значение упаковывается в existential container - коробку фиксированного размера: небольшой буфер под данные плюс указатели на witness table и на метаданные типа. Не влезло в буфер - данные уезжают в кучу.\n3. Цена вызова - не сам прыжок по адресу из таблицы, а потеря инлайна (компилятор не может встроить вызов по месту) и всей цепочки оптимизаций за ним.\n4. Как не платить: дженерик с ограничением протоколом или some - тип известен компилятору, коробка не нужна. Вывод: платишь за коробку, когда нужна разнородность; не нужна - не платишь.",
  details:[
    "Existential по смыслу: \"существует некий конкретный тип, соответствующий протоколу, но какой - не знаю\". Some - противоположность: тип известен компилятору, скрыто только имя.",
    "Размер inline-буфера - три машинных слова, но сам это не вываливай: скажи \"упаковывается в existential container, при превышении inline-буфера уезжает в кучу\" - спросят про размер, ответишь. Знать и вываливать - разные вещи.",
    "Не путать с side table из ARC: та - счётчики ссылок сбоку от объекта, эта - адреса реализаций протокола у типа.",
    "Причинность прямая: выбрал дженерик - компилятор специализирует и встраивает; выбрал any - вызовы косвенные всегда, это твой выбор, а не везение."
  ],
  trap:"\"Таблица создаётся на каждый объект\" - нет: одна на пару тип+протокол, создана на компиляции, рантайм только читает." },

{ id:"s17", topic:"swift",
  q:"inout - это передача по ссылке?",
  frame:"Нет. Семантика copy-in copy-out: на входе создаётся копия аргумента, функция работает с ней, при выходе результат записывается обратно в исходную переменную. Компилятор может оптимизировать до настоящей ссылки, но рассчитывать на это нельзя - наблюдаемое поведение именно копирования туда-обратно.",
  details:[
    "Отсюда запреты: нельзя передать let, нельзя алиасить одну переменную в два inout-параметра (exclusivity), & на call-site - маркер, а не адрес.",
    "Escaping-замыкание не может захватить inout-параметр: к моменту вызова copy-out уже произошёл.",
    "Свойство с наблюдателями через inout: didSet сработает при copy-out, даже если функция ничего не меняла."
  ],
  trap:"Сказать \"это как указатель в C\" - минус: механика другая, и exclusivity enforcement (ошибка одновременного доступа) объясняется именно copy-in copy-out моделью." },

{ id:"s18", topic:"swift",
  q:"map, compactMap, flatMap, reduce - разница одной фразой каждая?",
  code:"[1, 2, 3].map { $0 * 2 }                    // [2, 4, 6]\n[\"1\", \"x\", \"3\"].compactMap { Int($0) }      // [1, 3] - nil выброшены\n[[1, 2], [3]].flatMap { $0 }                // [1, 2, 3] - разгладил\n\n// reduce: копилка едет из итерации в итерацию\nlet sum = [1, 2, 3, 4].reduce(0) { acc, x in acc + x }\n// шаги: 0+1=1 -> 1+2=3 -> 3+3=6 -> 6+4=10\n// короче: [1, 2, 3, 4].reduce(0, +)\n\n// копилка может быть чем угодно - хоть словарём частот:\nlet freq = [\"a\", \"b\", \"a\"].reduce(into: [:]) { acc, ch in\n    acc[ch, default: 0] += 1\n}   // [\"a\": 2, \"b\": 1]; into: даёт копилку как inout - без копий",
  frame:"1. map - преобразует каждый элемент, структура сохраняется.\n2. compactMap - преобразует и выбрасывает nil.\n3. flatMap - преобразует и разглаживает вложенные коллекции на один уровень.\n4. reduce - сворачивает коллекцию в одно значение через аккумулятор-копилку: стартуешь с начального значения, на каждом элементе функция получает накопленное плюс элемент и возвращает новое накопленное; что осталось в копилке в конце - и есть результат ([1,2,3].reduce(0, +) даёт 6).",
  details:[
    "Мнемоника различия: flatMap управляет структурой, compactMap - содержимым.",
    "flatMap на Optional - это map без двойной вложенности: Optional.flatMap возвращает U?, а не U??.",
    "reduce(into:) - эффективная форма для аккумуляторов-коллекций: мутирует inout-аккумулятор вместо копий.",
    "Исторически flatMap с nil-фильтрацией deprecated и переименован в compactMap (Swift 4.1) - деталь для стажа."
  ],
  trap:"Просят написать map или reduce руками (см. live coding) - реализация map: пустой массив с reserveCapacity, цикл, append(transform(el))." },

{ id:"s19", topic:"swift",
  q:"Stack vs Heap. Сколько стеков в приложении?",
  frame:"1. Стек - по одному на каждый поток: у main 1 МБ, у фоновых по умолчанию 512 КБ. Аллокация - сдвиг указателя, освобождение автоматом при выходе из скоупа.\n2. Куча - одна на процесс (процесс - запущенный экземпляр приложения с собственным адресным пространством; все его потоки делят одну память): динамические аллокации, время жизни управляется ARC, дороже из-за поиска места и синхронизации аллокатора.",
  details:[
    "\"Сколько стеков?\" - вопрос-фильтр: ответ \"по числу потоков\", а не \"один\".",
    "На стеке: локальные значения, фреймы вызовов; в куче: объекты классов, escaping-контексты замыканий, CoW-буферы, большие existential-значения.",
    "Переполнение стека - глубокая рекурсия; размер стека потока можно задать при создании Thread."
  ],
  trap:"Связка с предыдущим: \"структуры на стеке\" - верно только для локальных переменных; поле класса или захват в escaping-замыкании кладёт структуру в кучу." },

{ id:"s16", topic:"swift",
  q:"Модификаторы доступа: open vs public и зачем это различие?",
  frame:"От самого открытого к самому закрытому:\n1. open - видно, наследуется и переопределяется из другого модуля.\n2. public - видно снаружи, но наследование и override только внутри модуля.\n3. internal - дефолт: видно в пределах модуля.\n4. fileprivate - в пределах файла.\n5. private - в пределах объявления (плюс extensions в том же файле).\nРазличие open/public - инструмент авторов библиотек: закрытая по умолчанию иерархия.",
  details:[
    "public class без open - наследуй внутри модуля, снаружи нельзя.",
    "private в Swift виден в extensions того же файла - мягче, чем кажется.",
    "Доступ по умолчанию internal - в монорепе с модулями это осмысленная граница API.",
    "Explicit API mode - режим, в котором компилятор заставляет писать public/internal явно; включают в модульных проектах."
  ],
  trap:"open работает только для классов и их членов - протоколам и структурам он не нужен, наследования нет." },

{ id:"a1", topic:"arch",
  q:"MVC / MVVM / VIPER / Clean - сравни и скажи, когда что выбрать",
  frame:"1. MVC от Apple: быстро стартовать, но VC срастается с view и пухнет (massive view controller), логика нетестируема.\n2. MVVM: ViewModel забирает состояние экрана и презентационную логику, View пассивна, binding через Combine или замыкания - тестируется без UI.\n3. VIPER: пять ролей с жёсткими контрактами - максимум разделения, максимум бойлерплейта; оправдан в больших командах с кодогенерацией.\n4. Clean - не паттерн экрана, а правило зависимостей для всего приложения: слои смотрят внутрь, домен не знает о фреймворках.",
  details:[
    "Критерии выбора: размер команды и фичи, требования к тестам, скорость итераций, порог входа новичков.",
    "Твой честный ответ: продукт писал с нуля на MVVM+Combine, сейчас - MVVM поверх слоёной архитектуры Entity/UseCase/Repository/DataSource.",
    "MVVM-ловушка: ViewModel не должна импортировать UIKit/SwiftUI - иначе тестируемость и переносимость умерли.",
    "Про VIPER можно честно: работал рядом, вижу цену бойлерплейта - это нормальный сеньорский ответ, если аргументируешь."
  ],
  trap:"Религиозная война \"X лучше всех\" - минус; интервьюер ждёт трейд-оффы и привязку к контексту команды." },

{ id:"a2", topic:"arch",
  q:"Слои Entity / UseCase / Repository / DataSource - зачем такое деление?",
  frame:"Clean-слои данных и домена:\n1. Entity - доменная модель без зависимостей.\n2. UseCase - одна бизнес-операция, оркестрирует репозитории.\n3. Repository - абстракция над данными, интерфейс объявлен в домене.\n4. DataSource - конкретика (сеть, база, кэш) за этим интерфейсом.\nПравило зависимостей: всё смотрит внутрь, домен не знает, откуда данные.",
  details:[
    "Профит на пальцах: подменил DataSource (мок, кэш, другой бэкенд) - домен и UI не заметили; UseCase тестируется на моках репозиториев.",
    "Твой живой пример: в текущем проекте это формализовано в правилах архитектуры, каждый новый класс проходит это сито.",
    "Repository склеивает источники: сеть + кэш + маппинг DTO -> Entity живут за одним интерфейсом.",
    "Не перебарщивать: экран из одного запроса не требует четырёх слоёв - зрелость в дозировке."
  ],
  trap:"Путать Repository и DataSource: репозиторий - абстракция и склейка источников, дата-сорс - один конкретный источник." },

{ id:"a3", topic:"arch",
  q:"SOLID - по букве с iOS-примером",
  frame:"1. S - один повод меняться: сеть не живёт в VC, у каждого класса одна ответственность.\n2. O - открыт для расширения, закрыт для изменения: новый тип ячейки добавляется новым классом через протокол/registry, а не новым case в switch.\n3. L - подтип встаёт на место базового без сюрпризов: наследник не ужесточает предусловия и не ломает контракт.\n4. I - протоколы маленькие: не заставляй реализовывать пустые методы, дроби жирные делегаты.\n5. D - зависим от абстракций: ViewModel знает протокол репозитория, а не URLSession.",
  details:[
    "Живые антипримеры сильнее определений: massive VC для S, switch по типам ячеек на десять экранов для O, optional-методы протокола \"на всякий\" для I.",
    "L в iOS-жизни: сабкласс UIView, который перестал звать super.layoutSubviews - формально компилируется, контракт сломан.",
    "D - это не только DI-контейнер: обычный init(repository: SomeProtocol) уже Dependency Inversion.",
    "Свяжи буквы: I и D вместе дают тестируемость - маленький протокол легко замокать."
  ],
  trap:"Отбарабанить расшифровку без примеров - на сеньорском уровне это незачёт; по одному конкретному кейсу на букву." },

{ id:"a4", topic:"arch",
  q:"Какие паттерны проектирования используешь в работе?",
  frame:"Рабочий набор iOS-разработчика:\n1. Delegate - связь один-к-одному через weak-ссылку; на нём половина UIKit.\n2. Observer - один-ко-многим: NotificationCenter, KVO, Combine.\n3. Singleton - осознанно и редко: URLSession.shared, свои сервисы лучше через DI.\n4. Factory - создание экранов и зависимостей, скрывает конкретные типы за протоколом.\n5. Builder - пошаговая сборка сложного объекта: сетевые запросы fluent-цепочкой.\n6. Adapter - подгоняет чужой интерфейс под ожидаемый: мост аналитики к контракту дизайн-системы.\n7. Facade - один удобный вход в сложную подсистему.\n8. Coordinator - навигация отдельно от экранов.",
  details:[
    "Минусы Singleton, и на этом вопросе обязаны прозвучать тесты: скрытая зависимость (в сигнатурах не видна), глобальное мутабельное состояние, и главное - не подменишь и не изолируешь в тестах. Лечится DI: тот же инстанс, но приходит через init как протокол.",
    "Facade vs Adapter одной фразой: фасад делает удобно, адаптер делает совместимо.",
    "У Apple из коробки: delegate, target-action, observer (KVO/NotificationCenter), singleton (URLSession.shared), chain of responsibility - responder chain.",
    "Твой продакшен-пример адаптера: мост аналитики - app-уровневый менеджер адаптируется под контракт компонентов дизайн-системы.",
    "Singleton лечится DI: тот же shared-инстанс, но приходит через init как протокол - подменяемый в тестах.",
    "Responder chain как chain of responsibility - деталь, которая всегда нравится интервьюерам."
  ],
  trap:"На \"минусы Singleton\" обязаны прозвучать тесты - в реальных вопросниках это прописано как ожидание." },

{ id:"a5", topic:"arch",
  q:"System Design: аналог TikTok, мобильная архитектура без бэкенда",
  frame:"Канва на 20 минут.\n1. Уточнить требования: бесконечная вертикальная лента видео, свайпы, лайки, комменты, офлайн не критичен.\n2. Слои: presentation MVVM + Coordinators (обосновать: тестируемость + управляемая навигация), domain с use cases, data - API + кэши.\n3. Ключевые решения, где живёт сложность: пагинация курсором, префетч следующих N видео, пул переиспользуемых плееров (3-5 AVPlayer, скользящее окно), дисковый LRU-кэш, отмена загрузок при быстром свайпе.\n4. DI через composition root по фичам, дизайн-система как отдельный модуль токенов и компонентов.",

    "Рисуй слои и поток данных, проговаривай трейд-оффы вслух - оценивают ход мысли, не диаграмму."
